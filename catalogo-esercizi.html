<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catalogo esercizi · SDC Training</title><style>
:root{--theme-accent:#ffd400}*{box-sizing:border-box}body{margin:0;background:#101113;color:#f4f4f4;font:15px system-ui,sans-serif}main{max-width:920px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:12px 0}p,small{color:#b7babd}label{display:block;margin:16px 0 6px}input,select,.btn{font:inherit;padding:12px;border-radius:12px;border:1px solid #ffffff25;color:white;background:#292c30;min-height:44px}input,select{width:100%}.actions{display:flex;gap:12px;margin:20px 0}.btn{cursor:pointer}.sdc-library-card strong{color:#fff}.sdc-library-card small{color:#aaa}a{color:#ffd400}.brand{color:#ffd400;font-size:12px;font-weight:900;letter-spacing:2px}
.sdc-library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.sdc-library-card{min-width:0;border:1px solid #ffffff20;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}.sdc-library-card strong{overflow-wrap:anywhere}.sdc-library-card details{font-size:11px}.sdc-ex-image{width:100%;aspect-ratio:4/3;background-size:400% 400%;background-repeat:no-repeat;background-color:#fff;border-radius:10px}.sdc-ex-image-large{max-width:480px;margin:0 auto 10px}.sdc-ex-credit{display:block;font-size:10px;line-height:1.5;overflow-wrap:anywhere;margin-bottom:14px}.sdc-ex-credit a{color:var(--theme-accent,#ffd400)}.sdc-image-picker{font-size:10px!important;min-height:32px;padding:6px 10px!important;margin-top:5px;position:relative;z-index:2}@media(max-width:600px){.sdc-library-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sdc-library-card{padding:8px}.sdc-library-card .btn{padding:8px;font-size:12px}}
</style><main><div class="brand">SDC TRAINING</div><h1>Catalogo esercizi</h1><p id="catalogCount">Caricamento…</p><p>Solo disegni. Per salvare un abbinamento usa “Abbina immagine” nella scheda del cliente.</p><a href="./">Torna all’app</a><label for="search">Cerca esercizio</label><input id="search" type="search" placeholder="Es. alzate laterali, low row, pressa orizzontale, RDL" oninput="page=0;draw()"><label for="group">Gruppo</label><select id="group" onchange="page=0;draw()"><option value="">Tutti i gruppi</option></select><div id="results"></div></main><script>
let exerciseCatalog=[],page=0;const exerciseGroupLabels={Abs:'Addominali',Arms:'Braccia',Back:'Schiena',Calves:'Polpacci',Chest:'Petto',Legs:'Gambe',Shoulders:'Spalle',Cardio:'Cardio'};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function exerciseNameKey(name){return String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function exerciseSearchKey(value){const forms={manubrio:'manubri',alzata:'alzate',bilancieri:'bilanciere',stacco:'stacchi',rumeno:'rumeni',laterale:'laterali',affondo:'affondi',trazione:'trazioni',gamba:'gambe',tesa:'tese',tesi:'tese'};return exerciseNameKey(value).replace(/lowrow/g,'low row').replace(/latmachine/g,'lat machine').replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(/\s+/).map(word=>forms[word]||word).join(' ');}
function exerciseSearchResults(query,group=''){const key=exerciseSearchKey(query),words=key.split(' ').filter(Boolean);return (exerciseCatalog||[]).filter(item=>(!group||item.group===group)&&words.every(word=>exerciseSearchKey([item.name,...item.names,...item.equipment,exerciseGroupLabels[item.group]||item.group].join(' ')).includes(word))).sort((a,b)=>{const score=item=>key&&item.names.some(name=>exerciseSearchKey(name)===key)?0:1;return score(a)-score(b);});}
function exerciseImageTile(item,large=false){const x=(item.tile%4)*100/3,y=Math.floor(item.tile/4)*100/3;return `<div class="sdc-ex-image ${large?'sdc-ex-image-large':''}" role="img" aria-label="${esc(item.name)}" style="background-image:url('./${esc(item.atlas)}');background-position:${x}% ${y}%"></div>`;}
function exerciseImageCredit(item){if(item.generated)return `<small class="sdc-ex-credit">${esc(item.credit)}. Immagine ridimensionata e compressa.</small>`;return `<small class="sdc-ex-credit">${esc(item.credit)} · <a href="${esc(item.licenseUrl)}" target="_blank" rel="noopener">${esc(item.license)}</a> · <a href="${esc(item.source)}" target="_blank" rel="noopener">Fonte wger</a>. Immagine ridimensionata e compressa.</small>`;}
function draw(){const rows=exerciseSearchResults(document.getElementById('search').value,document.getElementById('group').value),start=page*16;document.getElementById('results').innerHTML=`<p>${rows.length} risultati${rows.length?' · '+(start+1)+'–'+Math.min(start+16,rows.length):''}</p><div class="sdc-library-grid">${rows.slice(start,start+16).map(item=>`<article class="sdc-library-card">${exerciseImageTile(item)}<strong>${esc(item.name)}</strong><small>${esc(exerciseGroupLabels[item.group]||item.group)}</small><details><summary>Fonte e licenza</summary>${exerciseImageCredit(item)}</details></article>`).join('')}</div><div class="actions">${page?'<button class="btn" onclick="page--;draw()">Precedenti</button>':''}${start+16<rows.length?'<button class="btn" onclick="page++;draw()">Successivi</button>':''}</div>`;}
fetch('./exercise-catalog.json').then(response=>{if(!response.ok)throw Error();return response.json()}).then(rows=>{exerciseCatalog=rows;document.getElementById('catalogCount').textContent=rows.length+' esercizi illustrati · Ricerca in italiano e inglese';document.getElementById('group').insertAdjacentHTML('beforeend',[...new Set(rows.map(item=>item.group))].sort().map(group=>`<option value="${esc(group)}">${esc(exerciseGroupLabels[group]||group)}</option>`).join(''));draw()}).catch(()=>{document.getElementById('catalogCount').textContent='Catalogo non disponibile. Riprova.'});
</script></html>
