body{background:#020408;color:#fff}

.btn{background:linear-gradient(135deg,#4a9eff,#2a5bff);box-shadow:0 0 20px rgba(42,91,255,0.5);border:1px solid rgba(120,180,255,0.5);font-weight:800}

<script>
// FUNZIONE GLOBALE - DEVE ESSERE PRIMA DEL BODY
function entra(){
  var pw = document.getElementById('pw').value.trim();
  if(pw!== 'sdc2024' && pw!== 'cliente123'){ alert('Codice errato! Usa: sdc2024'); return; }
  var sel = document.getElementById('sel').value;
  var clients = ["Marcus Vance","Amara Osei","Dante Moretti","Sofia Ricci","Luca Bianchi"];
  window.cur = sel;
  window.curName = clients[sel];
  window.isTrainer = (pw === 'sdc2024');
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('nav').style.display='flex';
  document.getElementById('hName').innerText = window.curName;
  document.getElementById('roleBadge').innerText = window.isTrainer? '● TRAINER' : '● CLIENT';
  showPage('scheda');
  listenAll();
}
function showPage(p){
  ['scheda','appuntamenti','peso','pay'].forEach(function(x){document.getElementById('page-'+x).classList.add('hidden')});
  document.getElementById('page-'+p).classList.remove('hidden');
}
</script>

</div>

<button onclick="entra()" ontouchstart="entra()" class="w-full mt-6 btn rounded-full py-4 text-[13px] text-white">ENTRA NEL SISTEMA →</button>
<p class="text-[10px] text-center mt-4 text-emerald-400 font-bold">● SYSTEM ONLINE - CLICCA IL BOTTONE BLU</p>
</div>
</div>
</div>

<div id="app" class="hidden">

<button onclick="showPage('pay')" class="px-5 py-2 text-zinc-500 text-[10px] font-bold">PAY</button>
</div>
