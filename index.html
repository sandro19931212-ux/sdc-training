<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SDC V10 - EDITABILE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
body{background:#0a0a0c;color:#fff;font-family:Inter,sans-serif}
.glass{background:#17171a;border:1px solid #2a2a2e;border-radius:20px}
.btn{background:#fff;color:#000;border-radius:999px;font-weight:900}
.ex-card{background:#151518;border:1px solid #26262b;border-radius:18px}
.input-dark{background:#0e0e10;border:1px solid #2a2a2e;border-radius:12px;color:#fff;text-align:center;font-weight:700}
.nav-active{background:#fff;color:#000!important}
</style>
</head>
<body class="pb-28">
<script>
function entra(){var sel=document.getElementById('sel').value;var c=["Marcus Vance","Amara Osei","Dante Moretti","Sofia Ricci","Luca Bianchi"];window.cur=sel;window.curName=c[sel];document.getElementById('login').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('nav').style.display='flex';document.getElementById('hName').innerText=window.curName;showPage('dashboard');try{listenAll()}catch(e){}}
function showPage(p){['dashboard','scheda','pagamenti','appuntamenti'].forEach(x=>{document.getElementById('page-'+x).classList.add('hidden')});document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('.nav-item').forEach(el=>{el.classList.remove('nav-active')});document.getElementById('btn-'+p).classList.add('nav-active')}
</script>

<div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
<div style="width:100%;max-width:380px;text-align:center"><h1 style="font-size:48px;font-weight:900;letter-spacing:-2px;line-height:.9">SDC<br>TRAINING</h1><p style="font-size:10px;letter-spacing:3px;color:#666;font-weight:700;margin-top:12px">V10 EDITABILE</p>
<div class="glass p-6 mt-8 text-left">
<select id="sel" class="w-full bg-black border border-zinc-800 rounded-2xl p-4 text-white font-bold"><option value="0">Marcus Vance</option><option value="1">Amara Osei</option><option value="2">Dante Moretti</option><option value="3">Sofia Ricci</option><option value="4">Luca Bianchi</option></select>
<input id="pw" type="password" value="sdc2024" class="w-full bg-white rounded-2xl p-4 mt-4 text-black font-bold">
<button onclick="entra()" class="btn w-full mt-6 py-4">ENTRA →</button>
</div></div></div>

<div id="app" class="hidden">
<div class="px-6 pt-8"><h1 style="font-size:22px;font-weight:900">SDC TRAINING</h1><p class="text-xs text-zinc-500 mt-1">Ciao, <span id="hName" class="text-white font-bold">Marcus</span></p></div>

<div id="page-dashboard" class="px-5 mt-6"><div class="glass p-5"><p class="text-xs text-zinc-500">TODAY</p><h2 class="font-black text-xl mt-1">STRENGTH & POWER</h2></div></div>

<div id="page-scheda" class="hidden px-5 mt-6">
<div class="flex justify-between items-center"><h2 class="font-black text-xl">SCHEDA</h2><button onclick="addEx()" class="btn px-5 py-2 text-xs">+ ESERCIZIO</button></div>
<p class="text-[11px] text-zinc-500 mt-2">Il cliente può modificare serie, rep e carico</p>
<div id="exList" class="mt-4 space-y-3"></div>
</div>

<div id="page-pagamenti" class="hidden px-5 mt-6"><h2 class="font-black text-xl">PAGAMENTI</h2><button onclick="addPay()" class="btn px-5 py-2 text-xs mt-3">+ Incasso</button><div id="payList" class="mt-4"></div></div>
<div id="page-appuntamenti" class="hidden px-5 mt-6"><h2 class="font-black text-xl">APPUNTAMENTI</h2><button onclick="addAp()" class="btn px-5 py-2 text-xs mt-3">+ Prenota</button><div id="apList" class="mt-4"></div></div>
</div>

<div id="nav" class="hidden fixed bottom-4 left-4 right-4 glass flex justify-around py-3 px-2 rounded-[28px] z-50">
<button id="btn-dashboard" onclick="showPage('dashboard')" class="nav-item nav-active flex flex-col items-center px-5 py-2 rounded-2xl"><span>⌂</span><span class="text-[9px] font-bold">DASHBOARD</span></button>
<button id="btn-scheda" onclick="showPage('scheda')" class="nav-item flex flex-col items-center px-5 py-2 rounded-2xl text-zinc-500"><span>◫</span><span class="text-[9px] font-bold">SCHEDA</span></button>
<button id="btn-pagamenti" onclick="showPage('pagamenti')" class="nav-item flex flex-col items-center px-5 py-2 rounded-2xl text-zinc-500"><span>€</span><span class="text-[9px] font-bold">PAGAMENTI</span></button>
<button id="btn-appuntamenti" onclick="showPage('appuntamenti')" class="nav-item flex flex-col items-center px-5 py-2 rounded-2xl text-zinc-500"><span>◷</span><span class="text-[9px] font-bold">APPUNT
