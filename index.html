<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SDC Training</title>
<style>
:root{
  --bg:#000;
  --panel:#05080f;
  --panel2:#0a1220;
  --panel3:#0d1829;
  --line:rgba(91,147,255,.22);
  --line-2:rgba(91,147,255,.32);
  --blue:#49a3ff;
  --blue2:#9ad8ff;
  --blue3:#1d62ff;
  --text:#f7f9fc;
  --muted:#8e99ab;
  --danger:#ff667f;
  --ok:#58e7a6;
  --glow:0 0 26px rgba(40,126,255,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
input,select,textarea{
  width:100%;padding:13px 14px;border-radius:16px;border:1px solid rgba(115,156,235,.24);
  background:rgba(7,10,16,.96);color:var(--text);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(73,163,255,.13)}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#000}
.loginbox{
  width:min(430px,100%);padding:34px 24px 28px;border-radius:30px;
  background:linear-gradient(145deg,rgba(9,13,22,.98),rgba(2,4,7,.98));
  border:1px solid var(--line);box-shadow:0 0 70px rgba(30,115,255,.12);
}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  width:52px;height:52px;border-radius:16px;
  background:radial-gradient(circle at 30% 25%,#8ae2ff,transparent 30%),linear-gradient(160deg,#38a8ff 0%,#113d8d 56%,#071324 100%);
  clip-path:polygon(50% 0,84% 22%,67% 50%,84% 78%,50% 100%,16% 78%,33% 50%,16% 22%);
  box-shadow:0 0 20px rgba(73,163,255,.45);
}
.brand-title{font-weight:900;line-height:1;font-size:34px;letter-spacing:3px}
.brand-title span{display:block;font-size:18px;font-weight:300;letter-spacing:6px;color:#d7ecff}
.tag{text-align:left;color:var(--muted);margin:18px 0 26px;font-size:14px}
label{display:block;font-size:12px;color:#b0c1d7;margin:14px 0 7px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.primary,.btn,.mini-btn,.day-tab,.nav-btn,.ghost-btn{transition:.18s ease}
.primary,.btn,.mini-btn,.ghost-btn{
  border:1px solid rgba(98,146,240,.22);border-radius:16px;
  background:linear-gradient(180deg,rgba(12,18,31,.98),rgba(6,8,14,.98));
  color:#fff;padding:12px 15px;
}
.primary{
  width:100%;margin-top:20px;font-weight:900;letter-spacing:.08em;
  background:linear-gradient(135deg,#87e4ff,#2780ff 54%,#1e57db 100%);
  color:#03121c;border:0;box-shadow:0 10px 30px rgba(39,128,255,.28)
}
.btn.blue,.mini-btn.blue{background:linear-gradient(135deg,#0c1e34,#143d76);border-color:#2d71c6;color:#d7efff;box-shadow:0 0 20px rgba(39,128,255,.13)}
.btn.red,.mini-btn.red{color:#ffb3be;border-color:#5b2032;background:linear-gradient(180deg,rgba(35,12,18,.95),rgba(23,7,11,.98))}
.ghost-btn{padding:11px 13px;background:rgba(10,14,22,.8);color:#d6e8ff}
.btn:hover,.mini-btn:hover,.ghost-btn:hover{transform:translateY(-1px);border-color:#4d8fed}
.error{min-height:20px;color:#ff8ea3;text-align:center;font-size:13px;margin-top:12px}
.app{min-height:100vh}
.top{
  position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:14px 18px;background:rgba(2,4,8,.86);border-bottom:1px solid rgba(53,87,140,.25);backdrop-filter:blur(16px)
}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.top .brand-mark{width:36px;height:36px;border-radius:12px}
.top .brand-title{font-size:20px;letter-spacing:2px}.top .brand-title span{font-size:11px;letter-spacing:4px}
.tagline{display:none;color:#7c98bc;font-size:10px;letter-spacing:.28em;text-transform:uppercase;line-height:1.45;margin-left:8px}
.user-right{display:flex;align-items:center;gap:10px}
.userpill{border:1px solid rgba(95,141,222,.24);border-radius:999px;padding:8px 12px;color:var(--blue2);font-size:11px;background:rgba(8,13,21,.75);white-space:nowrap}
.profilechip{width:44px;height:44px;border-radius:999px;border:1px solid rgba(95,141,222,.26);display:grid;place-items:center;background:rgba(8,13,21,.8);color:#dcecff;font-size:19px;box-shadow:0 0 18px rgba(41,120,255,.09)}
.wrap{width:min(100%,980px);margin:auto;padding:18px 16px 116px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.card{background:linear-gradient(145deg,rgba(8,13,22,.98),rgba(2,4,8,.98));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--glow)}
.stat{padding:16px 14px}
.stat b{font-size:28px;display:block}.stat span{color:var(--muted);font-size:12px}
.page-head{padding:18px 18px 14px;border-radius:30px;background:linear-gradient(160deg,rgba(5,10,20,.95),rgba(2,3,6,.98));border:1px solid var(--line);box-shadow:var(--glow);margin-bottom:16px}
.page-kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#5eb9ff;font-weight:800;margin-bottom:10px}
.page-head h1{font-size:32px;line-height:1.06;margin:0 0 8px}
.page-sub{color:#9aa8be;font-size:14px}
.section{margin:18px 0}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.section h2{font-size:22px;margin:0}.subtle-note{color:var(--muted);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.list{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(145deg,rgba(8,11,18,.92),rgba(4,6,10,.94));border:1px solid rgba(80,112,170,.18)}
.row strong{display:block}.row small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;background:rgba(13,35,57,.75);color:#9bd2ff;font-size:10px;border:1px solid rgba(73,163,255,.18);text-transform:uppercase;letter-spacing:.08em}
.badge.ok{background:rgba(11,45,34,.8);color:#a5f1cb;border-color:rgba(88,231,166,.2)}
.badge.due{background:rgba(47,18,23,.82);color:#ffb7c1;border-color:rgba(255,102,127,.24)}
.empty{text-align:center;color:#76859c;padding:20px 12px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,rgba(9,12,19,.98),rgba(3,5,8,.99));border:1px solid rgba(85,126,196,.24);border-radius:24px;padding:22px;box-shadow:0 0 60px rgba(0,0,0,.45)}
.modalbox h2{margin:0 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.bottom{
  position:fixed;z-index:30;left:18px;right:18px;bottom:12px;display:flex;justify-content:space-between;gap:8px;
  padding:12px 10px calc(12px + env(safe-area-inset-bottom));border-radius:34px;
  background:#02050a;border:1px solid rgba(47,111,219,.46);
  box-shadow:0 16px 36px rgba(0,0,0,.58), 0 0 20px rgba(26,105,255,.12);backdrop-filter:blur(16px)
}
.nav-btn{
  position:relative;flex:1;border:0;background:transparent;color:#8594ab;border-radius:24px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0
}
.nav-btn .nav-ico{
  width:42px;height:42px;border-radius:999px;border:1px solid transparent;display:grid;place-items:center;
  background:transparent;color:inherit;overflow:hidden
}
.nav-btn .nav-ico img{width:27px;height:27px;object-fit:contain;display:block;opacity:.72;filter:saturate(.75) brightness(.82)}
.nav-btn .nav-label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-btn.active{color:#edf6ff}
.nav-btn.active .nav-ico{
  background:linear-gradient(180deg,#0f3a6e,#081b33);
  border-color:#2f9bff;color:#75d8ff;box-shadow:0 0 22px rgba(46,153,255,.4)
}
.nav-btn.active .nav-ico img{opacity:1;filter:none}
.nav-btn.active::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-3px;width:38px;height:3px;border-radius:999px;background:linear-gradient(90deg,#6fd6ff,#3f8dff)}
.nav-btn:hover{color:#dcebff}.nav-btn:hover .nav-ico{border-color:rgba(91,174,255,.24);background:rgba(17,31,52,.72)}
.trainer-layout{display:grid;gap:16px}
.client-shell{display:grid;gap:14px}
.client-page{display:none}.client-page.active{display:block}
.scheme-hero{padding:16px;border-radius:30px;background:#000;border:1px solid rgba(45,128,255,.55);box-shadow:0 0 28px rgba(35,124,255,.20), inset 0 0 24px rgba(13,62,135,.12);margin-bottom:12px}
.days-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:4px 0 10px}
.day-tab{
  border:1px solid rgba(54,114,220,.55);border-radius:20px;background:#03060b;color:#edf4ff;
  min-height:46px;padding:0 5px;font-weight:800;display:grid;place-items:center;box-shadow:inset 0 0 16px rgba(35,92,185,.08)
}
.day-tab.active{background:linear-gradient(135deg,#1269ff,#60e7ff);color:#fff;border-color:#6edcff;box-shadow:0 0 22px rgba(46,155,255,.48), inset 0 0 12px rgba(255,255,255,.10)}
.day-heading{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.day-heading h3{font-size:25px;margin:0;font-weight:900}.day-heading .line{height:1px;flex:1;background:linear-gradient(90deg,#3ba7ff,rgba(59,167,255,.05))}
.day-heading .motto{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#5d87c3;white-space:nowrap}
.exercise-table{display:grid;gap:7px}
.exercise-head,.exercise-row{
  display:grid;grid-template-columns:minmax(0,2.45fr) 52px 48px 68px 78px;align-items:center;gap:0;
}
.exercise-head{padding:0 12px;color:#7ea9ff;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.exercise-head div:not(:first-child),.exercise-row > div:not(:first-child){border-left:1px solid rgba(69,101,153,.36)}
.exercise-head div{padding:0 8px;height:24px;display:flex;align-items:center;justify-content:center}
.exercise-head .h-name,.exercise-row .ex-name{justify-content:flex-start}
.exercise-row{
  background:linear-gradient(180deg,#02050a,#000);border:1px solid rgba(35,113,235,.68);border-radius:24px;min-height:60px;overflow:hidden;box-shadow:0 0 14px rgba(24,102,225,.16), inset 0 0 14px rgba(23,77,161,.08)
}
.ex-name{padding:0 16px;font-size:16px;font-weight:900;line-height:1.08;white-space:normal;overflow:hidden;text-overflow:clip;display:flex;align-items:center;word-break:break-word;color:#fff}
.ex-cell{min-height:60px;display:flex;align-items:center;justify-content:center;padding:4px 5px;font-size:16px;font-weight:900;color:#fff}
.ex-load-inline{min-height:60px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.ex-load-inline input{width:58px;height:30px;padding:5px 6px;border-radius:14px;background:linear-gradient(180deg,#17345d,#0b1b32);color:#f4f8ff;border:1px solid rgba(100,164,255,.7);text-align:center;font-weight:900;box-shadow:inset 0 0 10px rgba(52,128,255,.12)}
.ex-load-inline input:focus{box-shadow:0 0 0 3px rgba(140,195,255,.18)}
.mini-list{display:grid;gap:8px}
.info-card{padding:16px;border-radius:22px;background:linear-gradient(145deg,rgba(8,13,22,.98),rgba(2,4,8,.98));border:1px solid var(--line)}
.info-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(60,90,140,.18)}
.info-row:last-child{border-bottom:0;padding-bottom:0}.info-row:first-child{padding-top:0}
.metric-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 0}
.metric-box{padding:14px;border-radius:18px;background:linear-gradient(145deg,rgba(9,14,23,.95),rgba(3,5,9,.98));border:1px solid rgba(76,123,194,.2)}
.metric-box b{display:block;font-size:24px}.metric-box span{font-size:11px;color:var(--muted)}
.inline-pills{display:flex;flex-wrap:wrap;gap:8px}
.small-pill{padding:8px 12px;border-radius:999px;border:1px solid rgba(84,130,204,.2);background:rgba(10,15,24,.75);color:#d6eaff;font-size:12px}
.photo-quick{cursor:pointer;position:relative;overflow:hidden}
.photo-quick:before{content:"";position:absolute;inset:auto -20px -24px auto;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(61,156,255,.18),transparent 65%)}
.photo-quick b{font-size:22px!important;color:#8edbff}.photo-quick span{color:#dcecff!important}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.photo-card{border:1px solid rgba(75,126,205,.24);border-radius:18px;background:linear-gradient(145deg,rgba(8,13,22,.98),rgba(2,4,8,.98));overflow:hidden}
.photo-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#05070a}
.photo-meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.photo-date{font-size:12px;color:#a8bad2}.photo-note{font-size:11px;color:#7f8fa5;margin-top:2px}
.photo-actions{display:flex;gap:6px}.photo-actions button{padding:6px 8px;font-size:10px;border-radius:10px}
.photo-upload{border:1px dashed rgba(91,166,255,.36);border-radius:20px;padding:14px;background:rgba(7,13,22,.7)}
.photo-upload input[type=file]{background:transparent;border:0;padding:8px 0}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.compare-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:1px solid rgba(78,128,205,.25);background:#05070a}
.compare-label{text-align:center;font-size:11px;color:#8fa8c8;margin-top:5px}
@media(max-width:520px){.photo-grid{grid-template-columns:1fr 1fr;gap:8px}.photo-meta{padding:8px}.photo-date{font-size:10px}.photo-actions{flex-direction:column}.compare-grid{gap:7px}}

.exercise-admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(60,90,140,.18)}
.exercise-admin-row:last-child{border-bottom:0;padding-bottom:0}.exercise-admin-row:first-child{padding-top:0}
.exercise-admin-main{min-width:0;flex:1}
.exercise-admin-main strong{display:block}
.exercise-admin-actions{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}
.mini-btn.compact{padding:8px 10px;font-size:11px;border-radius:12px;min-width:auto;line-height:1;white-space:nowrap}
@media (max-width:560px){
  .exercise-admin-row{align-items:flex-start}
  .exercise-admin-actions{flex-direction:column;gap:6px}
  .mini-btn.compact{padding:7px 9px;font-size:10px}
}

@media (min-width:760px){.tagline{display:block}}
@media (max-width:860px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .exercise-head,.exercise-row{grid-template-columns:minmax(0,2.35fr) 50px 46px 64px 74px}
}

@media (max-width:680px){
  .top{padding:12px 14px}.wrap{padding:14px 12px 116px}.page-head h1{font-size:28px}
  .scheme-title{font-size:24px}.modalbox{padding:18px}.formgrid{grid-template-columns:1fr}
}
@media (max-width:480px){
  .loginbox{padding:30px 18px 22px}
  .top .brand-title{font-size:18px}.top .brand-title span{font-size:10px;letter-spacing:3px}
  .userpill{display:none}
  .page-head{padding:16px 14px 12px}.page-head h1{font-size:24px}.page-sub{font-size:13px}
  .scheme-hero{padding:12px}
  .days-wrap{gap:6px}.day-tab{min-height:40px;font-size:11px;border-radius:16px}
  .day-heading h3{font-size:21px}.day-heading .motto{font-size:9px;letter-spacing:.22em}
  .exercise-head,.exercise-row{grid-template-columns:minmax(0,2.7fr) 40px 36px 52px 64px}
  .exercise-head{font-size:8px;padding:0 6px}
  .exercise-row{min-height:52px;border-radius:20px}
  .ex-name{padding:0 10px;font-size:13.5px;line-height:1.06}
  .ex-cell{min-height:52px;font-size:13px;padding:3px}
  .ex-load-inline{min-height:52px;padding:0 4px}
  .ex-load-inline input{width:52px;height:26px;font-size:11px;padding:3px 4px;border-radius:12px}
  .bottom{left:10px;right:10px;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-radius:30px}
  .nav-btn{padding-top:4px}.nav-btn .nav-ico{width:42px;height:42px}.nav-btn .nav-ico img{width:24px;height:24px}.nav-btn .nav-label{font-size:10px}
}


/* ===== RESTYLING SDC COACH — SOLO CSS ===== */
:root{
  --blue:#35a8ff;
  --blue2:#a7dbff;
  --blue3:#076dff;
  --line:rgba(62,143,255,.34);
  --line-2:rgba(71,161,255,.58);
  --glow:0 0 24px rgba(31,136,255,.16);
}
body{
  background:
    radial-gradient(circle at 82% 5%,rgba(0,111,255,.10),transparent 20%),
    radial-gradient(circle at 12% 42%,rgba(0,111,255,.055),transparent 24%),
    #000;
}
.login{background:radial-gradient(circle at 50% 10%,rgba(0,119,255,.10),transparent 30%),#000}
.loginbox{
  background:linear-gradient(155deg,rgba(3,9,18,.99),rgba(0,2,6,.99));
  border:1px solid rgba(54,152,255,.48);
  box-shadow:0 0 42px rgba(0,120,255,.16),inset 0 0 34px rgba(0,78,180,.06);
}

/* Branding visuale: il markup originale resta identico */
.brand{gap:12px}
.brand-mark{
  position:relative;clip-path:none!important;border-radius:0!important;background:transparent!important;
  box-shadow:none!important;width:68px;height:64px;display:grid;place-items:center;overflow:visible;
}
.brand-mark::before{
  content:"S";font-family:Georgia,"Times New Roman",serif;font-size:64px;line-height:1;
  font-weight:800;font-style:italic;letter-spacing:-8px;color:#72d8ff;
  background:linear-gradient(145deg,#b9f3ff 0%,#45c8ff 25%,#126eff 58%,#063c9d 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 7px rgba(25,149,255,.60));
}
.brand-title{
  position:relative;display:grid;grid-template-columns:auto auto;align-items:end;column-gap:6px;
  line-height:.95;font-size:0!important;letter-spacing:0!important;font-weight:900;color:#fff;padding-bottom:16px;
}
.brand-title::before{
  content:"SDC";font-size:34px;line-height:.95;font-weight:900;letter-spacing:.4px;color:#fff;
}
.brand-title span{display:block!important;font-size:0!important;letter-spacing:0!important;color:transparent!important}
.brand-title span::before{
  content:"Coach";font-size:34px;line-height:.95;font-weight:800;letter-spacing:.2px;color:#2d9fff;
}
.brand-title::after{
  content:"ALLENA IL TUO POTENZIALE";position:absolute;left:0;bottom:0;font-size:8.5px;line-height:1;
  letter-spacing:.30em;font-weight:600;color:#87a8d0;white-space:nowrap;
}

.top{
  padding:14px 18px;background:linear-gradient(180deg,rgba(0,3,8,.96),rgba(1,5,12,.90));
  border-bottom:1px solid rgba(41,116,224,.34);box-shadow:0 8px 26px rgba(0,0,0,.35);
}
.top .brand-mark{width:48px!important;height:46px!important}
.top .brand-mark::before{font-size:46px;letter-spacing:-6px}
.top .brand-title{padding-bottom:12px}
.top .brand-title::before,.top .brand-title span::before{font-size:25px}
.top .brand-title::after{font-size:6.2px;letter-spacing:.24em}
.tagline{display:none!important}
.userpill{background:rgba(3,11,22,.82);border-color:rgba(49,145,255,.36);color:#a9d9ff}
.profilechip{
  width:50px;height:50px;border:1.5px solid #168eff;background:radial-gradient(circle at 45% 35%,#17385b,#06111f 68%);
  color:#8fd4ff;box-shadow:0 0 18px rgba(20,142,255,.28),inset 0 0 12px rgba(33,132,255,.12)
}
.ghost-btn{
  border-radius:24px;padding:12px 20px;border:1.5px solid #138cff;background:linear-gradient(180deg,#071628,#02070e);
  box-shadow:0 0 18px rgba(25,141,255,.22),inset 0 0 14px rgba(25,111,210,.12);font-weight:800
}
.card,.info-card,.metric-box,.row,.page-head,.modalbox{
  background:linear-gradient(145deg,rgba(4,11,21,.98),rgba(0,3,8,.99));
  border-color:rgba(65,139,239,.32);box-shadow:0 0 18px rgba(0,101,225,.08),inset 0 0 18px rgba(9,75,164,.035)
}
.page-head{border-radius:28px}
.primary,.btn.blue,.mini-btn.blue{
  background:linear-gradient(135deg,#0a56cc 0%,#178fff 55%,#52dfff 130%);
  border-color:#38a9ff;color:#fff;box-shadow:0 0 20px rgba(22,144,255,.25),inset 0 0 12px rgba(255,255,255,.08)
}
.btn,.mini-btn,.ghost-btn,input,select,textarea{border-color:rgba(70,145,239,.32)}
input:focus,select:focus,textarea:focus{border-color:#29a6ff;box-shadow:0 0 0 3px rgba(31,151,255,.13),0 0 16px rgba(26,128,255,.12)}

.scheme-hero{
  padding:18px 16px 20px;border-radius:34px;background:linear-gradient(180deg,#02070f 0%,#000 100%);
  border:1.5px solid #258fff;
  box-shadow:0 0 18px rgba(22,142,255,.34),0 0 42px rgba(0,82,194,.16),inset 0 0 30px rgba(6,77,169,.12)
}
.days-wrap{gap:10px;margin:5px 0 18px}
.day-tab{
  min-height:48px;border-radius:20px;border:1px solid rgba(59,135,231,.56);background:linear-gradient(180deg,#050b14,#01050a);
  color:#f4f8ff;font-size:12px;font-weight:800;box-shadow:inset 0 0 18px rgba(25,87,170,.07)
}
.day-tab.active{
  background:linear-gradient(135deg,#075eff 0%,#1c8fff 55%,#54e6ff 125%);border-color:#4ddaff;
  box-shadow:0 0 18px rgba(0,145,255,.60),0 0 32px rgba(0,95,255,.24),inset 0 0 12px rgba(255,255,255,.16)
}
.day-heading{gap:14px;margin:8px 4px 16px}
.day-heading h3{font-size:30px;font-weight:900;letter-spacing:-.03em}
.day-heading .line{height:2px;background:linear-gradient(90deg,#56ddff,#167dff 52%,rgba(20,100,255,.03))}
.day-heading .motto{font-size:11px;color:#2ea2ff;letter-spacing:.30em;font-weight:800}
.exercise-table{gap:9px}
.exercise-head{padding:0 14px;color:#8fbdff;font-size:10px;font-weight:800;letter-spacing:.15em}
.exercise-head div{height:28px}
.exercise-head div:not(:first-child),.exercise-row>div:not(:first-child){border-left:1px solid rgba(84,135,198,.35)}
.exercise-row{
  min-height:66px;border-radius:24px;background:linear-gradient(180deg,#040a13,#01050a);
  border:1.2px solid rgba(48,139,255,.76);
  box-shadow:0 0 12px rgba(17,116,240,.18),inset 0 0 20px rgba(11,70,151,.08)
}
.ex-name{padding:0 16px;font-size:16px;font-weight:900}
.ex-cell,.ex-load-inline{min-height:66px}
.ex-cell{font-size:16px}
.ex-load-inline input{
  width:58px;height:34px;border-radius:15px;background:linear-gradient(180deg,#294f7e,#0b1d35);
  border:1px solid #79bcff;box-shadow:inset 0 0 10px rgba(76,154,255,.20),0 0 12px rgba(49,139,255,.12)
}
.bottom{
  left:18px;right:18px;bottom:12px;padding:11px 9px calc(11px + env(safe-area-inset-bottom));border-radius:34px;
  background:linear-gradient(180deg,rgba(2,9,18,.98),rgba(0,4,9,.99));border:1px solid rgba(51,139,255,.65);
  box-shadow:0 0 22px rgba(14,117,255,.20),0 18px 38px rgba(0,0,0,.62),inset 0 0 20px rgba(9,62,135,.06)
}
.nav-btn{color:#8ba7ce;gap:7px}
.nav-btn .nav-ico{width:46px;height:46px}
.nav-btn .nav-ico img{width:28px;height:28px;opacity:.82;filter:saturate(.9) brightness(.96)}
.nav-btn.active{color:#fff}
.nav-btn.active .nav-ico{
  background:radial-gradient(circle at 50% 38%,#153d69,#07182d 72%);border:1.5px solid #20a1ff;
  box-shadow:0 0 18px rgba(27,158,255,.60),0 0 32px rgba(0,94,255,.24),inset 0 0 12px rgba(35,144,255,.18)
}
.nav-btn.active::after{width:46px;height:4px;bottom:-3px;background:linear-gradient(90deg,#55e0ff,#0d76ff);box-shadow:0 0 8px rgba(31,161,255,.6)}
.nav-btn .nav-label{font-size:11px}

@media(max-width:480px){
  .top{padding:11px 12px}
  .top .brand-mark{width:42px!important;height:40px!important}.top .brand-mark::before{font-size:40px}
  .top .brand-title{padding-bottom:10px}.top .brand-title::before,.top .brand-title span::before{font-size:22px}.top .brand-title::after{font-size:5.7px;letter-spacing:.20em}
  .profilechip{width:44px;height:44px}.ghost-btn{padding:10px 15px}
  .scheme-hero{padding:13px 11px 15px;border-radius:28px}
  .days-wrap{gap:6px}.day-tab{min-height:42px;font-size:11px;border-radius:17px}
  .day-heading h3{font-size:24px}.day-heading .motto{font-size:8px;letter-spacing:.20em}
  .exercise-head{font-size:8px;padding:0 6px}.exercise-row{min-height:54px;border-radius:20px}

  .bottom{left:10px;right:10px;border-radius:30px;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .nav-btn .nav-ico{width:43px;height:43px}.nav-btn .nav-label{font-size:10px}
}


/* FIX TOUCH MODALI ANDROID — nessuna modifica JS */
.modal{pointer-events:auto!important;}
.modalbox{position:relative!important;z-index:60!important;pointer-events:auto!important;}
.modalbox *{pointer-events:auto;}
.modalbox .actions{position:relative!important;z-index:100!important;pointer-events:auto!important;}
.modalbox .actions button,.modalbox button{position:relative!important;z-index:101!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-tap-highlight-color:rgba(53,168,255,.18);}
.modalbox::before,.modalbox::after,.actions::before,.actions::after{pointer-events:none!important;}

/* ===== TEMA PERSONALIZZABILE TRAINER + CLIENTE ===== */
:root{
  --theme-primary:#35a8ff;
  --theme-secondary:#7fdcff;
  --theme-primary-rgb:53,168,255;
  --theme-secondary-rgb:127,220,255;
}

/* componenti principali collegati ai colori scelti */
.page-kicker{color:var(--theme-secondary)!important}
.page-head,
.card,
.info-card,
.metric-box,
.row,
.modalbox{
  border-color:rgba(var(--theme-primary-rgb),.28)!important;
}
.scheme-hero{
  border-color:rgba(var(--theme-primary-rgb),.78)!important;
  box-shadow:
    0 0 30px rgba(var(--theme-primary-rgb),.22),
    inset 0 0 24px rgba(var(--theme-primary-rgb),.10)!important;
}
.day-tab{
  border-color:rgba(var(--theme-primary-rgb),.48)!important;
}
.day-tab.active{
  background:linear-gradient(135deg,var(--theme-primary),var(--theme-secondary))!important;
  border-color:var(--theme-secondary)!important;
  box-shadow:0 0 22px rgba(var(--theme-primary-rgb),.42)!important;
}
.exercise-row{
  border-color:rgba(var(--theme-primary-rgb),.72)!important;
  box-shadow:
    0 0 14px rgba(var(--theme-primary-rgb),.16),
    inset 0 0 14px rgba(var(--theme-primary-rgb),.08)!important;
}
.exercise-head{color:var(--theme-secondary)!important}
.exercise-head div:not(:first-child),
.exercise-row>div:not(:first-child){
  border-left-color:rgba(var(--theme-primary-rgb),.28)!important;
}
.ex-load-inline input{
  border-color:rgba(var(--theme-secondary-rgb),.72)!important;
  box-shadow:inset 0 0 10px rgba(var(--theme-primary-rgb),.15)!important;
}
.btn.blue,.mini-btn.blue,.primary{
  background:linear-gradient(135deg,var(--theme-primary),var(--theme-secondary))!important;
  border-color:var(--theme-secondary)!important;
  color:#fff!important;
  box-shadow:0 0 22px rgba(var(--theme-primary-rgb),.22)!important;
}
.bottom{
  border-color:rgba(var(--theme-primary-rgb),.52)!important;
  box-shadow:
    0 16px 36px rgba(0,0,0,.58),
    0 0 22px rgba(var(--theme-primary-rgb),.15)!important;
}
.nav-btn.active .nav-ico{
  border-color:var(--theme-primary)!important;
  box-shadow:0 0 22px rgba(var(--theme-primary-rgb),.42)!important;
  background:linear-gradient(180deg,
    rgba(var(--theme-primary-rgb),.34),
    rgba(var(--theme-primary-rgb),.12))!important;
}
.nav-btn.active::after{
  background:linear-gradient(90deg,var(--theme-secondary),var(--theme-primary))!important;
}
.more-action-card{
  border-color:rgba(var(--theme-primary-rgb),.34)!important;
}
.more-symbol{
  color:var(--theme-secondary)!important;
  border-color:rgba(var(--theme-primary-rgb),.42)!important;
  background:rgba(var(--theme-primary-rgb),.12)!important;
}
.brand-mark{
  background:
    radial-gradient(circle at 30% 25%,var(--theme-secondary),transparent 30%),
    linear-gradient(160deg,var(--theme-secondary) 0%,var(--theme-primary) 50%,#071324 100%)!important;
  box-shadow:0 0 20px rgba(var(--theme-primary-rgb),.42)!important;
}
.profilechip{
  border-color:rgba(var(--theme-primary-rgb),.34)!important;
}
.action-card,
.photo-quick{
  border-color:rgba(var(--theme-primary-rgb),.30)!important;
}
.badge{
  color:var(--theme-secondary)!important;
  border-color:rgba(var(--theme-primary-rgb),.25)!important;
  background:rgba(var(--theme-primary-rgb),.10)!important;
}

/* selettore tema */
.theme-picker-card{
  display:grid;
  gap:14px;
}
.theme-pickers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.theme-color-box{
  padding:14px;
  border-radius:20px;
  border:1px solid rgba(var(--theme-primary-rgb),.26);
  background:rgba(5,9,16,.92);
}
.theme-color-box label{
  margin-top:0;
}
.theme-color-box input[type="color"]{
  width:100%;
  height:58px;
  padding:5px;
  border-radius:16px;
  background:#05080f;
  border:1px solid rgba(var(--theme-primary-rgb),.32);
}
.theme-preview{
  height:74px;
  border-radius:22px;
  border:1px solid rgba(var(--theme-primary-rgb),.45);
  background:linear-gradient(135deg,var(--theme-primary),var(--theme-secondary));
  box-shadow:0 0 24px rgba(var(--theme-primary-rgb),.25);
  display:grid;
  place-items:center;
  font-weight:900;
  letter-spacing:.08em;
  color:white;
}
.theme-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.theme-access-card .more-symbol{
  font-size:21px;
}
@media(max-width:480px){
  .theme-pickers{grid-template-columns:1fr}
}


/* ===== TEMA V2: COLORE ACCENTO + COLORE SFONDO ===== */
:root{
  --theme-accent:#35a8ff;
  --theme-accent-rgb:53,168,255;
  --theme-background:#000000;
  --theme-surface:#03070d;
  --theme-surface-2:#07101b;
  --theme-surface-rgb:3,7,13;
}

/* Sfondo scelto dall'utente */
html,body{
  background:var(--theme-background)!important;
}
body::before{
  background:
    radial-gradient(circle at 50% -10%,rgba(var(--theme-accent-rgb),.10),transparent 38%),
    linear-gradient(180deg,var(--theme-background),var(--theme-background))!important;
}
.app,.wrap,.client-shell,.trainer-layout{
  background:transparent!important;
}

/* Superfici ricavate dal colore di sfondo */
.top,
.page-head,
.card,
.info-card,
.metric-box,
.row,
.modalbox,
.scheme-hero,
.bottom,
.more-action-card,
.photo-card,
.photo-upload,
.exercise-row,
.day-tab,
.btn:not(.blue),
.mini-btn:not(.blue),
input,select,textarea{
  background:linear-gradient(155deg,var(--theme-surface-2),var(--theme-surface))!important;
}

/* Colore principale/accento: bordi, glow, bottoni, tab attivi, sfumature */
.page-kicker,
.exercise-head,
.photo-quick b,
.more-symbol{
  color:var(--theme-accent)!important;
}
.page-head,
.card,
.info-card,
.metric-box,
.row,
.modalbox,
.more-action-card,
.scheme-hero,
.bottom,
.exercise-row,
.day-tab,
input,select,textarea{
  border-color:rgba(var(--theme-accent-rgb),.42)!important;
}
.page-head,
.scheme-hero,
.bottom{
  box-shadow:
    0 0 26px rgba(var(--theme-accent-rgb),.16),
    inset 0 0 20px rgba(var(--theme-accent-rgb),.05)!important;
}
.action-card,
.photo-quick{
  box-shadow:0 0 18px rgba(var(--theme-accent-rgb),.08)!important;
}
.btn.blue,.mini-btn.blue,.primary,.day-tab.active{
  background:linear-gradient(135deg,
    rgba(var(--theme-accent-rgb),.82),
    var(--theme-accent))!important;
  border-color:var(--theme-accent)!important;
  color:#fff!important;
  box-shadow:0 0 22px rgba(var(--theme-accent-rgb),.30)!important;
}
.nav-btn.active .nav-ico{
  background:linear-gradient(180deg,
    rgba(var(--theme-accent-rgb),.34),
    rgba(var(--theme-accent-rgb),.12))!important;
  border-color:var(--theme-accent)!important;
  box-shadow:0 0 22px rgba(var(--theme-accent-rgb),.42)!important;
}
.nav-btn.active::after{
  background:var(--theme-accent)!important;
  box-shadow:0 0 12px rgba(var(--theme-accent-rgb),.55)!important;
}
.ex-load-inline input{
  border-color:rgba(var(--theme-accent-rgb),.70)!important;
  box-shadow:inset 0 0 10px rgba(var(--theme-accent-rgb),.14)!important;
}
.badge{
  color:var(--theme-accent)!important;
  border-color:rgba(var(--theme-accent-rgb),.34)!important;
  background:rgba(var(--theme-accent-rgb),.10)!important;
}
.more-symbol{
  border-color:rgba(var(--theme-accent-rgb),.42)!important;
  background:rgba(var(--theme-accent-rgb),.12)!important;
}

/* Il logo non diventa un quadrato pieno: mantiene fondo scuro con accento luminoso */
.brand-mark{
  background:
    radial-gradient(circle at 35% 30%,rgba(var(--theme-accent-rgb),.95),transparent 30%),
    linear-gradient(160deg,rgba(var(--theme-accent-rgb),.55),rgba(var(--theme-accent-rgb),.12) 58%,var(--theme-surface) 100%)!important;
  box-shadow:0 0 20px rgba(var(--theme-accent-rgb),.42)!important;
}

/* Selettore aggiornato */
.theme-preview{
  background:
    radial-gradient(circle at 75% 25%,rgba(var(--theme-accent-rgb),.24),transparent 28%),
    linear-gradient(145deg,var(--theme-surface-2),var(--theme-surface))!important;
  border-color:var(--theme-accent)!important;
  box-shadow:0 0 24px rgba(var(--theme-accent-rgb),.24)!important;
}
.theme-preview::before{
  content:"ACCENTO";
  display:inline-grid;
  place-items:center;
  width:110px;
  height:38px;
  border-radius:14px;
  background:var(--theme-accent);
  color:#fff;
  box-shadow:0 0 18px rgba(var(--theme-accent-rgb),.32);
}
.theme-preview{
  font-size:0;
}


/* ===== TEMA COMPLETO: NESSUN BLU FISSO ===== */

/* Branding */
.brand-mark::before{
  color:var(--theme-accent)!important;
  background:linear-gradient(
    145deg,
    color-mix(in srgb,var(--theme-accent) 38%,white) 0%,
    var(--theme-accent) 46%,
    color-mix(in srgb,var(--theme-accent) 72%,black) 100%
  )!important;
  -webkit-background-clip:text!important;
  background-clip:text!important;
  -webkit-text-fill-color:transparent!important;
  filter:drop-shadow(0 0 7px rgba(var(--theme-accent-rgb),.58))!important;
}
.brand-title span::before{
  color:var(--theme-accent)!important;
}
.brand-title::after{
  color:color-mix(in srgb,var(--theme-accent) 48%,#bfc9d9)!important;
}

/* Barra alta */
.top{
  border-bottom-color:rgba(var(--theme-accent-rgb),.38)!important;
  box-shadow:0 8px 26px rgba(0,0,0,.35),0 0 14px rgba(var(--theme-accent-rgb),.05)!important;
}
.userpill{
  border-color:rgba(var(--theme-accent-rgb),.38)!important;
  color:color-mix(in srgb,var(--theme-accent) 45%,white)!important;
}
.profilechip{
  border-color:var(--theme-accent)!important;
  background:
    radial-gradient(circle at 45% 35%,rgba(var(--theme-accent-rgb),.24),rgba(var(--theme-surface-rgb),.95) 68%)!important;
  color:var(--theme-accent)!important;
  box-shadow:
    0 0 18px rgba(var(--theme-accent-rgb),.30),
    inset 0 0 12px rgba(var(--theme-accent-rgb),.14)!important;
}
.ghost-btn{
  border-color:var(--theme-accent)!important;
  background:linear-gradient(180deg,var(--theme-surface-2),var(--theme-surface))!important;
  box-shadow:
    0 0 18px rgba(var(--theme-accent-rgb),.22),
    inset 0 0 14px rgba(var(--theme-accent-rgb),.10)!important;
  color:#fff!important;
}

/* Input focus */
input:focus,select:focus,textarea:focus{
  border-color:var(--theme-accent)!important;
  box-shadow:
    0 0 0 3px rgba(var(--theme-accent-rgb),.14),
    0 0 16px rgba(var(--theme-accent-rgb),.13)!important;
}

/* Barra inferiore: SVG monocromatici */
.nav-btn{
  color:color-mix(in srgb,var(--theme-accent) 38%,#8d98aa)!important;
}
.nav-btn .nav-ico{
  color:inherit!important;
}
.nav-btn .nav-ico svg{
  width:27px!important;
  height:27px!important;
  display:block!important;
}
.nav-btn.active{
  color:#fff!important;
}
.nav-btn.active .nav-ico{
  color:var(--theme-accent)!important;
  border-color:var(--theme-accent)!important;
  background:
    radial-gradient(circle at 50% 38%,
      rgba(var(--theme-accent-rgb),.30),
      rgba(var(--theme-accent-rgb),.08) 72%)!important;
  box-shadow:
    0 0 18px rgba(var(--theme-accent-rgb),.58),
    0 0 32px rgba(var(--theme-accent-rgb),.22),
    inset 0 0 12px rgba(var(--theme-accent-rgb),.16)!important;
}
.nav-btn.active::after{
  background:var(--theme-accent)!important;
  box-shadow:0 0 8px rgba(var(--theme-accent-rgb),.62)!important;
}

/* Pagina Altro */
.more-action-card img{display:none!important}
.more-svg svg{
  width:25px;
  height:25px;
}
.more-symbol{
  color:var(--theme-accent)!important;
}


/* ===== PAGINA SCHEDA TRAINER DEDICATA ===== */
.scheda-client-row{
  cursor:pointer;
  min-height:76px;
  border-radius:22px!important;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.scheda-client-row:active{
  transform:scale(.99);
  border-color:var(--theme-accent)!important;
  box-shadow:0 0 18px rgba(var(--theme-accent-rgb),.18)!important;
}
.scheda-client-row .badge{
  flex:0 0 auto;
}

const APP_THEME_KEY="sdc_app_theme_v2";
const DEFAULT_APP_THEME={accent:"#35a8ff",background:"#000000"};

function normalizeHexColor(value,fallback){
  const v=String(value||"").trim();
  return /^#[0-9a-fA-F]{6}$/.test(v)?v:fallback;
}
function hexToRgb(hex){
  const h=normalizeHexColor(hex,"#000000").slice(1);
  return {
    r:parseInt(h.slice(0,2),16),
    g:parseInt(h.slice(2,4),16),
    b:parseInt(h.slice(4,6),16)
  };
}
function rgbString(c){return `${c.r},${c.g},${c.b}`;}
function mixRgb(a,b,amount){
  return {
    r:Math.round(a.r+(b.r-a.r)*amount),
    g:Math.round(a.g+(b.g-a.g)*amount),
    b:Math.round(a.b+(b.b-a.b)*amount)
  };
}
function rgbToHex(c){
  const h=n=>Math.max(0,Math.min(255,n)).toString(16).padStart(2,"0");
  return `#${h(c.r)}${h(c.g)}${h(c.b)}`;
}
function getSavedAppTheme(){
  try{
    const saved=JSON.parse(localStorage.getItem(APP_THEME_KEY)||"null");
    return {
      accent:normalizeHexColor(saved?.accent,DEFAULT_APP_THEME.accent),
      background:normalizeHexColor(saved?.background,DEFAULT_APP_THEME.background)
    };
  }catch(e){
    return {...DEFAULT_APP_THEME};
  }
}
function applyAppTheme(accent,background,persist=false){
  accent=normalizeHexColor(accent,DEFAULT_APP_THEME.accent);
  background=normalizeHexColor(background,DEFAULT_APP_THEME.background);

  const accentRgb=hexToRgb(accent);
  const bgRgb=hexToRgb(background);

  /* Crea automaticamente due superfici leggermente più chiare dello sfondo */
  const white={r:255,g:255,b:255};
  const surface=mixRgb(bgRgb,white,.035);
  const surface2=mixRgb(bgRgb,white,.075);

  const root=document.documentElement;
  root.style.setProperty("--theme-accent",accent);
  root.style.setProperty("--theme-accent-rgb",rgbString(accentRgb));
  root.style.setProperty("--theme-background",background);
  root.style.setProperty("--theme-surface",rgbToHex(surface));
  root.style.setProperty("--theme-surface-2",rgbToHex(surface2));
  root.style.setProperty("--theme-surface-rgb",rgbString(surface));

  /* Compatibilità con le vecchie variabili grafiche */
  root.style.setProperty("--blue",accent);
  root.style.setProperty("--blue2",accent);
  root.style.setProperty("--blue3",accent);
  root.style.setProperty("--line",`rgba(${rgbString(accentRgb)},.28)`);
  root.style.setProperty("--line-2",`rgba(${rgbString(accentRgb)},.46)`);
  root.style.setProperty("--glow",`0 0 26px rgba(${rgbString(accentRgb)},.18)`);

  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content",background);

  if(persist){
    localStorage.setItem(APP_THEME_KEY,JSON.stringify({accent,background}));
  }
}
function loadAppTheme(){
  const t=getSavedAppTheme();
  applyAppTheme(t.accent,t.background,false);
}
function previewAppTheme(){
  const accent=document.getElementById("themeAccent")?.value||DEFAULT_APP_THEME.accent;
  const background=document.getElementById("themeBackground")?.value||DEFAULT_APP_THEME.background;
  applyAppTheme(accent,background,false);
}
function saveAppTheme(){
  const accent=document.getElementById("themeAccent")?.value||DEFAULT_APP_THEME.accent;
  const background=document.getElementById("themeBackground")?.value||DEFAULT_APP_THEME.background;
  applyAppTheme(accent,background,true);
  closeModal();
  alert("Tema salvato.");
}
function resetAppTheme(){
  applyAppTheme(DEFAULT_APP_THEME.accent,DEFAULT_APP_THEME.background,true);
  const a=document.getElementById("themeAccent");
  const b=document.getElementById("themeBackground");
  if(a)a.value=DEFAULT_APP_THEME.accent;
  if(b)b.value=DEFAULT_APP_THEME.background;
}
function openThemeSettings(){

async function getClientPhotos(clientId){
  const {data,error}=await sb.from('check_photos').select('id,client_id,user_id,photo_path,photo_date,note,created_at').eq('client_id',String(clientId)).order('photo_date',{ascending:false});
  if(error) throw error;
  const out=[];
  for(const p of (data||[])){
    const {data:signed,error:signError}=await sb.storage.from('check-foto').createSignedUrl(p.photo_path,3600);
    if(signError) continue;
    out.push({id:String(p.id),clientId:p.client_id,userId:p.user_id,path:p.photo_path,date:p.photo_date,note:p.note||'',dataUrl:signed.signedUrl});
  }
  return out;
}
async function addClientPhoto(clientId,file,date,note=''){
  const c=db.clients.find(x=>String(x.id)===String(clientId));
  const ownerId=c?.supabaseUserId||session?.supabaseUserId;
  if(!ownerId) throw new Error('Cliente non collegato a Supabase.');
  const rawExt=(file.name?.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const ext=['jpg','jpeg','png','webp'].includes(rawExt)?rawExt:'jpg';
  const path=`${ownerId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error:uploadError}=await sb.storage.from('check-foto').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
  if(uploadError) throw uploadError;
  const payload={client_id:String(clientId),user_id:ownerId,photo_path:path,photo_date:date||new Date().toISOString().slice(0,10),note:note||''};
  const {data,error}=await sb.from('check_photos').insert(payload).select().single();
  if(error){await sb.storage.from('check-foto').remove([path]);throw error;}
  return data;
}
async function removeClientPhoto(photoId){
  const {data,error}=await sb.from('check_photos').select('id,photo_path').eq('id',photoId).single();
  if(error) throw error;
  const {error:storageError}=await sb.storage.from('check-foto').remove([data.photo_path]);
  if(storageError) throw storageError;
  const {error:deleteError}=await sb.from('check_photos').delete().eq('id',photoId);
  if(deleteError) throw deleteError;
}

async function savePhotoUpload(clientId,trainerMode=false){

async function syncWorkoutsFromSupabase(clientId=null){
  let query=sb
    .from('workouts')
    .select('id,client_id,client_user_id,title,day,exercise,sets,reps,rest,load,created_at,updated_at')
    .order('created_at',{ascending:true});
  if(clientId) query=query.eq('client_id',String(clientId));
  const {data,error}=await query;
  if(error) throw error;

  const remote=(data||[]).map(w=>({
    id:String(w.id),
    clientId:String(w.client_id),
    supabaseUserId:w.client_user_id||'',
    title:w.title||'Allenamento',
    day:w.day||'Giorno 1',
    exercise:w.exercise||'',
    sets:w.sets==null?'':String(w.sets),
    reps:w.reps==null?'':String(w.reps),
    rest:w.rest==null?'':String(w.rest),
    load:w.load==null?'':String(w.load)
  }));

  if(clientId){
    db.workouts=[
      ...db.workouts.filter(w=>String(w.clientId)!==String(clientId)),
      ...remote
    ];
  }else if(session?.role==='client'&&session?.userId){
    db.workouts=[
      ...db.workouts.filter(w=>String(w.clientId)!==String(session.userId)),
      ...remote
    ];
  }else{
    db.workouts=remote;
  }
  save();
  return remote;
}

async function saveWorkoutsToSupabase(clientId){
  const c=db.clients.find(x=>String(x.id)===String(clientId));
  if(!c) throw new Error('Cliente non trovato.');
  if(!c.supabaseUserId) throw new Error('Il cliente non è collegato al suo account Supabase.');

  const local=db.workouts.filter(w=>String(w.clientId)===String(clientId));
  const invalid=local.find(w=>!String(w.exercise||'').trim());
  if(invalid) throw new Error('Inserisci il nome di tutti gli esercizi prima di salvare.');

  const rows=local.map(w=>({
    id:String(w.id),
    client_id:String(clientId),
    client_user_id:c.supabaseUserId,
    title:w.title||'Allenamento',
    day:w.day||'Giorno 1',
    exercise:String(w.exercise||'').trim(),
    sets:String(w.sets??''),
    reps:String(w.reps??''),
    rest:String(w.rest??''),
    load:String(w.load??''),
    updated_at:new Date().toISOString()
  }));

  if(rows.length){
    const {error:upsertError}=await sb.from('workouts').upsert(rows,{onConflict:'id'});
    if(upsertError) throw upsertError;
  }

  const {data:remote,error:readError}=await sb.from('workouts').select('id').eq('client_id',String(clientId));
  if(readError) throw readError;
  const localIds=new Set(local.map(w=>String(w.id)));
  const stale=(remote||[]).map(r=>String(r.id)).filter(id=>!localIds.has(id));
  if(stale.length){
    const {error:deleteError}=await sb.from('workouts').delete().in('id',stale);
    if(deleteError) throw deleteError;
  }

  await syncWorkoutsFromSupabase(clientId);
}

async function login(){
  const role=roleEl().value;
  const usernameEl=document.getElementById("username");
  const passwordEl=document.getElementById("password");
  const errorEl=document.getElementById("loginError");
  const u=(usernameEl?.value||"").trim();
  const p=passwordEl?.value||"";
  if(errorEl) errorEl.textContent="";
  try{
    const email=role==="trainer"?TRAINER.email:u.toLowerCase();
    if(role==="trainer" && u!==TRAINER.username) throw new Error('Credenziali non valide.');
    const {data,error}=await sb.auth.signInWithPassword({email,password:p});
    if(error||!data.user) throw new Error('Credenziali non valide.');
    const actualRole=data.user.app_metadata?.role;
    if(role==="trainer" && actualRole!=="trainer"){await sb.auth.signOut();throw new Error('Account trainer non autorizzato.');}
    if(role==="client"){
      const {data:client,error:clientError}=await sb.from('clients').select('id,user_id,name,email').eq('user_id',data.user.id).single();
      if(clientError||!client){await sb.auth.signOut();throw new Error('Profilo cliente non trovato.');}
      let local=db.clients.find(c=>String(c.id)===String(client.id)||String(c.email||'').toLowerCase()===String(client.email||'').toLowerCase());
      if(local){local.id=client.id;local.name=client.name;local.email=client.email;local.supabaseUserId=client.user_id;}
      else{local={id:client.id,name:client.name,email:client.email,password:'',phone:'',birth:'',note:'',supabaseUserId:client.user_id};db.clients.push(local);}
      save();
      session={role:'client',userId:client.id,supabaseUserId:data.user.id,page:'scheda',clientDay:'Giorno 1'};
      try{await syncWorkoutsFromSupabase(client.id);}catch(e){console.warn('Sync scheda cliente:',e);}
      try{await syncPaymentsFromSupabase();}catch(e){console.warn('Sync pagamenti cliente:',e);}
      try{await syncAppointmentsFromSupabase();}catch(e){console.warn('Sync appuntamenti cliente:',e);}
    }else{
      await syncClientsFromSupabase();
      session={role:'trainer',userId:null,supabaseUserId:data.user.id,page:'dashboard',clientDay:'Giorno 1'};
      try{await syncWorkoutsFromSupabase();}catch(e){console.warn('Sync schede trainer:',e);}
      try{await syncPaymentsFromSupabase();}catch(e){console.warn('Sync pagamenti trainer:',e);}
      try{await syncAppointmentsFromSupabase();}catch(e){console.warn('Sync appuntamenti trainer:',e);}
    }
    saveSession();
    render();
  }catch(err){if(errorEl) errorEl.textContent=err.message||'Accesso non riuscito.';}
}

async function saveClient(cid){
  const n=document.getElementById('fn').value.trim(),e=document.getElementById('fe').value.trim(),p=document.getElementById('fp').value;
  if(!n||!e||(!cid&&!p))return alert("Inserisci nome, email e password.");
  if(db.clients.some(c=>String(c.email||"").toLowerCase()===e.toLowerCase()&&String(c.id)!==String(cid)))return alert("Email già utilizzata.");
  try{
    if(cid){
      const old=db.clients.find(x=>String(x.id)===String(cid));
      if(!old) return;
      const c={...old,name:n,email:e,phone:document.getElementById('ft').value,birth:document.getElementById('fb').value,note:document.getElementById('fno').value};
      db.clients=db.clients.map(x=>String(x.id)===String(cid)?c:x);save();
      if(old.supabaseUserId){
        const {error}=await sb.from('clients').update({name:n,email:e}).eq('id',cid);
        if(error) console.warn(error);
      }
      closeModal();render();
      return;
    }
    const {data:{session:authSession}}=await sb.auth.getSession();
    if(!authSession?.access_token) throw new Error('Sessione trainer scaduta. Esci e accedi di nuovo.');
    const res=await fetch(`${SUPABASE_URL}/functions/v1/${EDGE_FUNCTION_SLUG}`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${authSession.access_token}`,'apikey':SUPABASE_KEY},
      body:JSON.stringify({name:n,email:e,password:p})
    });
    const out=await res.json().catch(()=>({}));
    if(!res.ok||!out.success) throw new Error(out.error||'Errore creazione cliente.');
    const sc=out.client;
    const c={id:sc.id,name:n,email:e,password:'',phone:document.getElementById('ft').value,birth:document.getElementById('fb').value,note:document.getElementById('fno').value,supabaseUserId:sc.user_id};
    db.clients.push(c);save();closeModal();render();
    alert('Cliente creato correttamente. Ora può accedere dal suo telefono con email e password.');
  }catch(err){alert('Errore: '+(err.message||err));}
}
async function delClient(cid){
  const c=db.clients.find(x=>String(x.id)===String(cid));
  if(!c) return;
  if(!confirm(`Eliminare definitivamente ${c.name}? Verranno rimossi anche account e foto Check Foto.`)) return;
  try{
    const {data:{session:authSession}}=await sb.auth.getSession();
    if(!authSession?.access_token) throw new Error('Sessione trainer scaduta. Esci e accedi di nuovo.');
    const res=await fetch(`${SUPABASE_URL}/functions/v1/${EDGE_FUNCTION_SLUG}`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${authSession.access_token}`,'apikey':SUPABASE_KEY},
      body:JSON.stringify({action:'delete-client',clientId:String(cid)})
    });
    const out=await res.json().catch(()=>({}));
    if(!res.ok||!out.success) throw new Error(out.error||'Errore eliminazione cliente.');
    db.clients=db.clients.filter(x=>String(x.id)!==String(cid));
    db.workouts=db.workouts.filter(w=>String(w.clientId)!==String(cid));
    db.payments=db.payments.filter(p=>String(p.clientId)!==String(cid));
    db.appointments=db.appointments.filter(a=>String(a.clientId)!==String(cid));
    db.weights=db.weights.filter(w=>String(w.clientId)!==String(cid));
    save();render();
    alert('Cliente eliminato completamente.');
  }catch(err){alert('Errore: '+(err.message||err));}
}

async function saveAppointment(){
  if(!db.clients.length)return alert('Crea prima un cliente.');
  const clientId=document.getElementById('ac')?.value;
  const c=db.clients.find(x=>String(x.id)===String(clientId));
  const date=document.getElementById('ad')?.value||'';
  const time=document.getElementById('at')?.value||'';
  const note=(document.getElementById('an')?.value||'').trim();

  if(!c)return alert('Cliente non trovato.');
  if(!c.supabaseUserId)return alert('Questo cliente non è ancora collegato al suo account Supabase.');
  if(!date||!time)return alert('Inserisci data e ora.');

  const appointmentId=id('ap');
  try{
    const {error}=await sb.from('appointments').insert({
      id:appointmentId,
      client_id:String(c.id),
      client_user_id:c.supabaseUserId,
      appointment_date:date,
      appointment_time:time,
      note
    });
    if(error) throw error;

    db.appointments.push({
      id:appointmentId,
      clientId:String(c.id),
      supabaseUserId:c.supabaseUserId,
      date,
      time,
      note
    });
    save();
    closeModal();
    try{await syncAppointmentsFromSupabase();}catch(e){console.warn(e);}
    setTrainerPage('appointments');
    alert('Appuntamento salvato. Il cliente lo vedrà nella sua sezione Appuntamenti.');
  }catch(err){
    alert('Errore salvataggio appuntamento: '+(err.message||err));
  }
}
function paymentsPanel(){setTrainerPage('payments')}

function paymentForm(){
  if(!db.clients.length)return alert('Crea prima un cliente.');
  show(`<h2>Nuovo pagamento</h2>
    <label>Cliente</label>
    <select id="pc">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <div class="formgrid">
      <div><label>Importo (€)</label><input id="pa" type="number" step="0.01"></div>
      <div><label>Data</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div><label>Stato</label><select id="ps"><option>pagato</option><option>da pagare</option></select></div>
      <div><label>Metodo</label><input id="pm" placeholder="Contanti / Bonifico"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn blue" onclick="savePayment()">Salva</button>
    </div>`)
}

async function savePayment(){
  if(!db.clients.length)return alert('Crea prima un cliente.');
  const clientId=document.getElementById('pc')?.value;
  const c=db.clients.find(x=>String(x.id)===String(clientId));
  const amount=(document.getElementById('pa')?.value||'').trim();
  const date=document.getElementById('pd')?.value||'';
  const status=document.getElementById('ps')?.value||'pagato';
  const method=(document.getElementById('pm')?.value||'').trim();

  if(!c)return alert('Cliente non trovato.');
  if(!c.supabaseUserId)return alert('Questo cliente non è ancora collegato al suo account Supabase.');
  if(!amount||!date)return alert('Inserisci importo e data.');

  const paymentId=id('pay');
  try{
    const {error}=await sb.from('payments').insert({
      id:paymentId,
      client_id:String(c.id),
      client_user_id:c.supabaseUserId,
      amount:Number(amount),
      payment_date:date,
      status,
      method
    });
    if(error) throw error;

    db.payments.push({
      id:paymentId,
      clientId:String(c.id),
      supabaseUserId:c.supabaseUserId,
      amount,
      date,
      status,
      method
    });
    save();
    closeModal();
    try{await syncPaymentsFromSupabase();}catch(e){console.warn(e);}
    setTrainerPage('payments');
    alert('Pagamento salvato. Il cliente lo vedrà nella sua sezione Pagamenti.');
  }catch(err){
    alert('Errore salvataggio pagamento: '+(err.message||err));
  }
}

async function updateExerciseLoad(exId,val){
  const previous=db.workouts.find(x=>String(x.id)===String(exId))?.load??'';
  db.workouts=db.workouts.map(x=>String(x.id)===String(exId)?{...x,load:val}:x);
  save();
  if(session?.role!=='client') return;
  try{
    const payload={load:String(val??''),updated_at:new Date().toISOString()};
    let q=sb.from('workouts').update(payload).eq('id',String(exId));
    if(session?.supabaseUserId) q=q.eq('client_user_id',session.supabaseUserId);
    const {error}=await q;
    if(error) throw error;
  }catch(err){
    db.workouts=db.workouts.map(x=>String(x.id)===String(exId)?{...x,load:previous}:x);
    save();
    alert('Errore salvataggio peso: '+(err.message||err));
    try{await syncWorkoutsFromSupabase(session.userId);}catch(e){console.warn(e);}
    render();
  }
}

function client(){

  const appuntamentiPage=`

    <section class="section"><div class="sectionhead"><h2>Calendario</h2><div class="subtle-note">Appuntamenti totali: ${appointments.length}</div></div><div class="list">${appointments.length?appointments.map(x=>`<div class="row"><div><strong>${fmtDate(x.date)} · ${esc(x.time)}</strong><small>${esc(x.note||'Allenamento')}</small></div></div>`).join(''):`<div class="card empty">Nessun appuntamento.</div>`}</div></section>`;

  const scheda=`
    <section class="scheme-hero">
      <div class="days-wrap">${DAYS.map(day=>`<button class="day-tab ${day===currentDay?'active':''}" onclick="setClientDay('${day}')">${day}</button>`).join('')}</div>
      
      <div class="exercise-table">
        <div class="exercise-head"><div class="h-name">Esercizio</div><div>Serie</div><div>Rip</div><div>Rec</div><div>Peso</div></div>
        ${dayExercises.length?dayExercises.map(ex=>`
        <div class="exercise-row">
          <div class="ex-name">${esc(ex.exercise)}</div>
          <div class="ex-cell ex-sets">${esc(ex.sets)}</div>
          <div class="ex-cell">${esc(ex.reps)}</div>
          <div class="ex-cell">${fmtRest(ex.rest)}</div>
          <div class="ex-load-inline"><input type="number" step="0.5" value="${esc(ex.load||'')}" onchange="updateExerciseLoad('${ex.id}',this.value)"></div>
        </div>`).join(''):`<div class="card empty">Nessun esercizio assegnato per ${currentDay}.</div>`}
      </div>
    </section>`;

  const pagamenti=`
    <section class="page-head"><div class="page-kicker">Pagamenti</div><h1>I tuoi pagamenti</h1><div class="page-sub">Storico e stato aggiornato dei tuoi pagamenti.</div></section>
    <section class="section"><div class="list">${payments.length?payments.map(x=>`<div class="row"><div><strong>€ ${esc(x.amount)}</strong><small>${fmtDate(x.date)} · ${esc(x.method||'')}</small></div><div><span class="badge ${String(x.status).toLowerCase()==='pagato'?'ok':'due'}">${esc(x.status)}</span></div></div>`).join(''):`<div class="card empty">Nessun pagamento.</div>`}</div></section>`;

  const altro=`
    <section class="page-head"><div class="page-kicker">Altro</div><h1>Profilo e impostazioni</h1><div class="page-sub">Profilo, appuntamenti e personalizzazione della tua app.</div></section>
    <section class="section">
      <button class="more-action-card theme-access-card" style="width:100%" onclick="openThemeSettings()">

      </button>
    </section>
    <section class="section"><div class="sectionhead"><h2>Appuntamenti</h2></div><div class="list">${appointments.length?appointments.map(x=>`<div class="row"><div><strong>${fmtDate(x.date)} · ${esc(x.time)}</strong><small>${esc(x.note||'Allenamento')}</small></div></div>`).join(''):`<div class="card empty">Nessun appuntamento.</div>`}</div></section>

  if(!clientViewEl) return;
  clientViewEl.innerHTML=`<div class="client-shell">
    <div class="client-page ${session.page==='dashboard'?'active':''}" id="page-dashboard">${dashboard}</div>
    <div class="client-page ${session.page==='appuntamenti'?'active':''}" id="page-appuntamenti">${appuntamentiPage}</div>
    <div class="client-page ${session.page==='scheda'?'active':''}" id="page-scheda">${scheda}</div>
    <div class="client-page ${session.page==='pagamenti'?'active':''}" id="page-pagamenti">${pagamenti}</div>
    <div class="client-page ${session.page==='altro'?'active':''}" id="page-altro">${altro}</div>
  </div>`;

  const navActive=(session.page==='pagamenti'?'dashboard':(session.page||'scheda'));
  setNav([
    {key:'dashboard',label:'Dashboard',img:ICONS.home,action:"setPage('dashboard')"},
    {key:'appuntamenti',label:'Appunt.',img:ICONS.appointments,action:"setPage('appuntamenti')"},
    {key:'scheda',label:'Scheda',img:ICONS.scheda,action:"setPage('scheda')"},
    {key:'altro',label:'Altro',img:ICONS.more,action:"setPage('altro')"}
  ],navActive);
}
function show(x){
  const modalEl=document.getElementById('modal');
  const modalBodyEl=document.getElementById('modalBody');
  if(modalBodyEl) modalBodyEl.innerHTML=x;
  if(modalEl) modalEl.classList.remove('hidden');
}
function closeModal(){
  const modalEl=document.getElementById('modal');
  if(modalEl) modalEl.classList.add('hidden');
}
window.addEventListener("error",function(e){
  const err=document.getElementById("loginError");
  if(err && !document.getElementById("login")?.classList.contains("hidden")){
    err.textContent="Errore app: "+(e.message||"errore sconosciuto");
  }
});
loadAppTheme();
render();
