<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#03050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SDC Training</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020407;
    --bg2:#070b13;
    --card:#0c111b;
    --card2:#111722;
    --blue:#3478ff;
    --blue2:#65b4ff;
    --line:rgba(100,150,255,.18);
    --muted:#758198;
    --text:#f5f7fb;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% -10%,rgba(39,110,255,.16),transparent 35%),
        radial-gradient(circle at 0% 60%,rgba(18,68,180,.08),transparent 30%),
        #020407;
    color:white;
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-track{
    background:#05080d;
}

::-webkit-scrollbar-thumb{
    background:#19366e;
    border-radius:20px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    position:relative;
    overflow:hidden;
}

.login-screen:before{
    content:"";
    position:absolute;
    width:520px;
    height:520px;
    background:radial-gradient(circle,rgba(40,110,255,.22),transparent 65%);
    top:-220px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

.login-box{
    width:100%;
    max-width:430px;
    position:relative;
    z-index:2;
}

.logo-mark{
    width:118px;
    height:118px;
    margin:0 auto 20px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(45deg);
    border:1px solid rgba(100,170,255,.7);
    box-shadow:
        0 0 18px rgba(50,120,255,.55),
        inset 0 0 25px rgba(50,120,255,.08);
}

.logo-mark:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(100,170,255,.25);
}

.logo-text{
    transform:rotate(-45deg);
    font-family:Georgia,serif;
    font-size:43px;
    letter-spacing:5px;
    font-weight:500;
    color:white;
    text-shadow:0 0 22px rgba(100,170,255,.8);
}

.logo-dot{
    position:absolute;
    width:8px;
    height:8px;
    background:#fff;
    border-radius:50%;
    top:8px;
    right:8px;
    box-shadow:0 0 15px #fff;
}

.brand-name{
    text-align:center;
    font-family:Space Grotesk;
    font-weight:800;
    font-size:20px;
    letter-spacing:8px;
    color:#76b7ff;
}

.brand-sub{
    text-align:center;
    color:#5e6677;
    font-size:9px;
    letter-spacing:5px;
    margin-top:6px;
}

.login-card{
    margin-top:45px;
    background:
        linear-gradient(145deg,rgba(19,25,37,.96),rgba(7,11,18,.96));
    border:1px solid rgba(110,145,205,.18);
    border-radius:30px;
    padding:28px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.025);
}

.label{
    color:#76adff;
    font-size:10px;
    font-weight:800;
    letter-spacing:3px;
    margin-bottom:10px;
    display:block;
}

.field{
    width:100%;
    background:#070b12;
    color:#fff;
    border:1px solid #1a2943;
    border-radius:17px;
    padding:15px 16px;
    outline:none;
    transition:.2s;
}

.field:focus{
    border-color:#377dff;
    box-shadow:0 0 0 3px rgba(55,125,255,.10);
}

.login-button,
.primary-btn{
    border:0;
    color:white;
    font-weight:800;
    background:linear-gradient(135deg,#5595ff,#245cff);
    box-shadow:
        0 10px 30px rgba(42,101,255,.35),
        inset 0 1px rgba(255,255,255,.25);
    transition:.2s;
}

.login-button{
    width:100%;
    padding:16px;
    border-radius:17px;
    margin-top:22px;
}

.login-button:hover,
.primary-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 15px 35px rgba(42,101,255,.45);
}

.login-error{
    color:#ff7c8c;
    background:rgba(255,70,90,.08);
    border:1px solid rgba(255,70,90,.15);
    border-radius:12px;
    padding:11px;
    font-size:12px;
    margin-top:15px;
    display:none;
}

/* =========================
   APP
========================= */

.app-shell{
    min-height:100vh;
    padding-bottom:110px;
}

.topbar{
    padding:28px 20px 10px;
    max-width:1180px;
    margin:auto;
}

@media(min-width:800px){
    .topbar{
        padding-left:35px;
        padding-right:35px;
    }
}

.brand-small{
    font-family:Space Grotesk;
    font-weight:900;
    letter-spacing:2px;
    font-size:19px;
    background:linear-gradient(90deg,#fff,#6baaff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.page-container{
    width:100%;
    max-width:1180px;
    margin:auto;
    padding:10px 20px;
}

@media(min-width:800px){
    .page-container{
        padding:15px 35px;
    }
}

.glass{
    background:
        linear-gradient(145deg,rgba(18,25,38,.93),rgba(7,11,18,.93));
    border:1px solid rgba(105,143,204,.17);
    border-radius:25px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.18),
        inset 0 1px rgba(255,255,255,.025);
}

.section-title{
    font-size:20px;
    font-weight:900;
    letter-spacing:-.5px;
}

.muted{
    color:var(--muted);
}

/* =========================
   HERO
========================= */

.hero{
    padding:24px;
    position:relative;
    overflow:hidden;
}

.hero:after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    right:-100px;
    top:-100px;
    background:radial-gradient(circle,rgba(49,119,255,.30),transparent 68%);
}

.hero-tag{
    color:#70b2ff;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
}

.hero-title{
    font-size:28px;
    font-weight:900;
    line-height:1.05;
    margin-top:7px;
}

.hero-sub{
    color:#7c8ba5;
    font-size:12px;
    margin-top:7px;
}

.blue-line{
    height:3px;
    width:55px;
    border-radius:10px;
    background:linear-gradient(90deg,#63b7ff,#2660ff);
    box-shadow:0 0 14px #3478ff;
    margin-top:15px;
}

/* =========================
   STATS
========================= */

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

@media(min-width:600px){
    .stat-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

.stat-card{
    padding:17px;
}

.stat-label{
    color:#78879e;
    font-size:9px;
    letter-spacing:1.5px;
    font-weight:800;
}

.stat-value{
    font-size:25px;
    font-weight:900;
    margin-top:6px;
}

.stat-icon{
    width:34px;
    height:34px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(54,116,255,.12);
    border:1px solid rgba(75,130,255,.15);
}

/* =========================
   WORKOUT
========================= */

.today-card{
    padding:20px;
    position:relative;
    overflow:hidden;
}

.today-card:before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-80px;
    bottom:-100px;
    background:radial-gradient(circle,rgba(48,117,255,.35),transparent 65%);
}

.today-icon{
    width:53px;
    height:53px;
    border-radius:17px;
    background:linear-gradient(145deg,#19396f,#0d1930);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    border:1px solid rgba(100,160,255,.22);
}

.exercise-card{
    padding:19px;
    margin-bottom:11px;
    position:relative;
}

.exercise-number{
    color:#548dff;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
}

.exercise-name{
    font-size:18px;
    font-weight:800;
    margin-top:4px;
}

.exercise-meta{
    display:flex;
    gap:20px;
    margin-top:16px;
}

.meta-label{
    color:#727d91;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
}

.meta-value{
    font-size:15px;
    font-weight:800;
    margin-top:3px;
}

.weight-input{
    width:78px;
    border-radius:13px;
    background:#f5f6f8;
    color:#0b0d12;
    border:0;
    outline:0;
    text-align:center;
    padding:9px 5px;
    font-weight:800;
}

.weight-input:focus{
    box-shadow:0 0 0 3px rgba(53,125,255,.25);
}

/* =========================
   DAYS
========================= */

.days-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:3px 1px 10px;
}

.day-btn{
    flex:0 0 auto;
    background:#090e17;
    border:1px solid #1d293c;
    color:#78869a;
    padding:11px 17px;
    border-radius:14px;
    font-weight:800;
    font-size:12px;
}

.day-btn.active{
    color:white;
    background:linear-gradient(135deg,#60708b,#35445f);
    border-color:#70819d;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

/* =========================
   LIST
========================= */

.list-item{
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
}

.avatar{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border-radius:15px;
    background:linear-gradient(145deg,#214a92,#0e1d39);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    color:#8ec4ff;
    border:1px solid rgba(100,160,255,.15);
}

.small-btn{
    border:1px solid rgba(100,140,200,.15);
    background:#0b111c;
    color:#9ba8bc;
    padding:9px 12px;
    border-radius:12px;
    font-size:11px;
    font-weight:800;
}

.small-btn.blue{
    color:white;
    background:#215be5;
    border-color:#3270ff;
}

.small-btn.danger{
    color:#ff7d8b;
}

/* =========================
   CALENDAR
========================= */

.calendar-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.calendar-day{
    min-height:62px;
    padding:7px;
    background:#080d15;
    border:1px solid rgba(100,130,180,.08);
    border-radius:12px;
    cursor:pointer;
}

.calendar-day:hover{
    border-color:rgba(70,125,255,.35);
}

.calendar-day.today{
    border-color:#3278ff;
    box-shadow:inset 0 0 0 1px rgba(50,120,255,.25);
}

.calendar-day-number{
    font-size:11px;
    color:#9aa7ba;
}

.calendar-event-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#4d9cff;
    box-shadow:0 0 7px #3480ff;
    margin-top:7px;
}

@media(min-width:700px){
    .calendar-day{
        min-height:90px;
    }
}

/* =========================
   NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:100;
    left:12px;
    right:12px;
    bottom:12px;
    max-width:760px;
    margin:auto;
    padding:7px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(10,15,24,.92);
    border:1px solid rgba(100,145,220,.18);
    border-radius:25px;
    backdrop-filter:blur(25px);
    box-shadow:0 20px 50px rgba(0,0,0,.55);
}

.nav-btn{
    border:0;
    background:transparent;
    color:#68758a;
    padding:9px 5px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:8px;
    font-weight:800;
    letter-spacing:.4px;
}

.nav-btn.active{
    color:#69adff;
    background:linear-gradient(145deg,#18253a,#101a2a);
    box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.nav-icon{
    font-size:19px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
    position:fixed;
    z-index:200;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:12px;
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:100%;
    max-width:560px;
    max-height:92vh;
    overflow:auto;
    background:
        linear-gradient(145deg,#111824,#070b12);
    border:1px solid rgba(105,145,215,.2);
    border-radius:28px;
    padding:23px;
    box-shadow:0 -20px 80px rgba(0,0,0,.55);
    animation:modalIn .2s ease-out;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.modal-title{
    font-size:20px;
    font-weight:900;
}

.modal-close{
    width:38px;
    height:38px;
    border-radius:13px;
    border:1px solid #1c2a40;
    background:#0a101a;
    color:#8290a5;
}

.form-group{
    margin-top:17px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.modal-actions button{
    flex:1;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:500;
    top:18px;
    left:50%;
    transform:translate(-50%,-120px);
    background:#111a29;
    border:1px solid rgba(100,155,255,.25);
    color:white;
    padding:13px 18px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    font-size:12px;
    font-weight:700;
    transition:.3s;
}

.toast.show{
    transform:translate(-50%,0);
}

.toast.error{
    border-color:rgba(255,80,100,.35);
}

/* =========================
   UTILITIES
========================= */

.hidden{
    display:none!important;
}

.flex-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.mt{
    margin-top:18px;
}

.mb{
    margin-bottom:18px;
}

.empty{
    padding:35px 20px;
    text-align:center;
    color:#596579;
    font-size:12px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    border-radius:999px;
    padding:6px 10px;
    background:rgba(47,116,255,.10);
    color:#6daeff;
    border:1px solid rgba(75,130,255,.15);
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
}

.green{
    color:#63e3a3;
}

.red{
    color:#ff7888;
}

.search{
    position:relative;
}

.search input{
    padding-left:42px;
}

.search span{
    position:absolute;
    left:15px;
    top:13px;
    color:#647087;
}

.desktop-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}

@media(min-width:900px){
    .desktop-grid.two{
        grid-template-columns:1.15fr .85fr;
    }

    .desktop-grid.three{
        grid-template-columns:repeat(3,1fr);
    }
}

.table-like{
    overflow-x:auto;
}

.payment-status{
    font-size:10px;
    font-weight:900;
    color:#62e2a0;
}

.logout{
    border:0;
    background:transparent;
    color:#778399;
    font-size:11px;
    font-weight:700;
}

.logout:hover{
    color:white;
}
</style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<section id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="logo-mark">
            <span class="logo-text">SDC</span>
            <span class="logo-dot"></span>
        </div>

        <div class="brand-name">FITNESS</div>
        <div class="brand-sub">PERSONAL TRAINING</div>

        <div class="login-card">

            <label class="label">EMAIL</label>
            <input
                id="loginEmail"
                type="email"
                class="field"
                placeholder="nome@email.com"
                autocomplete="email"
            >

            <div style="height:18px"></div>

            <label class="label">PASSWORD</label>
            <input
                id="loginPassword"
                type="password"
                class="field"
                placeholder="••••••••"
                autocomplete="current-password"
            >

            <button id="loginButton" class="login-button">
                ENTRA NEL SISTEMA →
            </button>

            <div id="loginError" class="login-error"></div>

        </div>

        <div style="text-align:center;margin-top:18px;color:#3f4858;font-size:9px;letter-spacing:2px">
            SDC TRAINING • PRO MANAGEMENT
        </div>

    </div>

</section>


<!-- =========================================================
     APP
========================================================= -->

<div id="app" class="hidden app-shell">

    <header class="topbar">

        <div class="flex-between">

            <div>
                <div class="brand-small">SDC TRAINING</div>

                <div style="font-size:11px;color:#69768b;margin-top:4px">
                    <span id="headerGreeting">Bentornato</span>,
                    <strong id="headerName" style="color:white">—</strong>
                </div>
            </div>

            <div style="display:flex;align-items:center;gap:15px">

                <span id="roleBadge" class="badge">CLIENTE</span>

                <button class="logout" onclick="logout()">
                    ESCI
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         TRAINER / CLIENT DASHBOARD
    ====================================================== -->

    <main id="page-dashboard" class="page-container">

        <div id="dashboardContent"></div>

    </main>


    <!-- =====================================================
         SCHEDA
    ====================================================== -->

    <main id="page-scheda" class="page-container hidden">

        <div id="workoutContent"></div>

    </main>


    <!-- =====================================================
         PAGAMENTI
    ====================================================== -->

    <main id="page-pagamenti" class="page-container hidden">

        <div id="paymentContent"></div>

    </main>


    <!-- =====================================================
         APPUNTAMENTI
    ====================================================== -->

    <main id="page-appuntamenti" class="page-container hidden">

        <div id="appointmentContent"></div>

    </main>


    <!-- =====================================================
         BOTTOM NAV
    ====================================================== -->

    <nav class="bottom-nav">

        <button
            id="nav-dashboard"
            class="nav-btn active"
            onclick="showPage('dashboard')"
        >
            <span class="nav-icon">⌂</span>
            <span>DASHBOARD</span>
        </button>

        <button
            id="nav-scheda"
            class="nav-btn"
            onclick="showPage('scheda')"
        >
            <span class="nav-icon">◇</span>
            <span>SCHEDA</span>
        </button>

        <button
            id="nav-pagamenti"
            class="nav-btn"
            onclick="showPage('pagamenti')"
        >
            <span class="nav-icon">▣</span>
            <span>PAGAMENTI</span>
        </button>

        <button
            id="nav-appuntamenti"
            class="nav-btn"
            onclick="showPage('appuntamenti')"
        >
            <span class="nav-icon">◷</span>
            <span>AGENDA</span>
        </button>

    </nav>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div id="modalBackdrop" class="modal-backdrop" onclick="closeModalOutside(event)">

    <div id="modalBox" class="modal">

        <div id="modalContent"></div>

    </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script>

/* ============================================================
   FIREBASE

const firebaseConfig = {
    apiKey: "AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",

    databaseURL: "https://sdc-fitness-default-rtdb.firebaseio.com",
    projectId: "sdc-fitness",
    storageBucket: "sdc-fitness.firebasestorage.app",
