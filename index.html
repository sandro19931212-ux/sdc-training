<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDC ELITE - 4 PAGES FIX</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{background:#020408;color:#fff}.sdc{background:linear-gradient(180deg,#8ec6ff,#2a5bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;filter:drop-shadow(0 0 25px rgba(70,140,255,.8))}.glass{background:linear-gradient(135deg,rgba(28,38,68,.9),rgba(18,28,52,.9));border:1px solid rgba(120,180,255,.22);backdrop-filter:blur(22px);border-radius:24px}.btn{background:linear-gradient(135deg,#6ab4ff,#2a5bff);border-radius:999px}.nav-item.active{background:#1a2744;color:#6ab8ff}</style></head><body class="pb-28">

<script>
function entra(){var sel=document.getElementById('sel').value;var c=["Marcus Vance","Amara Osei","Dante Moretti","Sofia Ricci","Luca Bianchi"];window.cur=sel;window.curName=c[sel];document.getElementById('login').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('nav').style.display='flex';document.getElementById('nav').classList.remove('hidden');document.getElementById('hName').innerText=window.curName;showPage('dashboard');try{listenAll()}catch(e){}}
function showPage(p){['dashboard','scheda','pagamenti','appuntamenti'].forEach(function(x){document.getElementById('page-'+x).classList.add('hidden')});document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active')});document.getElementById('btn-'+p).classList.add('active')}
</script>

<div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:100%;max-width:400px;text-align:center"><h1 class="sdc" style="font-size:54px;line-height:.9">SDC<br>TRAINING</h1><div class="glass p-7 mt-6 text-left"><select id="sel" class="w-full bg-[#0c1222] border border-[#1e304f] rounded-2xl p-4 text-white font-bold"><option value="0">Marcus Vance</option><option value="1">Amara Osei</option><option value="2">Dante Moretti</option><option value="3">Sofia Ricci</option><option value="4">Luca Bianchi</option></select><input id="pw" type="password" value="sdc2024" class="w-full bg-[#eef2ff] border-2 border-[#3a6bff] rounded-2xl p-4 mt-4 text-black font-bold"><button onclick="entra()" class="btn w-full mt-6 py-4 text-white font-black">ENTRA NEL SISTEMA →</button></div></div></div>

<div id="app" class="hidden px-5 pt-8">
<div id="page-dashboard"><h1 class="sdc text-[22px]">DASHBOARD</h1><p class="text-[#7a8db0] text-xs">Ciao <span id="hName">Marcus</span></p><div class="glass p-5 mt-4">💪 TODAY'S SESSION - STRENGTH & POWER - 45 MIN</div><div class="grid grid-cols-3 gap-3 mt-4"><div class="glass p-4 text-center"><p class="text-[9px] text-[#6ab8ff] font-bold">ACTIVE CAL</p><p class="font-black text-[28px]">428</p></div><div class="glass p-4 text-center"><p class="text-[9px] text-[#6ab8ff] font-bold">STREAK</p><p class="font-black text-[28px]">7</p></div><div class="glass p-4 text-center"><p class="text-[9px] text-[#6ab8ff] font-bold">BPM</p><p class="font-black text-[28px]">128</p></div></div></div>
<div id="page-scheda" class="hidden"><h2 class="font-black text-[20px]">SCHEDA</h2><button onclick="addEx()" class="btn px-5 py-2 text-white text-xs font-bold mt-3">+ Esercizio</button><div id="exList" class="mt-4"></div></div>
<div id="page-pagamenti" class="hidden"><h2 class="font-black text-[20px]">PAGAMENTI</h2><button onclick="addPay()" class="btn px-5 py-2 text-white text-xs font-bold mt-3">+ Incasso</button><div id="payList" class="mt-4"></div></div>
<div id="page-appuntamenti" class="hidden"><h2 class="font-black text-[20px]">APPUNTAMENTI</h2><button onclick="addAp()" class="btn px-5 py-2 text-white text-xs font-bold mt-3">+ Prenota</button><div id="apList" class="mt-4"></div></div>
</div>

<div id="nav" class="hidden fixed bottom-4 left-4 right-4 glass flex justify-around py-3 px-2 rounded-[28px] z-50">
<button id="btn-dashboard" onclick="showPage('dashboard')" class="nav-item active flex flex-col items-center px-4 py-2 rounded-2xl"><span>🏠</span><span class="text-[9px] font-bold">DASHBOARD</span></button>
<button id="btn-scheda" onclick="showPage('scheda')" class="nav-item flex flex-col items-center px-4 py-2 rounded-2xl text-[#5a6f8f]"><span>💪</span><span class="text-[9px] font-bold">SCHEDA</span></button>
<button id="btn-pagamenti" onclick="showPage('pagamenti')" class="nav-item flex flex-col items-center px-4 py-2 rounded-2xl text-[#5a6f8f]"><span>💳</span><span class="text-[9px] font-bold">PAGAMENTI</span></button>
<button id="btn-appuntamenti" onclick="showPage('appuntamenti')" class="nav-item flex flex-col items-center px-4 py-2 rounded-2xl text-[#5a6f8f]"><span>📅</span><span class="text-[9px] font-bold">APPUNTAMENTI</span></button>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",authDomain:"sdc-fitness.firebaseapp.com",databaseURL:"https://sdc-fitness-default-rtdb.firebaseio.com",projectId:"sdc-fitness",storageBucket:"sdc-fitness.firebasestorage.app",messagingSenderId:"817117949572",appId:"1:817117949572:web:b74a51081ecaf640d91cd1"};
try{firebase.initializeApp(firebaseConfig);window.db=firebase.database()}catch(e){}
function listenAll(){db.ref('schede/'+cur).on('value',s=>{let ex=s.val()||[],h="";for(let i=0;i<ex.length;i++)h+=`<div class="bg-[#0f1a2e] border border-[#1e304f] rounded-2xl p-4 flex justify-between mb-2"><div><p class="font-bold">${ex[i].name}</p></div><button onclick="delEx(${i})">✕</button></div>`;document.getElementById('exList').innerHTML=h});db.ref('pagamenti').on('value',s=>{let p=s.val()||[],h="";for(let i=0;i<p.length;i++)h+=`<div class="glass p-4 mb-2 flex justify-between"><span>${p[i].cliente} - ${p[i].importo}</span><button onclick="delPay(${i})">✕</button></div>`;document.getElementById('payList').innerHTML=h});db.ref('appuntamenti/'+cur).on('value',s=>{let a=s.val()||[],h="";for(let i=0;i<a.length;i++)h+=`<div class="glass p-4 mb-2 flex justify-between"><span><b>${a[i].cliente}</b> - ${a[i].ora}</span><button onclick="delAp(${i})">✕</button></div>`;document.getElementById('apList').innerHTML=h})}
function addEx(){let n=prompt("Esercizio:");if(!n)return;let se=prompt("Serie:","4"),re=prompt("Rip:","10");db.ref('schede/'+cur).once('value',s=>{let a=s.val()||[];a.push({name:n,serie:se,rep:re});db.ref('schede/'+cur).set(a)})}
function addPay(){let im=prompt("Importo:","150€");if(im)db.ref('pagamenti').once('value',s=>{let a=s.val()||[];a.unshift({cliente:curName,importo:im});db.ref('pagamenti').set(a)})}
function addAp(){let o=prompt("Orario:","09:00");if(o)db.ref('appuntamenti/'+cur).once('value',s=>{let a=s.val()||[];a.push({cliente:curName,ora:o});db.ref('appuntamenti/'+cur).set(a)})}
function delEx(i){db.ref('schede/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('schede/'+cur).set(a)})}
function delPay(i){db.ref('pagamenti').once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('pagamenti').set(a)})}
function delAp(i){db.ref('appuntamenti/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('appuntamenti/'+cur).set(a)})}
</script>
</body>
</html>
