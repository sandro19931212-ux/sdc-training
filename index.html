/* ===== CRONOMETRO CIRCUITO / HYROX ===== */
let circuitStopwatchInterval=null;
function circuitStopwatchKey(cid,day){
  return 'sdc_circuit_stopwatch_'+String(cid||'guest')+'_'+String(day||'Giorno 1').replace(/\s+/g,'_');
}
function readCircuitStopwatch(cid,day){
  try{
    const raw=JSON.parse(localStorage.getItem(circuitStopwatchKey(cid,day))||'null');
    if(raw&&typeof raw==='object') return {running:!!raw.running,startedAt:Number(raw.startedAt)||0,elapsed:Number(raw.elapsed)||0};
  }catch(e){}
  return {running:false,startedAt:0,elapsed:0};
}
function writeCircuitStopwatch(cid,day,state){localStorage.setItem(circuitStopwatchKey(cid,day),JSON.stringify(state));}
function circuitStopwatchElapsed(state){return Math.max(0,(Number(state?.elapsed)||0)+(state?.running&&state?.startedAt?Date.now()-Number(state.startedAt):0));}
function formatCircuitStopwatch(ms){
  const total=Math.floor(Math.max(0,ms)/1000),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),sec=total%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function circuitStopwatchMarkup(cid,day){
  const s=readCircuitStopwatch(cid,day);
  return `<div class="circuit-stopwatch-card" data-cid="${esc(cid)}" data-day="${esc(day)}">
    <div class="circuit-stopwatch-label">CRONOMETRO</div>
    <div id="circuitStopwatchDisplay" class="circuit-stopwatch-display">${formatCircuitStopwatch(circuitStopwatchElapsed(s))}</div>
    <div class="circuit-stopwatch-actions">
      <button id="circuitStopwatchStart" class="btn blue" type="button" onclick="startCircuitStopwatch('${cid}','${day}')" ${s.running?'disabled':''}>Start</button>
      <button id="circuitStopwatchStop" class="btn red" type="button" onclick="stopCircuitStopwatch('${cid}','${day}')" ${s.running?'':'disabled'}>Stop</button>
    </div>
    <div class="circuit-stopwatch-note">Premi Start quando inizi il primo round e Stop appena completi l’ultimo.</div>
  </div>`;
}
function refreshCircuitStopwatch(){
  const card=document.querySelector('.circuit-stopwatch-card'); if(!card)return;
  const cid=card.dataset.cid,day=card.dataset.day,s=readCircuitStopwatch(cid,day);
  const display=document.getElementById('circuitStopwatchDisplay'); if(display)display.textContent=formatCircuitStopwatch(circuitStopwatchElapsed(s));
  const start=document.getElementById('circuitStopwatchStart'),stop=document.getElementById('circuitStopwatchStop');
  if(start)start.disabled=s.running; if(stop)stop.disabled=!s.running;
}
function startCircuitStopwatch(cid,day){
  writeCircuitStopwatch(cid,day,{running:true,startedAt:Date.now(),elapsed:0});
  refreshCircuitStopwatch();
}
async function stopCircuitStopwatch(cid,day){
  const current=readCircuitStopwatch(cid,day); if(!current.running)return;
  const elapsed=circuitStopwatchElapsed(current),formatted=formatCircuitStopwatch(elapsed);
  writeCircuitStopwatch(cid,day,{running:false,startedAt:0,elapsed});
  const input=document.getElementById('circuitTotalTimeInput'); if(input)input.value=formatted;
  await saveCircuitTotalTime(cid,day,formatted);
  refreshCircuitStopwatch();
}
if(!circuitStopwatchInterval)circuitStopwatchInterval=setInterval(refreshCircuitStopwatch,250);

// ===== TIMER RECUPERO SCHEDA =====
let workoutTimerInterval=null;
let workoutTimerAlarmInterval=null;
let workoutTimerAudioCtx=null;
function workoutTimerKey(){return 'sdc_workout_countdown_'+String(session?.userId||'guest');}
function defaultWorkoutTimer(){return {duration:60,remaining:60,endsAt:0,running:false,finished:false};}
function readWorkoutTimer(){
  try{
    const raw=JSON.parse(localStorage.getItem(workoutTimerKey())||'null');
    const s={...defaultWorkoutTimer(),...(raw||{})};
    s.duration=Math.max(1,Number(s.duration)||60);
    s.remaining=Math.max(0,Number(s.remaining));
    s.endsAt=Number(s.endsAt)||0;
    s.running=!!s.running;
    s.finished=!!s.finished;
    if(s.running&&s.endsAt){
      s.remaining=Math.max(0,Math.ceil((s.endsAt-Date.now())/1000));
      if(s.remaining<=0){s.running=false;s.endsAt=0;s.finished=true;}
    }
    return s;
  }catch(e){return defaultWorkoutTimer();}
}
function writeWorkoutTimer(s){localStorage.setItem(workoutTimerKey(),JSON.stringify(s));}
function formatWorkoutTimer(sec){
  const total=Math.max(0,Math.floor(Number(sec)||0)), h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
  return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function workoutTimerBeepOnce(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    if(!workoutTimerAudioCtx) workoutTimerAudioCtx=new AudioCtx();
    if(workoutTimerAudioCtx.state==='suspended') workoutTimerAudioCtx.resume();
    const osc=workoutTimerAudioCtx.createOscillator();
    const gain=workoutTimerAudioCtx.createGain();
    osc.type='sine';
    osc.frequency.value=880;
    gain.gain.setValueAtTime(.0001,workoutTimerAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.16,workoutTimerAudioCtx.currentTime+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,workoutTimerAudioCtx.currentTime+.28);
    osc.connect(gain);gain.connect(workoutTimerAudioCtx.destination);
    osc.start();osc.stop(workoutTimerAudioCtx.currentTime+.3);
  }catch(e){console.warn('Timer beep:',e);}
}
function startWorkoutTimerAlarm(){
  if(workoutTimerAlarmInterval)return;
  workoutTimerBeepOnce();
  try{if(navigator.vibrate)navigator.vibrate([220,100,220]);}catch(e){}
  workoutTimerAlarmInterval=setInterval(()=>{
    workoutTimerBeepOnce();
    try{if(navigator.vibrate)navigator.vibrate([220,100,220]);}catch(e){}
  },1200);
}
function stopWorkoutTimerAlarm(resetTimer=true){
  if(workoutTimerAlarmInterval){
    clearInterval(workoutTimerAlarmInterval);
    workoutTimerAlarmInterval=null;
  }
  if(resetTimer){
    const s=readWorkoutTimer();
    writeWorkoutTimer({duration:s.duration,remaining:s.duration,endsAt:0,running:false,finished:false});
    updateWorkoutTimerDisplay();
  }
}
function updateWorkoutTimerDisplay(){
  const prev=JSON.parse(localStorage.getItem(workoutTimerKey())||'null')||defaultWorkoutTimer();
  const s=readWorkoutTimer();
  if(s.finished&&!prev.finished)startWorkoutTimerAlarm();
  if(!s.finished&&workoutTimerAlarmInterval)stopWorkoutTimerAlarm(false);
  writeWorkoutTimer(s);
  const el=document.getElementById('workoutTimerDisplay');
  if(el)el.textContent=formatWorkoutTimer(s.remaining);
  const play=document.getElementById('workoutTimerPlay');
  if(play){play.textContent=s.running?'In corso':'Start';play.disabled=!!s.running;}
  const input=document.getElementById('workoutTimerSeconds');
  if(input){
    input.disabled=!!s.running;
    if(!s.running&&document.activeElement!==input)input.value=String(s.duration);
  }
  const card=document.querySelector('.workout-timer-card');
  if(card)card.classList.toggle('timer-finished',s.finished&&s.remaining===0);
  const stop=document.getElementById('workoutTimerStop');
  if(stop)stop.style.display=s.finished?'block':'none';
  const controls=document.getElementById('workoutTimerControls');
  if(controls)controls.style.display=s.finished?'none':'block';
  const title=document.getElementById('workoutTimerTitle');
  if(title)title.textContent=s.finished?'Tempo scaduto':'Scegli il tempo';
}
function workoutTimerPlay(){
  const current=readWorkoutTimer();
  if(current.running)return;
  stopWorkoutTimerAlarm(false);
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(AudioCtx){
      if(!workoutTimerAudioCtx) workoutTimerAudioCtx=new AudioCtx();
      if(workoutTimerAudioCtx.state==='suspended') workoutTimerAudioCtx.resume();
    }
  }catch(e){}
  const input=document.getElementById('workoutTimerSeconds');
  const sec=Math.max(1,Math.min(3600,Math.floor(Number(input?.value)||current.duration||60)));
  const s={duration:sec,remaining:sec,endsAt:Date.now()+sec*1000,running:true,finished:false};
  writeWorkoutTimer(s);
  updateWorkoutTimerDisplay();
}
function workoutTimerMarkup(){
  const s=readWorkoutTimer();
  return `<section class="workout-timer-card ${s.finished?'timer-finished':''}">
    <div class="workout-timer-head">
      <div>
        <div class="page-kicker">Timer recupero</div>
        <h2 id="workoutTimerTitle">${s.finished?'Tempo scaduto':'Scegli il tempo'}</h2>
      </div>
      <div id="workoutTimerDisplay" class="workout-timer-display">${formatWorkoutTimer(s.remaining)}</div>
    </div>
    <div class="workout-timer-simple">
      <div id="workoutTimerControls" style="${s.finished?'display:none':''}">
        <label for="workoutTimerSeconds">Secondi</label>
        <div class="workout-timer-inputrow">
          <input id="workoutTimerSeconds" type="number" min="1" max="3600" inputmode="numeric" value="${s.duration}" ${s.running?'disabled':''}>
          <button id="workoutTimerPlay" class="btn blue" onclick="workoutTimerPlay()" ${s.running?'disabled':''}>${s.running?'In corso':'Start'}</button>
        </div>
      </div>
      <button id="workoutTimerStop" class="btn danger workout-timer-stop" onclick="stopWorkoutTimerAlarm(true)" style="${s.finished?'display:block':'display:none'}">STOP</button>
    </div>
  </section>`;
}
if(!workoutTimerInterval) workoutTimerInterval=setInterval(updateWorkoutTimerDisplay,250);

saveAppointment=async function(){const button=document.getElementById('managementSave');if(button.disabled)return;button.disabled=true;try{const c=db.clients.find(c=>c.id===document.getElementById('ac').value);const date=document.getElementById('ad').value,time=document.getElementById('at').value,duration=Number(document.getElementById('adu').value),note=document.getElementById('an').value.trim(),count=Number(document.getElementById('ar')?.value||1);if(!c?.supabaseUserId||!date||!time||duration<15||duration>240||duration%15)throw Error('Controlla cliente, data, ora e durata (15–240 minuti, multipli di 15).');await syncAppointmentsFromSupabase();const slots=Array.from({length:count},(_,i)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+7*i);return {date:localISODate(d),time,duration};});const conflicts=slots.flatMap(a=>db.appointments.filter(b=>b.id!==editingAppointment&&overlapping(a,b)));if(conflicts.length)throw Error('Sovrapposizione: '+conflicts.map(a=>`${fmtDate(a.date)} ${a.time} ${cname(a.clientId)}`).join('; ')+'. Scegli un altro orario.');const rows=slots.map(a=>({id:editingAppointment||id('ap'),client_id:c.id,client_user_id:c.supabaseUserId,appointment_date:a.date,appointment_time:a.time,duration_minutes:duration,note}));const result=editingAppointment?await sb.from('appointments').update(rows[0]).eq('id',editingAppointment):await sb.from('appointments').insert(rows);if(result.error)throw result.error;await syncAppointmentsFromSupabase();closeModal();await setTrainerPage('appointments');notifyManagement('Appuntamenti salvati.');}catch(e){formError(e);}finally{button.disabled=false;}};
paymentForm=function(key='',edit=false){if(!db.clients.length)return alert('Crea prima un cliente.');const p=edit?db.payments.find(p=>p.id===key):null;editingPayment=p?.id||null;show(`<h2>${p?'Modifica':'Nuovo'} pagamento</h2><label>Cliente<select id="pc">${db.clients.map(c=>`<option value="${c.id}" ${c.id===(p?.clientId||key)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class="formgrid"><label>Importo (€)<input id="pa" type="number" min="0.01" step="0.01" value="${esc(p?.amount||'')}"></label><label>Data registrazione / incasso<input id="pd" type="date" value="${p?.date||localTodayISO()}"></label><label>Stato<select id="ps"><option ${p&& !paidPayment(p)?'':'selected'}>pagato</option><option ${p&&!paidPayment(p)?'selected':''}>da pagare</option></select></label><label>Cosa ha acquistato<input id="pp" value="${esc(p?.purpose||'')}" placeholder="Es. pacchetto 8 lezioni"></label><label>Metodo di incasso (facoltativo)<input id="pm" list="paymentPurchases" value="${esc(p?.method||'')}" placeholder="Contanti / Bonifico / Carta"><datalist id="paymentPurchases"><option>Contanti</option><option>Bonifico</option><option>Carta</option></datalist></label><label>Scadenza<input id="pdu" type="date" value="${p?.dueDate||''}"></label></div><p>Indica il servizio o il pacchetto acquistato. Il metodo di incasso è facoltativo.</p><p id="formError" role="alert"></p><div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button id="managementSave" class="btn blue" onclick="savePayment()">Salva</button></div>`);};
savePayment=async function(){const button=document.getElementById('managementSave');if(button.disabled)return;button.disabled=true;try{const c=db.clients.find(c=>c.id===document.getElementById('pc').value);const amount=Number(document.getElementById('pa').value),date=document.getElementById('pd').value;if(!c?.supabaseUserId||!Number.isFinite(amount)||amount<=0||!date)throw Error('Inserisci cliente collegato, importo positivo e data.');const row={id:editingPayment||id('pay'),client_id:c.id,client_user_id:c.supabaseUserId,amount,payment_date:date,status:document.getElementById('ps').value,method:document.getElementById('pm').value.trim(),purpose:document.getElementById('pp').value.trim(),due_date:document.getElementById('pdu').value||null};const {error}=editingPayment?await sb.from('payments').update(row).eq('id',editingPayment):await sb.from('payments').insert(row);if(error)throw error;await syncPaymentsFromSupabase();closeModal();await setTrainerPage('payments');notifyManagement('Pagamento salvato.');}catch(e){formError(e);}finally{button.disabled=false;}};

let trainerDirectoryPending=null;

async function refreshTrainerDirectory(redraw=false){
  if(session?.role!=='trainer')return;
  if(!trainerDirectoryPending){
    trainerDirectoryPending=syncClientsFromSupabase().then(()=>{trainerDirectoryError='';}).catch(error=>{
      trainerDirectoryError='Non riesco ad aggiornare i clienti. Controlla la connessione e premi Aggiorna elenco.';
      console.warn('Aggiornamento elenco clienti:',error);
    }).finally(()=>{trainerDirectoryPending=null;});
  }
  await trainerDirectoryPending;
  if(redraw&&session?.role==='trainer')render();
}

const SDC_REF='snjxpiwxaekpkcdyuyxb';
const DATA_TABLES=['clients','workouts','payments','appointments','weights','workout_archives','check_photos'];
let activeActor='',authEpoch=0,bootPending=null,refreshPending=null,signingOut=false;

const stabilityShow=show,stabilityCloseModal=closeModal;
show=function(html){modalRevision++;return stabilityShow(html);};

save=()=>{if(activeActor&&session?.supabaseUserId===activeActor)localStorage.setItem('sdc_data_v10:'+activeActor,JSON.stringify(db));};

const emptyDatabase=()=>({clients:[],workouts:[],payments:[],appointments:[],weights:[],workoutArchives:[]});
function storageKeys(storage){return Array.from({length:storage.length},(_,i)=>storage.key(i)).filter(Boolean);}
function clearPrivateCache(includeAuth=true){
 for(const storage of [localStorage,sessionStorage])for(const key of storageKeys(storage)){
  if(/^sdc_(training|session|data|ui|pending|workout|circuit)/.test(key)||(includeAuth&&/^sb-snjxpiwxaekpkcdyuyxb-auth-token/.test(key)))storage.removeItem(key);
 }
 localStorage.removeItem(KEY);localStorage.removeItem(SESSION_KEY);localStorage.removeItem('sdc_training_v5');localStorage.removeItem('sdc_session_v5');
}
function discardPrivateState(includeAuth=true){
 authEpoch++;activeActor='';session=null;db=emptyDatabase();paymentOperation=null;appointmentOperation=null;restorableBackup=null;
 trainerDirectoryPending=null;refreshPending=null;trainerDirectoryError='';closeModal();clearPrivateCache(includeAuth);
 for(const id of ['trainerView','clientView','modalBody']){const node=document.getElementById(id);if(node)node.innerHTML='';}
 const password=document.getElementById('password');if(password)password.value='';

logout=async function(){
 signingOut=true;discardPrivateState(false);render();
 try{const {error}=await sb.auth.signOut({scope:'local'});if(error)console.warn('Disconnessione:',error);}catch(error){console.warn(error);}finally{clearPrivateCache();signingOut=false;}
};
function loginMessage(text){const node=document.getElementById('loginError');if(node)node.textContent=text;}
async function bootstrapAuthenticatedApp(){
 if(bootPending)return bootPending;
 bootPending=(async()=>{
  const startingEpoch=authEpoch;
  const {data:auth,error}=await sb.auth.getUser();
  if(startingEpoch!==authEpoch||signingOut)return;
  if(error||!auth?.user){discardPrivateState();render();if(error)loginMessage('Accedi per aprire i tuoi dati. Se sei offline, riprova quando torna la connessione.');return;}
  const user=auth.user;authEpoch++;activeActor=user.id;db=emptyDatabase();
  for(const key of ['sdc_training_v5','sdc_training_v6','sdc_session_v5','sdc_session_v6'])localStorage.removeItem(key);
  let ui={};try{ui=JSON.parse(localStorage.getItem('sdc_ui_v10:'+activeActor)||'{}');}catch{}
  const role=user.app_metadata?.role==='trainer'?'trainer':'client';
  session={role,userId:null,supabaseUserId:user.id,page:role==='trainer'?'dashboard':'scheda',clientDay:'Giorno 1'};
  const allowed=role==='trainer'?['dashboard','clients','scheda','appointments','payments','more']:['dashboard','scheda','appuntamenti','peso','altro'];
  if(allowed.includes(ui.page))session.page=ui.page;
  if(DAYS.includes(ui.clientDay))session.clientDay=ui.clientDay;
  await syncClientsFromSupabase();
  if(role==='client'){
   const own=db.clients.find(c=>c.supabaseUserId===user.id);if(!own){await logout();loginMessage('Profilo non disponibile. Contatta il trainer.');return;}
   session.userId=own.id;
  }
  await refreshAllData();saveSession();render();
 })().catch(error=>{discardPrivateState();render();loginMessage('Non riesco a verificare l’accesso. Controlla la connessione e riprova.');console.warn(error);}).finally(()=>{bootPending=null;});
 return bootPending;
}
login=async function(){
 const expected=roleEl().value,username=(document.getElementById('username')?.value||'').trim(),password=document.getElementById('password')?.value||'';
 loginMessage('');
 try{
  if(expected==='trainer'&&username!==TRAINER.username)throw Error('Credenziali non valide.');
  const {data,error}=await sb.auth.signInWithPassword({email:expected==='trainer'?TRAINER.email:username.toLowerCase(),password});
  if(error||!data?.user)throw Error('Credenziali non valide.');
  if(expected==='trainer'&&data.user.app_metadata?.role!=='trainer'){await logout();throw Error('Account trainer non autorizzato.');}
  await bootstrapAuthenticatedApp();
 }catch(error){loginMessage(error.message||'Accesso non riuscito.');}
};
async function readRows(table,active=true){
 const result=[];
 for(let offset=0;;offset+=500){
  let query=sb.from(table).select('*').order('id',{ascending:true}).range(offset,offset+499);
  if(active&&['clients','payments','appointments'].includes(table))query=query.is('deleted_at',null);
  const {data,error}=await query;if(error)throw error;result.push(...(data||[]));if((data||[]).length<500)break;
 }
 return result;
}
function currentRead(epoch,actor){if(epoch!==authEpoch||actor!==activeActor||!session)throw Error('Sessione cambiata.');}
function activeChildren(rows){const ids=new Set(db.clients.map(c=>c.id));return rows.filter(r=>ids.has(String(r.client_id)));}
function mapClient(c){return {id:String(c.id),supabaseUserId:c.user_id,name:c.name,email:c.email,phone:c.phone||'',birth:c.birth||'',note:c.note||'',openingBalance:c.lesson_opening_balance==null?null:Number(c.lesson_opening_balance)};}
function mapPayment(p){return {id:String(p.id),clientId:String(p.client_id),supabaseUserId:p.client_user_id,amount:String(p.amount),date:p.payment_date,status:p.status,method:p.method||'',purpose:p.purpose||'',dueDate:p.due_date||'',lessonQuantity:Number(p.lesson_quantity)||0};}
function mapAppointment(a){return {id:String(a.id),clientId:String(a.client_id),supabaseUserId:a.client_user_id,date:a.appointment_date,time:(a.appointment_time||'').slice(0,5),note:a.note||'',duration:Number(a.duration_minutes)||60,attendanceStatus:a.attendance_status||'booked',consumeCredit:a.consume_credit!==false};}
syncClientsFromSupabase=async function(){
 const epoch=authEpoch,actor=activeActor,rows=await readRows('clients');currentRead(epoch,actor);db.clients=rows.map(mapClient);
 const ids=new Set(db.clients.map(c=>c.id));for(const key of ['workouts','payments','appointments','weights','workoutArchives'])db[key]=(db[key]||[]).filter(r=>ids.has(String(r.clientId)));save();return db.clients;
};
syncPaymentsFromSupabase=async function(){const e=authEpoch,a=activeActor,rows=await readRows('payments');currentRead(e,a);db.payments=activeChildren(rows).map(mapPayment);save();return db.payments;};
syncAppointmentsFromSupabase=async function(){const e=authEpoch,a=activeActor,rows=await readRows('appointments');currentRead(e,a);db.appointments=activeChildren(rows).map(mapAppointment);save();return db.appointments;};
syncWeightsFromSupabase=async function(){const e=authEpoch,a=activeActor,rows=await readRows('weights');currentRead(e,a);db.weights=activeChildren(rows).map(w=>({id:String(w.id),clientId:String(w.client_id),supabaseUserId:w.client_user_id,date:w.weight_date,weight:String(w.weight)}));save();return db.weights;};
syncWorkoutsFromSupabase=async function(){const e=authEpoch,a=activeActor,revision=modalRevision,rows=await readRows('workouts');currentRead(e,a);if(revision!==modalRevision)return db.workouts;db.workouts=activeChildren(rows).map(w=>({id:String(w.id),clientId:String(w.client_id),supabaseUserId:w.client_user_id,title:w.title||'',day:w.day||'Giorno 1',exercise:w.exercise||'',sets:String(w.sets??''),reps:String(w.reps??''),rest:String(w.rest??''),load:String(w.load??''),note:session.role==='client'?(w.note||''):'',position:Number(w.position)||9999}));save();return db.workouts;};
syncWorkoutArchivesFromSupabase=async function(){const e=authEpoch,a=activeActor,rows=await readRows('workout_archives');currentRead(e,a);db.workoutArchives=activeChildren(rows).map(r=>({id:String(r.id),clientId:String(r.client_id),clientUserId:r.client_user_id,title:r.title,archivedAt:r.archived_at,workouts:r.snapshot||[]}));save();return db.workoutArchives;};
async function refreshAllData(){
 if(!session||!activeActor)return;
 if(refreshPending)return refreshPending;
 const epoch=authEpoch;
 const task=(async()=>{await syncClientsFromSupabase();await Promise.all([syncPaymentsFromSupabase(),syncAppointmentsFromSupabase(),syncWeightsFromSupabase(),syncWorkoutsFromSupabase(),syncWorkoutArchivesFromSupabase()]);})();

function validateBackup(value){
 if(!value||value.format!=='sdc-training-backup'||value.version!==1||value.project!==SDC_REF)throw Error('Questo file non è un backup valido di questa app.');
 for(const table of DATA_TABLES)if(Array.isArray(value.tables?.[table]))value.tables[table]=value.tables[table].map(row=>({...row,id:row.id==null?'':String(row.id),...(row.client_id!=null?{client_id:String(row.client_id)}:{})}));
 for(const table of DATA_TABLES){if(!Array.isArray(value.tables?.[table])||value.tables[table].length>100000)throw Error('Dati non validi: '+table);const ids=new Set();for(const row of value.tables[table]){if(!row||typeof row!=='object'||Array.isArray(row)||typeof row.id!=='string'||!row.id||ids.has(row.id)||Object.keys(row).some(k=>!BACKUP_FIELDS[table].includes(k)))throw Error('Record non valido: '+table);ids.add(row.id);}}
 const clients=new Map(value.tables.clients.map(c=>[String(c.id),c.user_id]));
 for(const table of DATA_TABLES.filter(t=>t!=='clients'))for(const row of value.tables[table]){const owner=clients.get(String(row.client_id));if(!owner||owner!==(table==='check_photos'?row.user_id:row.client_user_id))throw Error('Collegamento cliente non valido nel backup.');}
 if(!Array.isArray(value.photos)||value.photos.some(p=>!p||typeof p.path!=='string'||p.path.includes('..')||typeof p.base64!=='string'||!value.tables.check_photos.some(r=>r.photo_path===p.path)))throw Error('Foto non valide.');
 if(value.tables.check_photos.some(r=>!value.photos.some(p=>p.path===r.photo_path)))throw Error('Il backup non contiene tutte le foto.');
 return value;
}

  for(const photo of backup.photos){const bytes=Uint8Array.from(atob(photo.base64),c=>c.charCodeAt(0));const {error}=await sb.storage.from('check-foto').upload(photo.path,new Blob([bytes],{type:photo.type}),{upsert:false});if(error&&!['409','Duplicate'].includes(String(error.statusCode||error.error)))throw error;}

<script id="sdc-visual-viewport-bottom-v3">
(function(){
  const root=document.documentElement;
  function syncBottomNavViewport(){
    const vv=window.visualViewport;
    let covered=0;
    if(vv){
      const layoutHeight=Math.max(document.documentElement.clientHeight||0, window.innerHeight||0);
      covered=Math.max(0, Math.round(layoutHeight - (vv.height + vv.offsetTop)));
    }
    root.style.setProperty('--sdc-visual-bottom', covered+'px');
  }
  syncBottomNavViewport();
  window.addEventListener('resize', syncBottomNavViewport, {passive:true});
  window.addEventListener('orientationchange', syncBottomNavViewport, {passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', syncBottomNavViewport, {passive:true});
    window.visualViewport.addEventListener('scroll', syncBottomNavViewport, {passive:true});
  }
})();
</script>

<script>
// Aggiornamento automatico PWA: quando pubblichi una nuova versione su GitHub,
// il nuovo service worker viene controllato, attivato e applicato subito.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let reloadingForUpdate = false;

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    window.location.reload();
  });

  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("./sw.js?v=7", { updateViaCache: "none" });

      const activateWaitingWorker = () => {
        if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
      };

      activateWaitingWorker();

      reg.addEventListener("updatefound", () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener("statechange", () => {
          if (worker.state === "installed" && navigator.serviceWorker.controller) {
            worker.postMessage("SKIP_WAITING");
          }
        });
      });

      // Controlla subito e poi periodicamente mentre l'app resta aperta.
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 60 * 1000);

      // Ricontrolla anche quando l'utente torna nell'app.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
    } catch (err) {
      console.warn("SW:", err);
    }
  });
}

</script>
