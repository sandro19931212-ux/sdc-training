<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#03060d">
    <title>SDC Training</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03060d;
            --panel: #0b1220;
            --blue: #58b7ff;
            --muted: #8291ad;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; 
            background: var(--bg);
            color: #fff; 
            font-family: 'Inter', Arial, sans-serif; 
            min-height: 100vh; 
        }
        .hidden { display: none !important; }
        .logo { text-align: center; margin: 40px 0; }
        .login-card { background: #1a1a1a; padding: 20px; border-radius: 8px; }
        .btn { background: var(--blue); color: #fff; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .nav { display: flex; justify-content: space-around; background: #0b1220; padding: 10px; }
        .nav button { background: none; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<section id="login" class="screen login">
    <div class="logo"><h1>SDC TRAINING</h1></div>
    <div class="login-card">
        <label>Accesso</label>
        <select id="loginRole">
            <option value="client">Cliente</option>
            <option value="admin">Personal Trainer</option>
        </select>
        <div id="adminUsernameWrap" class="hidden">
            <label>Nome utente trainer</label>
            <input id="adminUsername" placeholder="SDCTrainer">
        </div>
        <div id="clientSelectWrap">
            <label>Cliente</label>
            <select id="loginClient"></select>
        </div>
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Inserisci la password">
        <button class="btn" id="loginBtn">ENTRA →</button>
    </div>
</section>

<section id="app" class="hidden">
    <nav class="nav">
        <button data-page="dashboard">Dashboard</button>
        <button data-page="scheda">Scheda</button>
        <button data-page="pagamenti">Pagamenti</button>
        <button data-page="appuntamenti">Appuntamenti</button>
        <button data-page="profilo">Profilo</button>
    </nav>
    <main>
        <section id="page-dashboard" class="page"></section>
        <section id="page-scheda" class="page hidden"></section>
        <section id="page-pagamenti" class="page hidden"></section>
        <section id="page-appuntamenti" class="page hidden"></section>
        <section id="page-profilo" class="page hidden"></section>
    </main>
</section>

<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",
        authDomain: "sdc-fitness.firebaseapp.com",
        databaseURL: "https://sdc-fitness-default-rtdb.firebaseio.com",
        projectId: "sdc-fitness",
        storageBucket: "sdc-fitness.firebasestorage.app",
        messagingSenderId: "817117949572",
        appId: "1:817117949572:web:b74a51081ecaf640d91cd1"
    };

    let state = {}, session = {};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function toast(message) {
        const el = document.getElementById('toast');
        el.innerText = message;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    document.getElementById('loginBtn').onclick = function() {
        const role = document.getElementById('loginRole').value;
        const pw = document.getElementById('loginPassword').value;

        if (role === 'admin') {
            const username = document.getElementById('adminUsername').value;
            if (username === 'SDCTrainer' && pw === 'SDC!Elite26#PT') {
                session = { role: 'admin' };
                toast('Accesso come trainer riuscito');
            } else {
                toast('Nome utente o password errati');
                return;
            }
        } else {
            const clientId = document.getElementById('loginClient').value;
            if (state.clients[clientId]?.password === pw) {
                session = { role: 'client', clientId };
                toast('Accesso come cliente riuscito');
            } else {
                toast('Credenziali non corrette');
                return;
            }
        }

        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        // Call a function to render the dashboard or home page
    };
</script>
</body>
</html>
