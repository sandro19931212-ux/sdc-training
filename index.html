<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDC PREMIUM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet"><style>*{font-family:Inter,sans-serif}body{background:#050508;color:#fff}.glass{background:rgba(21,24,43,0.9);border:1px solid rgba(122,162,255,0.15);backdrop-filter:blur(20px)}.btn{background:linear-gradient(135deg,#6a9eff,#2a5bff);box-shadow:0 4px 20px rgba(42,91,255,0.4);font-weight:800}.logo{width:110px;height:110px;border:2px solid #7aa2ff;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border-radius:12px;box-shadow:0 0 30px rgba(122,162,255,0.3)}</style></head><body class="pb-28">
<div id="login" class="min-h-screen flex items-center justify-center p-6"><div class="w-full max-w-[400px] text-center">
<div class="flex justify-center mb-6"><div class="logo"><span style="transform:rotate(-45deg);font-weight:900;font-size:32px">SDC</span></div></div>
<h1 class="text-3xl font-black">SDC TRAINING</h1><p class="text-[11px] tracking-[4px] text-zinc-500 font-bold">PREMIUM COACHING</p>
<div class="glass rounded-[28px] p-6 mt-6 text-left">
<p class="text-[10px] text-zinc-500 font-bold mb-2">SELEZIONA CLIENTE</p>
<select id="sel" class="w-full bg-[#0a0c16] border border-white/10 rounded-2xl p-4 text-sm font-bold">
<option value="0">Marcus Vance</option>
<option value="1">Amara Osei</option>
<option value="2">Dante Moretti</option>
<option value="3">Sofia Ricci</option>
<option value="4">Luca Bianchi</option>
</select>
<p class="text-[10px] text-zinc-500 font-bold mb-2 mt-4">PASSWORD</p>
<input id="pw" type="password" placeholder="••••" class="w-full bg-[#0a0c16] border border-white/10 rounded-2xl p-4 text-sm">
<p class="text-[10px] text-zinc-600 mt-3">Trainer: sdc2024 | Cliente: cliente123</p>
<button id="btnEntra" class="w-full mt-5 btn rounded-full py-4 text-sm">ENTRA →</button>
<p id="conn" class="text-[10px] text-center mt-3 text-emerald-400 font-bold">● PRONTO - ONLINE</p>
</div></div></div>
<div id="app" class="hidden"><div class="p-5 border-b border-white/10 flex justify-between items-center glass sticky top-0"><div class="flex gap-3 items-center"><div style="width:38px;height:38px;border:1.5px solid #7aa2ff;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border-radius:8px"><span style="transform:rotate(-45deg);font-weight:900;font-size:11px">SDC</span></div><div><b id="hName">-</b><p id="roleBadge" class="text-[9px]"></p></div></div><button onclick="location.reload()" class="text-[11px] bg-[#15182b] px-4 py-2 rounded-full">Esci</button></div>
<div id="page-scheda" class="p-5"><div class="flex justify-between"><h2 class="font-black text-xl">Scheda</h2><button id="btnAddEx" class="btn rounded-full px-5 py-2.5 text-xs">+ Esercizio</button></div><div id="exList" class="mt-5"></div></div>
<div id="page-appuntamenti" class="hidden p-5"><div class="flex justify-between"><h2 class="font-black text-xl">Appuntamenti</h2><button id="btnAddAp" class="btn rounded-full px-4 py-2 text-xs">+ Nuovo</button></div><div id="apList" class="mt-5"></div></div>
<div id="page-peso" class="hidden p-5"><div class="flex justify-between"><h2 class="font-black text-xl">Peso</h2><button id="btnAddW" class="btn rounded-full px-4 py-2 text-xs">+ Peso</button></div><div id="wList" class="mt-5"></div></div>
<div id="page-pay" class="hidden p-5"><h2 class="font-black text-xl">Pagamenti</h2><div id="payList" class="mt-4"></div><button id="btnAddPay" class="btn rounded-full px-4 py-2 text-xs mt-3">+ Incasso</button></div>
</div>
<div id="nav" class="hidden fixed bottom-0 left-0 right-0 bg-[#0a0c16] border-t border-white/10 flex justify-around p-3 text-[10px]"><button onclick="showPage('scheda')" id="n-scheda" class="flex flex-col items-center text-[#6a9eff]"><span class="text-[20px]">💪</span>Scheda</button><button onclick="showPage('appuntamenti')" id="n-appuntamenti" class="flex flex-col items-center text-zinc-500"><span class="text-[20px]">📅</span>Book</button><button onclick="showPage('peso')" id="n-peso" class="flex flex-col items-center text-zinc-500"><span class="text-[20px]">⚖️</span>Peso</button><button onclick="showPage('pay')" id="n-pay" class="flex flex-col items-center text-zinc-500"><span class="text-[20px]">💳</span>Pay</button></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",authDomain:"sdc-fitness.firebaseapp.com",databaseURL:"https://sdc-fitness-default-rtdb.firebaseio.com",projectId:"sdc-fitness",storageBucket:"sdc-fitness.firebasestorage.app",messagingSenderId:"817117949572",appId:"1:817117949572:web:b74a51081ecaf640d91cd1"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let clients=["Marcus Vance","Amara Osei","Dante Moretti","Sofia Ricci","Luca Bianchi"],cur=0,curName="",isTrainer=false;
document.getElementById('btnEntra').addEventListener('click', entra);
document.getElementById('btnEntra').addEventListener('touchend', entra);
function entra(){let p=document.getElementById('pw').value.trim();if(p!=="sdc2024" && p!=="cliente123"){alert("Password errata: usa sdc2024");return;}isTrainer=(p==="sdc2024");let sel=document.getElementById('sel');cur=sel.value;curName=clients[cur];document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('nav').style.display='flex';document.getElementById('hName').innerText=curName;document.getElementById('roleBadge').innerHTML=isTrainer?'<span style="color:#6a9eff">● TRAINER</span>':'<span style="color:#888">● CLIENTE</span>';showPage('scheda');listenAll();}
function showPage(p){['scheda','appuntamenti','peso','pay'].forEach(x=>{document.getElementById('page-'+x).classList.add('hidden');document.getElementById('n-'+x).classList.remove('text-[#6a9eff]');document.getElementById('n-'+x).classList.add('text-zinc-500');});document.getElementById('page-'+p).classList.remove('hidden');document.getElementById('n-'+p).classList.add('text-[#6a9eff]');document.getElementById('n-'+p).classList.remove('text-zinc-500');}
function listenAll(){db.ref('schede/'+cur).on('value',s=>{let ex=s.val()||[];let html="";for(let i=0;i<ex.length;i++){let e=ex[i];html+=`<div class="glass rounded-2xl p-4 mb-2 flex justify-between"><div><p class="font-bold">${e.name}</p><p class="text-[11px] text-[#7aa2ff]">${e.serie} x ${e.rep} - ${e.rec}</p></div><button onclick="delEx(${i})" class="text-red-400">✕</button></div>`;}document.getElementById('exList').innerHTML=html||'<div class="glass rounded-2xl p-6 text-center text-zinc-500 text-sm">Nessun esercizio</div>';});db.ref('peso/'+cur).on('value',s=>{let w=s.val()||[];let h="";for(let i=0;i<w.length;i++)h+=`<div class="glass rounded-xl p-3 mb-2 flex justify-between"><span>${w[i].data} - <b>${w[i].kg}kg</b></span><button onclick="delW(${i})" class="text-red-400 text-xs">✕</button></div>`;document.getElementById('wList').innerHTML=h;});db.ref('appuntamenti/'+cur).on('value',s=>{let a=s.val()||[];let h="";for(let i=0;i<a.length;i++)h+=`<div class="glass rounded-xl p-3 mb-2 flex justify-between"><span><b>${a[i].cliente}</b> - ${a[i].ora}</span><button onclick="delAp(${i})" class="text-red-400">✕</button></div>`;document.getElementById('apList').innerHTML=h||'<div class="glass rounded-2xl p-6 text-center text-zinc-500 text-sm">Nessun appuntamento</div>';});db.ref('pagamenti').on('value',s=>{let p=s.val()||[];let h="";for(let i=0;i<p.length;i++)h+=`<div class="glass rounded-xl p-3 mb-2 flex justify-between"><span>${p[i].cliente} - <b>${p[i].importo}</b></span><button onclick="delPay(${i})" class="text-red-400 text-xs">✕</button></div>`;document.getElementById('payList').innerHTML=h;});}
document.getElementById('btnAddEx').onclick=()=>{let n=prompt("Esercizio:");if(!n)return;let se=prompt("Serie:","4"),re=prompt("Rip:","10"),rc=prompt("Rec:","60s");db.ref('schede/'+cur).once('value',s=>{let a=s.val()||[];a.push({name:n,serie:se,rep:re,rec:rc});db.ref('schede/'+cur).set(a);});};
document.getElementById('btnAddW').onclick=()=>{let kg=prompt("Peso:","80");if(kg){db.ref('peso/'+cur).once('value',s=>{let a=s.val()||[];a.push({data:new Date().toLocaleDateString(),kg});db.ref('peso/'+cur).set(a);});}};
document.getElementById('btnAddAp').onclick=()=>{let o=prompt("Orario:","09:00"),t=prompt("Tipo:","Personal");if(o){db.ref('appuntamenti/'+cur).once('value',s=>{let a=s.val()||[];a.push({cliente:curName,ora:o,tipo:t});db.ref('appuntamenti/'+cur).set(a);});}};
document.getElementById('btnAddPay').onclick=()=>{let imp=prompt("Importo:","150€");if(imp){db.ref('pagamenti').once('value',s=>{let a=s.val()||[];a.unshift({cliente:curName,importo:imp,data:new Date().toLocaleDateString()});db.ref('pagamenti').set(a);});}};
function delEx(i){db.ref('schede/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('schede/'+cur).set(a);});}
function delW(i){db.ref('peso/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('peso/'+cur).set(a);});}
function delAp(i){db.ref('appuntamenti/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('appuntamenti/'+cur).set(a);});}
function delPay(i){db.ref('pagamenti').once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('pagamenti').set(a);});}
</script></body></html>
