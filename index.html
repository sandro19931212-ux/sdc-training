<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060d">
<title>SDC Training</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
:root{--bg:#03060d;--panel:#0b1220;--panel2:#101a2c;--line:#1e3358;--blue:#58b7ff;--blue2:#2c5cff;--muted:#8291ad;--danger:#ff607d;--ok:#4ee1a0;--shadow:0 0 28px rgba(64,136,255,.18)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(700px 420px at 50% -80px,rgba(44,101,255,.2),transparent 60%),var(--bg);color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100vh}
.wrap{width:min(100%,720px);margin:auto;padding:24px 18px 120px}
.brand{font-family:Arial,sans-serif;font-weight:900;background:linear-gradient(180deg,#b7e0ff,#3271ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(70,145,255,.65));letter-spacing:-2px}
.eyebrow{font-size:11px;letter-spacing:2.4px;color:#78b6ff;font-weight:900;text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:linear-gradient(145deg,rgba(18,29,50,.95),rgba(8,14,25,.96));border:1px solid rgba(106,169,255,.2);border-radius:24px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:16px;background:linear-gradient(135deg,#65bbff,#2a58ff);color:#fff;font-weight:900;padding:14px 18px;box-shadow:0 0 22px rgba(54,115,255,.34)}
.btn.secondary{background:#14213a;box-shadow:none;color:#99caff;border:1px solid #28436f}
.btn.danger{background:#301522;color:#ff91a7;box-shadow:none;border:1px solid #61223a}
.iconbtn{width:40px;height:40px;border-radius:13px;border:1px solid #263b61;background:#101a2d;color:#a9cfff}
.field{width:100%;border:1px solid #223960;background:#08101d;color:#fff;border-radius:16px;padding:14px 15px;outline:none}
.field:focus{border-color:#4d9dff;box-shadow:0 0 0 3px rgba(65,143,255,.14)}
label{display:block;margin:0 0 7px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#82baff;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.login{display:grid;place-items:center;padding:28px 18px;background:radial-gradient(600px at 50% 25%,rgba(50,119,255,.22),transparent 58%)}
.loginbox{width:min(100%,430px);text-align:center}
.logo{width:152px;height:152px;border:2px solid #5ea3ff;transform:rotate(45deg);margin:0 auto 48px;border-radius:8px;box-shadow:0 0 32px rgba(59,132,255,.58);display:grid;place-items:center}
.logo span{transform:rotate(-45deg);font-size:46px;letter-spacing:7px}
.login-card{text-align:left;padding:24px}
.formgap>*+*{margin-top:15px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.role-pill{padding:8px 11px;border-radius:999px;background:#10213c;border:1px solid #254a7c;color:#79bdff;font-size:10px;font-weight:900;letter-spacing:1px}
.hero{padding:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-80px;top:-100px;background:#1b76ff;filter:blur(55px);opacity:.32}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:27px;margin:7px 0}
.quick{margin-top:14px}
.stat{padding:16px;text-align:center}
.stat b{display:block;font-size:23px;margin-top:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.section-head h2{font-size:19px;margin:0}
.list{display:grid;gap:10px}
.item{padding:16px}
.item h3{font-size:15px;margin:0 0 5px}
.item p{margin:3px 0;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:10px;font-weight:800;border-radius:999px;padding:6px 9px;color:#9dcbff;background:#101d33;border:1px solid #27456f}
.days{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}
.day{white-space:nowrap;border:1px solid #243c63;background:#0b1425;color:#8fa2c2;border-radius:14px;padding:10px 13px;font-weight:800}
.day.active{color:#fff;background:linear-gradient(135deg,#4e9eff,#2859ff);box-shadow:0 0 18px rgba(61,129,255,.4)}
.exercise{display:grid;grid-template-columns:1fr auto;gap:10px}
.load{width:90px;text-align:center}
.nav{position:fixed;z-index:50;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));margin:auto;width:min(calc(100% - 24px),700px);padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(7,13,24,.93);border:1px solid rgba(111,172,255,.25);border-radius:24px;backdrop-filter:blur(18px);box-shadow:0 0 30px rgba(0,0,0,.5)}
.nav button{border:0;background:transparent;color:#697c9d;border-radius:16px;padding:8px 3px;font-size:9px;font-weight:800}
.nav button span{font-size:19px;display:block;margin-bottom:3px}
.nav button.active{background:#152541;color:#6cbaff;box-shadow:0 0 18px rgba(70,147,255,.18)}
.modal{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:end center;padding:18px}
.sheet{width:min(100%,680px);max-height:90vh;overflow:auto;padding:22px;border-radius:26px;background:#0b1322;border:1px solid #29446f}
.sheet h2{margin:0 0 18px}
.actions{display:flex;gap:9px;margin-top:18px}
.actions>*{flex:1}
.notice{padding:12px 14px;border-radius:14px;background:#17243a;color:#a8c9f5;font-size:12px;margin-bottom:14px}
.empty{text-align:center;color:#617391;padding:28px 10px}
.client-switch{min-width:150px;max-width:220px;padding:10px 12px}
.amount.ok{color:var(--ok)}
.amount.no{color:#ff8da2}
.profile-weight{font-size:38px;font-weight:900}
.admin-only,.client-only{display:none}
.admin .admin-only{display:initial}
.client .client-only{display:initial}
.admin .admin-flex{display:flex}
.client .client-flex{display:flex}
.admin .admin-grid{display:grid}
.client .client-grid{display:grid}
.admin .hide-admin,.client .hide-client{display:none!important}
.toast{position:fixed;z-index:200;top:18px;left:50%;transform:translateX(-50%);background:#15243c;border:1px solid #315685;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);font-size:13px;max-width:90%;text-align:center}
.small{font-size:11px}
.mt{margin-top:14px}
.error{color:#ff91a7;background:#2a1420;border:1px solid #61223a;padding:10px 12px;border-radius:13px;font-size:12px}
@media(max-width:480px){
.wrap{padding-left:14px;padding-right:14px}.grid3{grid-template-columns:1fr 1fr}.grid3 .stat:last-child{grid-column:span 2}
.hero h2{font-size:22px}.nav button{font-size:8px}.logo{width:125px;height:125px}.logo span{font-size:38px}.grid2{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div id="toast" class="toast hidden"></div>

<section id="login" class="screen login">
  <div class="loginbox">
    <div class="logo"><span class="brand">SDC</span></div>
    <h1 class="brand" style="font-size:42px;margin:0">SDC TRAINING</h1>
    <p class="muted" style="letter-spacing:3px;font-size:10px;margin:10px 0 24px">PERSONAL TRAINING - PRO ELITE</p>

    <div class="card login-card formgap">
      <div>
        <label>Accesso</label>
        <select id="loginRole" class="field">
          <option value="client">Cliente</option>
          <option value="admin">Personal trainer</option>
        </select>
      </div>

      <div id="adminUsernameWrap" class="hidden">
        <label>Username trainer</label>
        <input id="adminUsername" class="field" type="text" autocomplete="username" placeholder="Username trainer">
      </div>

      <div id="clientEmailWrap" class="hidden">
        <label>Email cliente</label>
        <input id="loginClientEmail" class="field" type="email" autocomplete="username" placeholder="Email cliente">
      </div>

      <div>
        <label>Password</label>
        <input id="loginPassword" class="field" type="password" autocomplete="current-password" placeholder="Inserisci la password">
      </div>

      <button class="btn" style="width:100%" id="loginBtn">ENTRA →</button>
      <div id="loginError" class="error hidden"></div>

      <p class="small muted" style="text-align:center;margin-bottom:0">
        Accesso protetto tramite Firebase Authentication.
      </p>
    </div>
  </div>
</section>

<section id="app" class="hidden">
  <main class="wrap">
    <header class="topbar">
      <div>
        <div class="brand" style="font-size:24px">SDC TRAINING</div>
        <div class="small muted" id="welcome"></div>
      </div>
      <div class="row">
        <select id="adminClientSwitch" class="field client-switch admin-only"></select>
        <span id="roleBadge" class="role-pill"></span>
        <button id="logoutBtn" class="iconbtn" title="Esci">↪</button>
      </div>
    </header>

    <section id="page-dashboard" class="page"></section>
    <section id="page-scheda" class="page hidden"></section>
    <section id="page-pagamenti" class="page hidden"></section>
    <section id="page-appuntamenti" class="page hidden"></section>
    <section id="page-profilo" class="page hidden"></section>
  </main>

  <nav class="nav" id="nav">
    <button data-page="dashboard"><span>⌂</span>Dashboard</button>
    <button data-page="scheda"><span>◒</span>Scheda</button>
    <button data-page="pagamenti"><span>€</span>Pagamenti</button>
    <button data-page="appuntamenti"><span>▣</span>Appuntamenti</button>
    <button data-page="profilo"><span>◉</span>Profilo</button>
  </nav>
</section>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <div class="row between">
      <h2 id="modalTitle"></h2>
      <button class="iconbtn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",
  authDomain:"sdc-fitness.firebaseapp.com",
  databaseURL:"https://sdc-fitness-default-rtdb.firebaseio.com",
  projectId:"sdc-fitness",
  storageBucket:"sdc-fitness.firebasestorage.app",
  messagingSenderId:"817117949572",
  appId:"1:817117949572:web:b74a51081ecaf640d91cd1"
};

const DAYS=['Giorno 1','Giorno 2','Giorno 3','Giorno 4','Giorno 5'];
const KEY='sdc_training_v11';

let db=null,auth=null;
let remoteReady=false;
let unsubscribe=null;
let state={clients:{},workouts:{},payments:{},appointments:{},weightHistory:{}};
let session={role:null,clientId:null,page:'dashboard',uid:null,email:null};
let selectedDay=DAYS[0];

function clone(v){return JSON.parse(JSON.stringify(v));}

function defaultState(){
  return {clients:{},workouts:{},payments:{},appointments:{},weightHistory:{}};
}

function loadLocal(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return normalise(x||defaultState());
  }catch(e){return defaultState();}
}

function saveLocal(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function normalise(x){
  x=x||{};
  ['clients','workouts','payments','appointments','weightHistory'].forEach(k=>x[k]=x[k]||{});
  return x;
}

function toast(t){
  const el=document.getElementById('toast');
  el.textContent=t;
  el.classList.remove('hidden');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>el.classList.add('hidden'),2600);
}

function loginError(t){
  const el=document.getElementById('loginError');
  el.textContent=t;
  el.classList.remove('hidden');
}

function clearLoginError(){
  document.getElementById('loginError').classList.add('hidden');
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function money(v){
  return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v)||0);
}

function isoToday(){return new Date().toISOString().slice(0,10);}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function val(x){return document.getElementById(x).value.trim();}

function clients(){
  return Object.entries(state.clients).sort((a,b)=>a[1].name.localeCompare(b[1].name));
}

function current(){
  return state.clients[session.clientId];
}

function curWorkout(){
  state.workouts[session.clientId]=state.workouts[session.clientId]||{};
  return state.workouts[session.clientId];
}

/* Firebase */
function initFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth=firebase.auth();
    db=firebase.database();

    auth.onAuthStateChanged(async user=>{
      if(user){
        session.uid=user.uid;
        session.email=user.email||'';

        if(user.email===TRAINER_EMAIL){
          session.role='admin';
          session.clientId=firstClientId();
        }else{
          session.role='client';
          session.clientId=await findClientByUid(user.uid);
        }

        await loadRemoteState();
        if(session.role==='client' && !session.clientId){
          showLogin();
          loginError('Account cliente non ancora associato. Contatta il trainer.');
          await auth.signOut();
          return;
        }
        showApp();
      }else{
        session={role:null,clientId:null,page:'dashboard',uid:null,email:null};
        showLogin();
      }
    });
  }catch(e){
    console.error(e);
    toast('Errore inizializzazione Firebase');
  }
}

async function loadRemoteState(){
  if(!db)return;
  try{
    const snap=await db.ref('appV11').once('value');
    if(snap.exists()) state=normalise(snap.val());
    else await db.ref('appV11').set(state);
    saveLocal();
    remoteReady=true;
  }catch(e){
    console.error(e);
    remoteReady=false;
    state=loadLocal();
    toast('Firebase non disponibile: modalità locale');
  }
}

async function persist(){
  saveLocal();
  if(db && remoteReady){
    try{await db.ref('appV11').set(state);}
    catch(e){console.error(e);toast('Salvataggio Firebase non riuscito');}
  }
  renderAll();
}

/* Authentication
   Cambia SOLO questa email prima del primo utilizzo se vuoi un'altra email trainer.
   La password viene impostata in Firebase Authentication, non nel codice. */
const TRAINER_USERNAME='SDCTrainer';
const TRAINER_EMAIL='sdc.trainer@gmail.com';

async function login(){
  clearLoginError();
  const role=document.getElementById('loginRole').value;
  const password=document.getElementById('loginPassword').value.trim();

  if(!password){
    loginError('Inserisci la password.');
    return;
  }

  let email='';
  if(role==='admin'){
    const username=document.getElementById('adminUsername').value.trim();
    if(!username){loginError('Inserisci lo username del trainer.');return;}
    if(username!==TRAINER_USERNAME){loginError('Username trainer non corretto.');return;}
    email=TRAINER_EMAIL;
  }else{
    email=document.getElementById('loginClientEmail').value.trim().toLowerCase();
    if(!email){loginError('Inserisci l’email del cliente.');return;}
  }

  if(!auth){
    loginError('Firebase non è ancora pronto. Ricarica la pagina.');
    return;
  }

  const btn=document.getElementById('loginBtn');
  btn.disabled=true;
  btn.textContent='ACCESSO...';

  try{
    await auth.signInWithEmailAndPassword(email,password);
  }catch(e){
    console.error(e);
    const code=e.code||'';
    const messages={
      'auth/invalid-credential':'Email o password non corrette.',
      'auth/user-not-found':'Account non trovato.',
      'auth/wrong-password':'Password non corretta.',
      'auth/invalid-email':'Email non valida.',
      'auth/too-many-requests':'Troppi tentativi. Riprova più tardi.',
      'auth/network-request-failed':'Problema di connessione.'
    };
    loginError(messages[code]||('Accesso non riuscito: '+code));
  }finally{
    btn.disabled=false;
    btn.textContent='ENTRA →';
  }
}

async function logout(){
  try{if(auth)await auth.signOut();}catch(e){console.error(e);}
}

function showLogin(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.body.className='';
  document.getElementById('loginPassword').value='';
}

function showApp(){
  if(!session.role)return;
  if(session.role==='admin' && !session.clientId)session.clientId=firstClientId();

  if(session.role==='client' && !state.clients[session.clientId]){
    showLogin();
    loginError('Profilo cliente non trovato.');
    return;
  }

  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.body.className=session.role;
  renderAll();
}

function firstClientId(){return clients()[0]?.[0]||null;}

async function findClientByUid(uid){
  const found=clients().find(([k,c])=>c.uid===uid);
  return found?found[0]:null;
}

/* UI */
function fillClientSelects(){
  const opts=clients().map(([k,c])=>'<option value="'+esc(k)+'">'+esc(c.name)+'</option>').join('');
  document.getElementById('adminClientSwitch').innerHTML=opts;
  if(session.clientId)document.getElementById('adminClientSwitch').value=session.clientId;
}

function renderAll(){
  fillClientSelects();
  if(!session.role)return;

  if(!session.clientId)session.clientId=firstClientId();
  if(!session.clientId)return;

  document.body.className=session.role;
  const c=current();
  document.getElementById('welcome').innerHTML='Ciao, <b style="color:#fff">'+esc(c?.name||session.email)+'</b>';
  document.getElementById('roleBadge').textContent=session.role==='admin'?'TRAINER':'CLIENTE';
  document.getElementById('adminClientSwitch').value=session.clientId;
  showPage(session.page,false);
}

function showPage(p,scroll=true){
  session.page=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  const el=document.getElementById('page-'+p);
  if(el)el.classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
  renderPage(p);
  if(scroll)window.scrollTo(0,0);
}

function nextAppointment(){
  return (state.appointments[session.clientId]||[])
    .filter(a=>a.date>=isoToday())
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
}

function todayWorkout(){
  const day=DAYS[(new Date().getDay()+6)%7];
  const w=curWorkout();
  return {day,work:w[day]||Object.values(w)[0]};
}

function renderDashboard(){
  const c=current(),tw=todayWorkout(),ap=nextAppointment();
  const paid=(state.payments[session.clientId]||[]).filter(p=>p.status==='Pagato').length;

  document.getElementById('page-dashboard').innerHTML=
  '<div class="card hero">'+
    '<div class="eyebrow">Allenamento di oggi</div>'+
    '<h2>'+esc(tw.work?.title||'Giorno di recupero')+'</h2>'+
    '<p class="muted">'+esc(tw.day)+' · '+(tw.work?.exercises?.length||0)+' esercizi</p>'+
    '<button class="btn mt" onclick="showPage(\'scheda\')">APRI SCHEDA →</button>'+
  '</div>'+
  '<div class="grid3 quick">'+
    '<div class="card stat"><span class="eyebrow">Peso</span><b>'+esc(c.weight||'-')+' kg</b></div>'+
    '<div class="card stat"><span class="eyebrow">Obiettivo</span><b>'+esc(c.target||'-')+' kg</b></div>'+
    '<div class="card stat"><span class="eyebrow">Pagamenti</span><b>'+paid+'</b></div>'+
  '</div>'+
  '<div class="section-head"><h2>Accessi rapidi</h2></div>'+
  '<div class="grid2">'+
    '<button class="card item" onclick="showPage(\'appuntamenti\')" style="color:white;text-align:left"><div class="eyebrow">Prossimo appuntamento</div><h3 style="margin-top:9px">'+(ap?esc(ap.date)+' · '+esc(ap.time):'Nessun appuntamento')+'</h3></button>'+
    '<button class="card item" onclick="showPage(\'profilo\')" style="color:white;text-align:left"><div class="eyebrow">Aggiorna</div><h3 style="margin-top:9px">Peso e profilo</h3></button>'+
  '</div>'+
  '<div class="section-head"><h2>Nota del trainer</h2></div>'+
  '<div class="card item"><p style="font-size:14px;color:#b8c5db">'+esc(c.notes||'Nessuna nota inserita.')+'</p></div>';
}

function renderScheda(){
  const w=curWorkout();
  const plan=w[selectedDay];

  document.getElementById('page-scheda').innerHTML=
  '<div class="section-head" style="margin-top:0">'+
    '<div><div class="eyebrow">Programma</div><h2>Scheda settimanale</h2></div>'+
    '<button class="btn admin-only" onclick="openWorkoutModal()">+ GIORNO</button>'+
  '</div>'+
  '<div class="days">'+(session.role==='admin'?DAYS:DAYS.filter(d=>w[d]&&w[d].exercises&&w[d].exercises.length)).map(d=>'<button class="day '+(d===selectedDay?'active':'')+'" onclick="selectedDay=\''+d+'\';renderScheda()">'+d.replace('Giorno ','G')+'</button>').join('')+'</div>'+
  '<div class="card item">'+
    '<div class="row between"><div><div class="eyebrow">'+esc(selectedDay)+'</div><h2 style="margin:6px 0">'+esc(plan?.title||'Riposo')+'</h2></div>'+
    (plan?'<div class="row admin-flex"><button class="iconbtn" onclick="openWorkoutModal(\''+esc(selectedDay)+'\')">✎</button><button class="iconbtn" onclick="deleteWorkout(\''+esc(selectedDay)+'\')">✕</button></div>':'')+
    '</div>'+
  '</div>'+
  '<div class="section-head"><h2>Esercizi</h2>'+(plan?'<button class="btn admin-only" onclick="openExerciseModal(\''+esc(selectedDay)+'\')">+ ESERCIZIO</button>':'')+'</div>'+
  '<div class="list">'+
  (!plan||!plan.exercises?.length?'<div class="empty">Nessun esercizio per questo giorno.</div>':

      '<div><label>Carico kg</label><input class="field load" type="number" step="0.5" value="'+esc(e.load||0)+'" onchange="updateLoad(\''+esc(selectedDay)+'\',\''+esc(e.id)+'\',this.value)">'+

function renderAppointments(){

  '<div class="list">'+
  (arr.length?arr.map(a=>
    '<article class="card item row between"><div><h3>'+esc(a.title)+'</h3><p>'+esc(a.date)+' · '+esc(a.time)+'</p></div>'+
    '<div class="admin-flex row"><button class="iconbtn" onclick="openAppointmentModal(\''+esc(a.id)+'\')">✎</button><button class="iconbtn" onclick="deleteRecord(\'appointments\',\''+esc(a.id)+'\')">✕</button></div></article>'

function renderProfile(){
  const c=current();

  document.getElementById('page-profilo').innerHTML=

  '<div class="profile-weight">'+esc(c.weight||'-')+' <span style="font-size:16px;color:#8aa0c2">kg</span></div>'+
  '<div class="grid2 mt">'+
    '<div><label>Peso attuale</label><input id="profileWeight" class="field" type="number" step="0.1" value="'+esc(c.weight||'')+'"></div>'+
    '<div><label>Peso obiettivo</label><input id="profileTarget" class="field" type="number" step="0.1" value="'+esc(c.target||'')+'" '+(session.role==='client'?'disabled':'')+'></div>'+
  '</div>'+
  '<button class="btn mt" onclick="saveWeight()">SALVA PESO</button></div>'+
  '<div class="section-head"><h2>Storico peso</h2></div>'+
  '<div class="list">'+(hist.length?hist.map(h=>'<div class="card item row between"><span>'+esc(h.date)+'</span><b>'+esc(h.value)+' kg</b></div>').join(''):'<div class="empty">Nessuna rilevazione.</div>')+'</div>'+

function renderPage(p){

  if(f)f();
}

/* Modals */
function openModal(title,html){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

/* Clients */
function openClientModal(cid){
  const c=cid?state.clients[cid]:{};
  openModal(cid?'Modifica cliente':'Nuovo cliente',
  '<div class="formgap">'+
    '<div><label>Nome e cognome</label><input id="mName" class="field" value="'+esc(c.name||'')+'"></div>'+
    '<div><label>Email cliente</label><input id="mEmail" class="field" type="email" value="'+esc(c.email||'')+'" placeholder="cliente@email.it" '+(cid?'disabled':'')+'></div>'+
    '<div><label>Password cliente</label><input id="mPassword" class="field" type="password" value="" placeholder="'+(cid?'Lascia vuoto per non cambiarla':'Password iniziale')+'"></div>'+
    '<div class="grid2"><div><label>Peso kg</label><input id="mWeight" type="number" step="0.1" class="field" value="'+esc(c.weight||'')+'"></div><div><label>Obiettivo kg</label><input id="mTarget" type="number" step="0.1" class="field" value="'+esc(c.target||'')+'"></div></div>'+
    '<div><label>Note trainer</label><textarea id="mNotes" class="field" rows="3">'+esc(c.notes||'')+'</textarea></div>'+
    '<button class="btn" style="width:100%" onclick="saveClient(\''+(cid||'')+'\')">SALVA CLIENTE</button>'+
  '</div>');
}

async function saveClient(cid){
  if(session.role!=='admin')return;
  const name=val('mName');
  const email=val('mEmail').toLowerCase();
  const password=document.getElementById('mPassword').value.trim();

  if(!name||!email||(!cid&&!password))return toast('Nome, email e password sono obbligatori');

  if(!cid){
    try{
      const secondary=firebase.initializeApp(firebaseConfig,'clientCreator');
      const result=await secondary.auth().createUserWithEmailAndPassword(email,password);
      const uid=result.user.uid;
      await secondary.auth().signOut();
      await secondary.delete();

      const key=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'-'+id().slice(-4);

      state.clients[key]={uid,email,name,weight:Number(val('mWeight'))||0,target:Number(val('mTarget'))||0,notes:val('mNotes')};
      state.workouts[key]={};
      state.payments[key]=[];
      state.appointments[key]=[];
      state.weightHistory[key]=[];

      session.clientId=key;
      closeModal();
      await persist();
      toast('Cliente creato');
    }catch(e){
      console.error(e);
      toast(firebaseAuthMessage(e));
    }
  }else{
    const c=state.clients[cid];
    c.name=name;
    c.weight=Number(val('mWeight'))||0;
    c.target=Number(val('mTarget'))||0;
    c.notes=val('mNotes');
    if(password)toast('Password cliente: per sicurezza modificala dalla console Firebase Authentication');
    closeModal();
    await persist();
    toast('Cliente aggiornato');
  }
}

function firebaseAuthMessage(e){
  const m={
    'auth/email-already-in-use':'Questa email è già registrata.',
    'auth/invalid-email':'Email non valida.',
    'auth/weak-password':'Password troppo debole.',
    'auth/operation-not-allowed':'Abilita Email/Password in Firebase Authentication.'
  };
  return m[e.code]||'Impossibile creare il cliente: '+(e.code||'errore');
}

async function deleteClient(){
  if(session.role!=='admin')return;
  if(!confirm('Rimuovere definitivamente questo cliente e i suoi dati?'))return;
  const k=session.clientId;
  delete state.clients[k];
  delete state.workouts[k];
  delete state.payments[k];
  delete state.appointments[k];
  delete state.weightHistory[k];
  session.clientId=firstClientId();
  await persist();
  if(!session.clientId){toast('Nessun cliente presente');showApp();}
}

/* Workouts */
function openWorkoutModal(day){
  const p=curWorkout()[day]||{};
  openModal(day?'Modifica giornata':'Aggiungi giornata',
  '<div class="formgap">'+
  '<div><label>Giorno</label><select id="mDay" class="field">'+DAYS.map(d=>'<option '+(d===day?'selected':'')+'>'+d+'</option>').join('')+'</select></div>'+
  '<div><label>Titolo allenamento</label><input id="mWorkoutTitle" class="field" value="'+esc(p.title||'')+'" placeholder="Es. Petto e tricipiti"></div>'+
  '<button class="btn" style="width:100%" onclick="saveWorkout(\''+(day||'')+'\')">SALVA GIORNATA</button></div>');
}

async function saveWorkout(oldDay){
  const day=val('mDay'),title=val('mWorkoutTitle');
  if(!title)return toast('Inserisci il titolo');
  const w=curWorkout(),old=w[oldDay]||{exercises:[]};
  if(oldDay&&oldDay!==day)delete w[oldDay];
  w[day]={title,exercises:old.exercises||[]};
  selectedDay=day;
  closeModal();
  await persist();
}

async function deleteWorkout(day){
  if(confirm('Eliminare questa giornata e tutti gli esercizi?')){
    delete curWorkout()[day];
    await persist();
  }
}

/* Exercises */
function openExerciseModal(day,eid){
  const list=curWorkout()[day]?.exercises||[];
  const e=list.find(x=>x.id===eid)||{};
  openModal(eid?'Modifica esercizio':'Nuovo esercizio',
  '<div class="formgap">'+
  '<div><label>Esercizio</label><input id="mExName" class="field" value="'+esc(e.name||'')+'"></div>'+
  '<div class="grid2"><div><label>Serie</label><input id="mSets" type="number" class="field" value="'+esc(e.sets||4)+'"></div><div><label>Ripetizioni</label><input id="mReps" class="field" value="'+esc(e.reps||'10')+'"></div></div>'+
  '<div class="grid2"><div><label>Recupero sec</label><input id="mRest" type="number" class="field" value="'+esc(e.rest||60)+'"></div><div><label>Carico kg</label><input id="mLoad" type="number" step="0.5" class="field" value="'+esc(e.load||0)+'"></div></div>'+
  '<button class="btn" style="width:100%" onclick="saveExercise(\''+day+'\',\''+(eid||'')+'\')">SALVA ESERCIZIO</button></div>');
}

async function saveExercise(day,eid){
  const list=curWorkout()[day].exercises||(curWorkout()[day].exercises=[]);
  const obj={id:eid||id(),name:val('mExName'),sets:Number(val('mSets'))||1,reps:val('mReps'),rest:Number(val('mRest'))||0,load:Number(val('mLoad'))||0};
  if(!obj.name)return toast('Inserisci il nome');
  const i=list.findIndex(x=>x.id===eid);
  if(i>=0)list[i]=obj;else list.push(obj);
  closeModal();
  await persist();
}

async function deleteExercise(day,eid){
  if(confirm('Eliminare questo esercizio?')){
    curWorkout()[day].exercises=curWorkout()[day].exercises.filter(x=>x.id!==eid);
    await persist();
  }
}

async function updateLoad(day,eid,v){
  const e=curWorkout()[day].exercises.find(x=>x.id===eid);
  if(e){e.load=Number(v)||0;await persist();toast('Carico aggiornato');}
}

/* Payments */
function openPaymentModal(pid){
  const arr=state.payments[session.clientId]||[],p=arr.find(x=>x.id===pid)||{};
  openModal(pid?'Modifica pagamento':'Nuovo pagamento',
  '<div class="formgap"><div class="grid2"><div><label>Data</label><input id="mPayDate" type="date" class="field" value="'+esc(p.date||isoToday())+'"></div><div><label>Importo €</label><input id="mAmount" type="number" step="0.01" class="field" value="'+esc(p.amount||'')+'"></div></div>'+
  '<div><label>Stato</label><select id="mStatus" class="field"><option '+(p.status==='Pagato'?'selected':'')+'>Pagato</option><option '+(p.status==='Da pagare'?'selected':'')+'>Da pagare</option></select></div>'+
  '<div><label>Descrizione</label><input id="mPayNote" class="field" value="'+esc(p.note||'')+'"></div>'+
  '<button class="btn" style="width:100%" onclick="savePayment(\''+(pid||'')+'\')">SALVA PAGAMENTO</button></div>');
}

async function savePayment(pid){
  const arr=state.payments[session.clientId]||(state.payments[session.clientId]=[]);
  const p={id:pid||id(),date:val('mPayDate'),amount:Number(val('mAmount'))||0,status:val('mStatus'),note:val('mPayNote')};
  const i=arr.findIndex(x=>x.id===pid);
  if(i>=0)arr[i]=p;else arr.push(p);
  closeModal();
  await persist();
}

/* Appointments */
function openAppointmentModal(aid){
  const arr=state.appointments[session.clientId]||[],a=arr.find(x=>x.id===aid)||{};
  openModal(aid?'Modifica appuntamento':'Nuovo appuntamento',
  '<div class="formgap"><div><label>Titolo</label><input id="mApTitle" class="field" value="'+esc(a.title||'Allenamento PT')+'"></div>'+
  '<div class="grid2"><div><label>Data</label><input id="mApDate" type="date" class="field" value="'+esc(a.date||isoToday())+'"></div><div><label>Ora</label><input id="mApTime" type="time" class="field" value="'+esc(a.time||'09:00')+'"></div></div>'+
  '<button class="btn" style="width:100%" onclick="saveAppointment(\''+(aid||'')+'\')">SALVA APPUNTAMENTO</button></div>');
}

async function saveAppointment(aid){
  const arr=state.appointments[session.clientId]||(state.appointments[session.clientId]=[]);
  const a={id:aid||id(),title:val('mApTitle'),date:val('mApDate'),time:val('mApTime')};
  const i=arr.findIndex(x=>x.id===aid);
  if(i>=0)arr[i]=a;else arr.push(a);
  closeModal();
  await persist();
}

async function deleteRecord(type,rid){
  if(!confirm('Eliminare questo elemento?'))return;
  state[type][session.clientId]=(state[type][session.clientId]||[]).filter(x=>x.id!==rid);
  await persist();
}

/* Weight */
async function saveWeight(){
  const c=current(),v=Number(document.getElementById('profileWeight').value),target=Number(document.getElementById('profileTarget').value);
  if(!v)return toast('Inserisci un peso valido');
  c.weight=v;
  if(session.role==='admin'&&target)c.target=target;
  const h=state.weightHistory[session.clientId]||(state.weightHistory[session.clientId]=[]);
  const today=isoToday(),old=h.find(x=>x.date===today);
  if(old)old.value=v;else h.push({date:today,value:v});
  await persist();
  toast('Peso aggiornato');
}

/* Events */
document.getElementById('loginRole').onchange=e=>{
  const admin=e.target.value==='admin';
  document.getElementById('adminUsernameWrap').classList.toggle('hidden',!admin);
  document.getElementById('clientEmailWrap').classList.toggle('hidden',admin);
  clearLoginError();
};

document.getElementById('loginBtn').onclick=login;
document.getElementById('loginPassword').onkeydown=e=>{if(e.key==='Enter')login();};
document.getElementById('adminUsername').onkeydown=e=>{if(e.key==='Enter')login();};
document.getElementById('loginClientEmail').onkeydown=e=>{if(e.key==='Enter')login();};
document.getElementById('logoutBtn').onclick=logout;

document.getElementById('adminClientSwitch').onchange=e=>{
  session.clientId=e.target.value;
  renderAll();
};

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* Avvio */
state=loadLocal();
fillClientSelects();
initFirebase();
</script>
