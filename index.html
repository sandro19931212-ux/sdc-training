body{background:#020408;color:#fff;font-family:Inter,sans-serif}
.sdc{background:linear-gradient(180deg,#8ec6ff,#2a5bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-family:Space Grotesk;filter:drop-shadow(0 0 25px rgba(70,140,255,.8))}
.glass{background:linear-gradient(135deg,rgba(28,38,68,.9),rgba(18,28,52,.9));border:1px solid rgba(120,180,255,.22);backdrop-filter:blur(22px);border-radius:24px}
.btn{background:linear-gradient(135deg,#6ab4ff,#2a5bff);box-shadow:0 0 20px rgba(60,120,255,.5);border-radius:999px}

<body class="pb-28">
<script>
function entra(){
  var sel=document.getElementById('sel').value;
  var clients=["Marcus Vance","Amara Osei","Dante Moretti","Sofia Ricci","Luca Bianchi"];
  window.cur=sel; window.curName=clients[sel];
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('nav').style.display='flex';
  document.getElementById('nav').classList.remove('hidden');
  document.getElementById('hName').innerText=window.curName;
  showPage('dashboard');
  try{listenAll()}catch(e){}
}
function showPage(p){
  ['dashboard','scheda','pagamenti','appuntamenti'].forEach(function(x){
    var el=document.getElementById('page-'+x);
    if(el) el.classList.add('hidden');
  });
  document.getElementById('page-'+p).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');el.classList.add('text-[#5a6f8f]')});
  var btn=document.getElementById('btn-'+p);
  btn.classList.add('active');
  btn.classList.remove('text-[#5a6f8f]');
}
</script>
