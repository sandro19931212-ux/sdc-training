<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDC ELITE</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"><style>*{font-family:Inter,sans-serif}body{background:#020408;color:#fff}body::before{content:"";position:fixed;top:-50%;left:-30%;width:160%;height:160%;background:radial-gradient(ellipse at 20% 20%, rgba(42,123,255,0.18) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(0,200,255,0.12) 0%, transparent 50%);pointer-events:none;z-index:0}.sdc-text{background:linear-gradient(180deg,#8ec6ff 0%,#3a8bff 40%,#1a5bff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(58,139,255,0.6));font-family:Space Grotesk;font-weight:700}.glass-elite{background:linear-gradient(135deg,rgba(22,28,48,0.9),rgba(14,19,35,0.9));border:1px solid rgba(90,160,255,0.18);backdrop-filter:blur(24px);box-shadow:0 0 0 1px rgba(90,160,255,0.08) inset, 0 8px 32px rgba(0,0,0,0.6), 0 0 40px rgba(42,123,255,0.08);position:relative;overflow:hidden}.btn-elite{background:linear-gradient(135deg,#4a9eff 0%,#2a5bff 100%);box-shadow:0 0 20px rgba(42,91,255,0.5);border:1px solid rgba(120,180,255,0.5);font-weight:800}.badge-pro{background:rgba(15,25,45,0.8);border:1px solid rgba(90,160,255,0.3);backdrop-filter:blur(10px)}</style></head><body class="pb-32"><div id="login" class="min-h-screen flex items-center justify-center p-6 relative z-10"><div class="w-full max-w-[420px]"><div class="text-center mb-8"><h1 class="sdc-text text-[56px] leading-[0.9]">SDC<br>TRAINING</h1><div class="flex justify-center mt-3"><div class="badge-pro rounded-full px-4 py-1.5 text-[11px] tracking-[2px] font-bold text-[#6ab8ff]">PRO • ELITE</div></div><p class="text-[11px] tracking-[3px] text-zinc-500 font-bold mt-6">PREMIUM COACHING SYSTEM</p></div><div class="glass-elite rounded-[28px] p-7"><p class="text-[10px] tracking-[2px] text-[#6ab8ff] font-bold mb-3">SELECT ATHLETE</p><select id="sel" class="w-full bg-[#0a0f1e] border border-[#1e2f50] rounded-2xl p-4 text-sm font-bold"><option value="0">Marcus Vance</option><option value="1">Amara Osei</option><option value="2">Dante Moretti</option><option value="3">Sofia Ricci</option><option value="4">Luca Bianchi</option></select><p class="text-[10px] tracking-[2px] text-zinc-500 font-bold mb-3 mt-5">ACCESS CODE</p><input id="pw" type="password" placeholder="••••••••" class="w-full bg-[#0a0f1e] border border-[#1e2f50] rounded-2xl p-4 text-sm"><div class="flex justify-between mt-3 text-[10px] text-zinc-600"><span>Trainer: sdc2024</span><span>Client: cliente123</span></div><button onclick="entra()" class="w-full mt-6 btn-elite rounded-full py-4 text-[13px] tracking-[1px] text-white">ENTRA NEL SISTEMA →</button><p class="text-[10px] text-center mt-4 text-emerald-400 font-bold">● SYSTEM ONLINE</p></div></div></div><div id="app" class="hidden relative z-10"><div class="p-6 flex justify-between items-center"><div><h2 class="text-[28px] font-black leading-none">Welcome back,<br><span id="hName" class="sdc-text text-[28px]">Alex</span></h2></div><div id="roleBadge" class="badge-pro rounded-full px-3 py-1 text-[9px] font-bold"></div></div><div id="page-scheda" class="px-5"><div class="glass-elite rounded-[24px] p-5"><div class="flex justify-between"><div><p class="text-[11px] tracking-[2px] text-[#4a9eff] font-bold">TODAY'S SESSION</p><h3 class="font-black text-[22px] mt-1">STRENGTH & POWER — 45 MIN</h3></div><button onclick="addEx()" class="btn-elite rounded-full px-4 py-2 text-[11px] text-white">+ EX</button></div><div id="exList" class="mt-5 space-y-2"></div></div><div class="mt-5 grid grid-cols-3 gap-3"><div class="glass-elite rounded-[20px] p-4 text-center"><p class="font-black text-[18px]" id="stat1">0</p><p class="text-[9px] text-zinc-500">ACTIVE CAL</p></div><div class="glass-elite rounded-[20px] p-4 text-center"><p class="font-black text-[18px]">3 DAYS</p><p class="text-[9px] text-zinc-500">STREAK</p></div><div class="glass-elite rounded-[20px] p-4 text-center"><p class="font-black text-[18px]">132</p><p class="text-[9px] text-zinc-500">BPM</p></div></div></div><div id="page-appuntamenti" class="hidden px-5"><div class="flex justify-between"><h2 class="font-black text-xl">BOOKING</h2><button onclick="addAp()" class="btn-elite rounded-full px-4 py-2 text-xs text-white">+ Nuovo</button></div><div id="apList" class="mt-5"></div></div><div id="page-peso" class="hidden px-5"><div class="flex justify-between"><h2 class="font-black text-xl">BODY TRACK</h2><button onclick="addW()" class="btn-elite rounded-full px-4 py-2 text-xs text-white">+ Peso</button></div><div id="wList" class="mt-5"></div></div><div id="page-pay" class="hidden px-5"><h2 class="font-black text-xl">PAYMENTS</h2><div id="payList" class="mt-4"></div><button onclick="addPay()" class="btn-elite rounded-full px-4 py-2 text-xs mt-3 text-white">+ Incasso</button></div></div><div id="nav" class="hidden fixed bottom-5 left-5 right-5 glass-elite rounded-[28px] flex justify-around p-2 z-50"><button onclick="showPage('scheda')" id="n-scheda" class="px-5 py-2 rounded-2xl bg-[#1a253e] text-[#4a9eff] text-[10px] font-bold">HOME</button><button onclick="showPage('appuntamenti')" id="n-appuntamenti" class="px-5 py-2 text-zinc-500 text-[10px] font-bold">BOOK</button><button onclick="showPage('peso')" id="n-peso" class="px-5 py-2 text-zinc-500 text-[10px] font-bold">TRACK</button><button onclick="showPage('pay')" id="n-pay" class="px-5 py-2 text-zinc-500 text-[10px] font-bold">PAY</button></div><script>const firebaseConfig={apiKey:"AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",authDomain:"sdc-fitness.firebaseapp.com",databaseURL:"https://sdc-fitness-default-rtdb.firebaseio.com",projectId:"sdc-fitness",storageBucket:"sdc-fitness.firebasestorage.app",messagingSenderId:"817117949572",appId:"1:817117949572:web:b74a51081ecaf640d91cd1"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let clients=["Marcus Vance","Amara Osei","Dante Moretti","Sofia Ricci","Luca Bianchi"],cur=0,curName="",isTrainer=false;
function entra(){let p=document.getElementById('pw').value.trim();if(p!=="sdc2024"&&p!=="cliente123"){alert("Codice: sdc2024");return;}isTrainer=(p==="sdc2024");cur=document.getElementById('sel').value;curName=clients[cur];document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('nav').style.display='flex';document.getElementById('hName').innerText=curName;document.getElementById('roleBadge').innerHTML=isTrainer?'<span class="text-[#4a9eff]">● TRAINER</span>':'<span class="text-zinc-500">● CLIENT</span>';showPage('scheda');listenAll();}
function showPage(p){['scheda','appuntamenti','peso','pay'].forEach(x=>{document.getElementById('page-'+x).classList.add('hidden');});document.getElementById('page-'+p).classList.remove('hidden');}
function listenAll(){db.ref('schede/'+cur).on('value',s=>{let ex=s.val()||[];let h="";for(let i=0;i<ex.length;i++)h+=`<div class="bg-[#0f1628] border border-[#1e2f50] rounded-2xl p-4 flex justify-between items-center"><div><p class="font-bold text-[13px]">${ex[i].name}</p><p class="text-[11px] text-[#4a9eff]">${ex[i].serie} x ${ex[i].rep}</p></div><button onclick="delEx(${i})" class="text-zinc-600">✕</button></div>`;document.getElementById('exList').innerHTML=h||`<div class="bg-[#0f1628] rounded-2xl p-8 text-center border border-dashed border-[#1e2f50]"><p class="text-zinc-500 text-[12px]">Tap + EX per aggiungere</p></div>`;document.getElementById('stat1').innerText=(ex.length*127);});db.ref('peso/'+cur).on('value',s=>{let w=s.val()||[];let h="";for(let i=0;i<w.length;i++)h+=`<div class="glass-elite rounded-2xl p-4 mb-2 flex justify-between"><span class="text-sm">${w[i].data} • <b class="text-[#4a9eff]">${w[i].kg}kg</b></span><button onclick="delW(${i})" class="text-zinc-600">✕</button></div>`;document.getElementById('wList').innerHTML=h;});db.ref('appuntamenti/'+cur).on('value',s=>{let a=s.val()||[];let h="";for(let i=0;i<a.length;i++)h+=`<div class="glass-elite rounded-2xl p-4 mb-2 flex justify-between"><span class="text-sm"><b>${a[i].cliente}</b> — ${a[i].ora}</span><button onclick="delAp(${i})" class="text-zinc-600">✕</button></div>`;document.getElementById('apList').innerHTML=h;});db.ref('pagamenti').on('value',s=>{let p=s.val()||[];let h="";for(let i=0;i<p.length;i++)h+=`<div class="glass-elite rounded-2xl p-4 mb-2 flex justify-between"><span class="text-sm">${p[i].cliente} — <b class="text-[#4a9eff]">${p[i].importo}</b></span><button onclick="delPay(${i})" class="text-zinc-600">✕</button></div>`;document.getElementById('payList').innerHTML=h;});}
function addEx(){let n=prompt("Esercizio:");if(!n)return;let se=prompt("Serie:","4"),re=prompt("Rip:","10");db.ref('schede/'+cur).once('value',s=>{let a=s.val()||[];a.push({name:n,serie:se,rep:re});db.ref('schede/'+cur).set(a);});}
function addW(){let kg=prompt("Peso:","80");if(kg){db.ref('peso/'+cur).once('value',s=>{let a=s.val()||[];a.push({data:new Date().toLocaleDateString(),kg});db.ref('peso/'+cur).set(a);});}}
function addAp(){let o=prompt("Orario:","09:00");if(o){db.ref('appuntamenti/'+cur).once('value',s=>{let a=s.val()||[];a.push({cliente:curName,ora:o});db.ref('appuntamenti/'+cur).set(a);});}}
function addPay(){let imp=prompt("Importo:","150€");if(imp){db.ref('pagamenti').once('value',s=>{let a=s.val()||[];a.unshift({cliente:curName,importo:imp});db.ref('pagamenti').set(a);});}}
function delEx(i){db.ref('schede/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('schede/'+cur).set(a);});}function delW(i){db.ref('peso/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('peso/'+cur).set(a);});}function delAp(i){db.ref('appuntamenti/'+cur).once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('appuntamenti/'+cur).set(a);});}function delPay(i){db.ref('pagamenti').once('value',s=>{let a=s.val()||[];a.splice(i,1);db.ref('pagamenti').set(a);});}
</script></body></html>
