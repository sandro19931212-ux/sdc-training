:root{--bg:#03060d;--panel:#0b1220;--panel2:#101a2c;--line:#1e3358;--blue:#58b7ff;--blue2:#2c5cff;--muted:#8291ad;--danger:#ff607d;--ok:#4ee1a0;--shadow:0 0 28px rgba(64,136,255,.18)}

600px at 50% 25%,rgba(50,119,255,.22),transparent 58%)}.loginbox{width:min(100%,430px);text-align:center}.logo{width:152px;height:152px;border:2px solid #5ea3ff;transform:rotate(45deg);margin:0 auto 48px;border-radius:8px;box-shadow:0 0 32px rgba(59,132,255,.58);display:grid;place-items:center}.logo span{transform:rotate(-45deg);font-size:46px;letter-spacing:7px}.login-card{text-align:left;padding:24px}.formgap>*+*{margin-top:15px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.role-pill{padding:8px 11px;border-radius:999px;background:#10213c;border:1px solid #254a7c;color:#79bdff;font-size:10px;font-weight:900;letter-spacing:1px}.hero{padding:22px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-80px;top:-100px;background:#1b76ff;filter:blur(55px);opacity:.32}.hero>*{position:relative;z-index:1}.hero h2{font-size:27px;margin:7px 0}.quick{margin-top:14px}.stat{padding:16px;text-align:center}.stat b{display:block;font-size:23px;margin-top:6px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}.section-head h2{font-size:19px;margin:0}.list{display:grid;gap:10px}.item{padding:16px}.item h3{font-size:15px;margin:0 0 5px}.item p{margin:3px 0;font-size:12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{font-size:10px;font-weight:800;border-radius:999px;padding:6px 9px;color:#9dcbff;background:#101d33;border:1px solid #27456f}.days{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.day{white-space:nowrap;border:1px solid #243c63;background:#0b1425;color:#8fa2c2;border-radius:14px;padding:10px 13px;font-weight:800}.day.active{color:#fff;background:linear-gradient(135deg,#4e9eff,#2859ff);box-shadow:0 0 18px rgba(61,129,255,.4)}.exercise{display:grid;grid-template-columns:1fr auto;gap:10px}.load{width:90px;text-align:center}.nav{position:fixed;z-index:50;left:12px;right:12p <body>
<div id="toast" class="toast hidden"></div>
<section id="login" class="screen login">
 <div class="loginbox">

   <div><label>Accesso</label><select id="loginRole" class="field"><option value="client">Cliente</option><option value="admin">Personal trainer</option></select></div>
   <div id="adminUsernameWrap" class="hidden"><label>Nome utente trainer</label><input id="adminUsername" class="field" autocomplete="username" placeholder="SDCTrainer"></div>
   <div id="clientSelectWrap"><label>Cliente</label><select id="loginClient" class="field"></select></div>

 </div>
</section>

<script>
const firebaseConfig={apiKey:"AIzaSyBF1MqBEjvmrI1YJi8xCzLuePlcYOsmLdo",authDomain:"sdc-fitness.firebaseapp.com",databaseURL:"https://sdc-fitness-default-rtdb.firebaseio.com",projectId:"sdc-fitness",storageBucket:"sdc-fitness.firebasestorage.app",messagingSenderId:"817117949572",appId:"1:817117949572:web:b74a51081ecaf640d91cd1"};
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const KEY='sdc_training_v10';
const seed={adminUsername:'SDCTrainer',adminPassword:'SDC!Elite26#PT',clients:{marcus:{name:'Marcus Vance',password:'marcus',weight:82,target:78,notes:'Obiettivo: forza e definizione'},sofia:{name:'Sofia Ricci',password:'sofia',weight:61,target:58,notes:'Obiettivo: tonificazione'}},workouts:{marcus:{Lunedì:{title:'Petto e tricipiti',exercises:[{id:'e1',name:'Panca piana',sets:4,reps:'8-10',rest:90,load:70},{id:'e2',name:'Croci ai cavi',sets:3,reps:'12',rest:60,load:18},{id:'e3',name:'Push down',sets:4,reps:'10-12',rest:60,load:30}]},Mercoledì:{title:'Dorso e bicipiti',exercises:[{id:'e4',name:'Lat machine',sets:4,reps:'10',rest:75,load:55}]},Venerdì:{title:'Gambe',exercises:[{id:'e5',name:'Squat',sets:4,reps:'8',rest:120,load:80}]}},sofia:{Martedì:{title:'Full body',exercises:[{id:'e6',name:'Goblet squat',sets:4,reps:'12',rest:60,load:18}]}}},payments:{marcus:[{id:'p1',date:'2026-09-01',amount:150,status:'Pagato',note:'Mensile settembre'}],sofia:[{id:'p2',date:'2026-09-05',amount:120,status:'Pagato',note:'Pacchetto 8 lezioni'}]},appointments:{marcus:[{id:'a1',date:'2026-09-15',time:'18:00',title:'Allenamento PT'}],sofia:[{id:'a2',date:'2026-09-16',time:'09:30',title:'Controllo progressi'}]},weightHistory:{marcus:[{date:'2026-09-01',value:83},{date:'2026-09-12',value:82}],sofia:[{date:'2026-09-01',value:62},{date:'2026-09-12',value:61}]}};
let state=loadLocal(),session={role:null,clientId:null,page:'dashboard'},db=null,remoteReady=false,unsubscribe=null;
function clone(v){return JSON.parse(JSON.stringify(v))}function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY))||clone(seed)}catch(e){return clone(seed)}}function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
function initFirebase(){try{if(firebaseConfig.apiKey){firebase.initializeApp(firebaseConfig);db=firebase.database();db.ref('appV10').on('value',s=>{if(s.exists()){state=normalise(s.val());saveLocal();renderAll()}else db.ref('appV10').set(state);remoteReady=true},()=>{remoteReady=false})}}catch(e){remoteReady=false}}
function normalise(x){x=x||{};['clients','workouts','payments','appointments','weightHistory'].forEach(k=>x[k]=x[k]||{});x.adminUsername='SDCTrainer';x.adminPassword='SDC!Elite26#PT';return x}
function persist(){saveLocal();if(db)db.ref('appV10').set(state).catch(()=>{});renderAll()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function money(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v)||0)}function isoToday(){return new Date().toISOString().slice(0,10)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2200)}
function clients(){return Object.entries(state.clients).sort((a,b)=>a[1].name.localeCompare(b[1].name))}function current(){return state.clients[session.clientId]}function curWorkout(){state.workouts[session.clientId]=state.workouts[session.clientId]||{};return state.workouts[session.clientId]}
function fillClientSelects(){const opts=clients().map(([k,c])=>'<option value="'+k+'">'+esc(c.name)+'</option>').join('');document.getElementById('loginClient').innerHTML=opts;document.getElementById('adminClientSwitch').innerHTML=opts;if(session.clientId)document.getElementById('adminClientSwitch').value=session.clientId}
function login(){const role=document.getElementById('loginRole').value,pw=document.getElementById('loginPassword').value;if(role==='admin'){const username=document.getElementById('adminUsername').value.trim();if(username!=='SDCTrainer'||pw!=='SDC!Elite26#PT')return toast('Nome utente o password trainer non corretti');session={role:'admin',clientId:clients()[0]?.[0]||null,page:'dashboard'}}else{const cid=document.getElementById('loginClient').value;if(!state.clients[cid]||pw!==state.clients[cid].password)return toast('Credenziali non corrette');session={role:'client',clientId:cid,page:'dashboard'}}if(!session.clientId&&role==='admin'){openClientModal();return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.body.className=role;renderAll()}
function logout(){session={role:null,clientId:null,page:'dashboard'};document.body.className='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('loginPassword').value=''}
function showPage(p){session.page=p;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderPage(p);window.scrollTo(0,0)}
function renderAll(){fillClientSelects();if(!session.role)return;if(!state.clients[session.clientId])session.clientId=clients()[0]?.[0]||null;if(!session.clientId)return;document.body.className=session.role;document.getElementById('welcome').innerHTML='Ciao, <b style="color:#fff">'+esc(current().name)+'</b>';document.getElementById('roleBadge').textContent=session.role==='admin'?'TRAINER':'CLIENTE';document.getElementById('adminClientSwitch').value=session.clientId;showPage(session.page)}
function nextAppointment(){return (state.appointments[session.clientId]||[]).filter(a=>a.date>=isoToday()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]}
function todayWorkout(){const day=DAYS[(new Date().getDay()+6)%7];const w=curWorkout();return {day,work:w[day]||Object.values(w)[0]}}
function renderDashboard(){const c=current(),tw=todayWorkout(),ap=nextAppointment(),paid=(state.payments[session.clientId]||[]).filter(p=>p.status==='Pagato').length;document.getElementById('page-dashboard').innerHTML='<div class="card hero"><div class="eyebrow">Allenamento di oggi</div><h2>'+esc(tw.work?.title||'Giorno di recupero')+'</h2><p class="muted">'+esc(tw.day)+' · '+(tw.work?.exercises?.length||0)+' esercizi</p><button class="btn mt" onclick="showPage('scheda')">APRI SCHEDA →</button></div><div class="grid3 quick"><div class="card stat"><span class="eyebrow">Peso</span><b>'+esc(c.weight||'-')+' kg</b></div><div class="card stat"><span class="eyebrow">Obiettivo</span><b>'+esc(c.target||'-')+' kg</b></div><div class="card stat"><span class="eyebrow">Pagamenti</span><b>'+paid+'</b></div></div><div class="section-head"><h2>Accessi rapidi</h2></div><div class="grid2"><button class="card item" onclick="showPage('appuntamenti')" style="color:white;text-align:left"><div class="eyebrow">Prossimo appuntamento</div><h3 style="margin-top:9px">'+(ap?esc(ap.date)+' · '+esc(ap.time):'Nessun appuntamento')+'</h3></button><button class="card item" onclick="showPage('profilo')" style="color:white;text-align:left"><div class="eyebrow">Aggiorna</div><h3 style="margin-top:9px">Peso e profilo</h3></button></div><div class="section-head"><h2>Nota del trainer</h2></div><div class="card item"><p style="font-size:14px;color:#b8c5db">'+esc(c.notes||'Nessuna nota inserita.')+'</p></div>'}
let selectedDay=DAYS[(new Date().getDay()+6)%7];
function renderScheda(){const w=curWorkout();if(!w[selectedDay]){const first=Object.keys(w)[0];if(first&&!DAYS.includes(selectedDay))selectedDay=first}const plan=w[selectedDay];document.getElementById('page-scheda').innerHTML='<div class="section-head" style="margin-top:0"><div><div class="eyebrow">Programma</div><h2>Scheda settimanale</h2></div><button class="btn admin-only" onclick="openWorkoutModal()">+ GIORNO</button></div><div class="days">'+DAYS.map(d=>'<button class="day '+(d===selectedDay?'active':'')+'" onclick="selectedDay=''+d+'';renderScheda()">'+d.slice(0,3)+'</button>').join('')+'</div><div class="card item"><div class="row between"><div><div class="eyebrow">'+esc(selectedDay)+'</div><h2 style="margin:6px 0">'+esc(plan?.title||'Riposo')+'</h2></div>'+(plan?'<div class="row admin-flex"><button class="iconbtn" onclick="openWorkoutModal(''+selectedDay+'')">✎</button><button class="iconbtn" onclick="deleteWorkout(''+selectedDay+'')">✕</button></div>':'')+'</div></div><div class="section-head"><h2>Esercizi</h2>'+(plan?'<button class="btn admin-only" onclick="openExerciseModal(''+selectedDay+'')">+ ESERCIZIO</button>':'')+'</div><div class="list">'+(!plan||!plan.exercises?.length?'<div class="empty">Nessun esercizio per questo giorno.</div>':plan.exercises.map(e=>'<article class="card item exercise"><div><h3>'+esc(e.name)+'</h3><div class="chips"><span class="chip">'+esc(e.sets)+' serie</span><span class="chip">'+esc(e.reps)+' rip.</span><span class="chip">'+esc(e.rest||0)+' sec recupero</span></div></div><div><label>Carico kg</label><input class="field load" type="number" step="0.5" value="'+esc(e.load||0)+'" onchange="updateLoad(''+selectedDay+'',''+e.id+'',this.value)"><div class="row admin-flex" style="justify-content:flex-end;margin-top:8px"><button class="iconbtn" onclick="openExerciseModal(''+selectedDay+'',''+e.id+'')">✎</button><button class="iconbtn" onclick="deleteExercise(''+selectedDay+'',''+e.id+'')">✕</button></div></div></article>').join(''))+'</div>'}
function renderPayments(){const arr=(state.payments[session.clientId]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('page-pagamenti').innerHTML='<div class="section-head" style="margin-top:0"><div><div class="eyebrow">Contabilità</div><h2>Pagamenti</h2></div><button class="btn admin-only" onclick="openPaymentModal()">+ PAGAMENTO</button></div><div class="list">'+(arr.length?arr.map(p=>'<article class="card item row between"><div><h3>'+esc(p.note||'Pagamento')+'</h3><p>'+esc(p.date)+' · <span class="amount '+(p.status==='Pagato'?'ok':'no')+'">'+esc(p.status)+'</span></p></div><div style="text-align:right"><b>'+money(p.amount)+'</b><div class="admin-flex row" style="margin-top:8px"><button class="iconbtn" onclick="openPaymentModal(''+p.id+'')">✎</button><button class="iconbtn" onclick="deleteRecord('payments',''+p.id+'')">✕</button></div></div></article>').join(''):'<div class="empty">Nessun pagamento registrato.</div>')+'</div>'}
function renderAppointments(){const arr=(state.appointments[session.clientId]||[]).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));document.getElementById('page-appuntamenti').innerHTML='<div class="section-head" style="margin-top:0"><div><div class="eyebrow">Agenda</div><h2>Appuntamenti</h2></div><button class="btn admin-only" onclick="openAppointmentModal()">+ APPUNTAMENTO</button></div><div class="list">'+(arr.length?arr.map(a=>'<article class="card item row between"><div><h3>'+esc(a.title)+'</h3><p>'+esc(a.date)+' · '+esc(a.time)+'</p></div><div class="admin-flex row"><button class="iconbtn" onclick="openAppointmentModal(''+a.id+'')">✎</button><button class="iconbtn" onclick="deleteRecord('appointments',''+a.id+'')">✕</button></div></article>').join(''):'<div class="empty">Nessun appuntamento programmato.</div>')+'</div>'}
function renderProfile(){const c=current(),hist=(state.weightHistory[session.clientId]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('page-profilo').innerHTML='<div class="card item"><div class="eyebrow">Profilo atleta</div><h2>'+esc(c.name)+'</h2><div class="profile-weight">'+esc(c.weight||'-')+' <span style="font-size:16px;color:#8aa0c2">kg</span></div><div class="grid2 mt"><div><label>Peso attuale</label><input id="profileWeight" class="field" type="number" step="0.1" value="'+esc(c.weight||'')+'"></div><div><label>Peso obiettivo</label><input id="profileTarget" class="field" type="number" step="0.1" value="'+esc(c.target||'')+'" '+(session.role==='client'?'disabled':'')+'></div></div><button class="btn mt" onclick="saveWeight()">SALVA PESO</button></div><div class="section-head"><h2>Storico peso</h2></div><div class="list">'+(hist.length?hist.map(h=>'<div class="card item row between"><span>'+esc(h.date)+'</span><b>'+esc(h.value)+' kg</b></div>').join(''):'<div class="empty">Nessuna rilevazione.</div>')+'</div><div class="section-head admin-flex"><h2>Gestione cliente</h2><button class="btn" onclick="openClientModal(''+session.clientId+'')">MODIFICA</button></div><div class="card item admin-only"><p>'+esc(c.notes||'Nessuna nota')+'</p><div class="actions"><button class="btn secondary" onclick="openClientModal()">NUOVO CLIENTE</button><button class="btn danger" onclick="deleteClient()">RIMUOVI</button></div></div>'}
function renderPage(p){({dashboard:renderDashboard,scheda:renderScheda,pagamenti:renderPayments,appuntamenti:renderAppointments,profilo:renderProfile})[p]()}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function val(id){return document.getElementById(id).value.trim()}
function openClientModal(cid){const c=cid?state.clients[cid]:{};openModal(cid?'Modifica cliente':'Nuovo cliente','<div class="formgap"><div><label>Nome e cognome</label><input id="mName" class="field" value="'+esc(c.name||'')+'"></div><div><label>Password cliente</label><input id="mPassword" class="field" value="'+esc(c.password||'')+'"></div><div class="grid2"><div><label>Peso kg</label><input id="mWeight" type="number" step="0.1" class="field" value="'+esc(c.weight||'')+'"></div><div><label>Obiettivo kg</label><input id="mTarget" type="number" step="0.1" class="field" value="'+esc(c.target||'')+'"></div></div><div><label>Note trainer</label><textarea id="mNotes" class="field" rows="3">'+esc(c.notes||'')+'</textarea></div><button class="btn" style="width:100%" onclick="saveClient(''+(cid||'')+'')">SALVA CLIENTE</button></div>')}
function saveClient(cid){const name=val('mName'),password=val('mPassword');if(!name||!password)return toast('Inserisci nome e password');const key=cid||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'-'+id().slice(-3);state.clients[key]={name,password,weight:Number(val('mWeight'))||0,target:Number(val('mTarget'))||0,notes:val('mNotes')};state.workouts[key]=state.workouts[key]||{};state.payments[key]=state.payments[key]||[];state.appointments[key]=state.appointments[key]||[];state.weightHistory[key]=state.weightHistory[key]||[];session.clientId=key;closeModal();persist();toast('Cliente salvato')}
function deleteClient(){if(!confirm('Rimuovere definitivamente questo cliente e tutti i suoi dati?'))return;const k=session.clientId;delete state.clients[k];delete state.workouts[k];delete state.payments[k];delete state.appointments[k];delete state.weightHistory[k];session.clientId=clients()[0]?.[0]||null;persist();if(!session.clientId){logout();toast('Aggiungi un nuovo cliente')}}
function openWorkoutModal(day){const p=curWorkout()[day]||{};openModal(day?'Modifica giornata':'Aggiungi giornata','<div class="formgap"><div><label>Giorno</label><select id="mDay" class="field">'+DAYS.map(d=>'<option '+(d===day?'selected':'')+'>'+d+'</option>').join('')+'</select></div><div><label>Titolo allenamento</label><input id="mWorkoutTitle" class="field" value="'+esc(p.title||'')+'" placeholder="Es. Petto e tricipiti"></div><button class="btn" style="width:100%" onclick="saveWorkout(''+(day||'')+'')">SALVA GIORNATA</button></div>')}
function saveWorkout(oldDay){const day=val('mDay'),title=val('mWorkoutTitle');if(!title)return toast('Inserisci il titolo');const w=curWorkout(),old=w[oldDay]||{exercises:[]};if(oldDay&&oldDay!==day)delete w[oldDay];w[day]={title,exercises:old.exercises||[]};selectedDay=day;closeModal();persist()}
function deleteWorkout(day){if(confirm('Eliminare questa giornata e tutti gli esercizi?')){delete curWorkout()[day];persist()}}
function openExerciseModal(day,eid){const list=curWorkout()[day]?.exercises||[],e=list.find(x=>x.id===eid)||{};openModal(eid?'Modifica esercizio':'Nuovo esercizio','<div class="formgap"><div><label>Esercizio</label><input id="mExName" class="field" value="'+esc(e.name||'')+'"></div><div class="grid2"><div><label>Serie</label><input id="mSets" type="number" class="field" value="'+esc(e.sets||4)+'"></div><div><label>Ripetizioni</label><input id="mReps" class="field" value="'+esc(e.reps||'10')+'"></div></div><div class="grid2"><div><label>Recupero sec</label><input id="mRest" type="number" class="field" value="'+esc(e.rest||60)+'"></div><div><label>Carico kg</label><input id="mLoad" type="number" step="0.5" class="field" value="'+esc(e.load||0)+'"></div></div><button class="btn" style="width:100%" onclick="saveExercise(''+day+'',''+(eid||'')+'')">SALVA ESERCIZIO</button></div>')}
function saveExercise(day,eid){const list=curWorkout()[day].exercises||(curWorkout()[day].exercises=[]),obj={id:eid||id(),name:val('mExName'),sets:Number(val('mSets'))||1,reps:val('mReps'),rest:Number(val('mRest'))||0,load:Number(val('mLoad'))||0};if(!obj.name)return toast('Inserisci il nome');const i=list.findIndex(x=>x.id===eid);if(i>=0)list[i]=obj;else list.push(obj);closeModal();persist()}
function deleteExercise(day,eid){if(confirm('Eliminare questo esercizio?')){const a=curWorkout()[day].exercises;curWorkout()[day].exercises=a.filter(x=>x.id!==eid);persist()}}
function updateLoad(day,eid,v){const e=curWorkout()[day].exercises.find(x=>x.id===eid);if(e){e.load=Number(v)||0;persist();toast('Carico aggiornato')}}
function openPaymentModal(pid){const arr=state.payments[session.clientId]||[],p=arr.find(x=>x.id===pid)||{};openModal(pid?'Modifica pagamento':'Nuovo pagamento','<div class="formgap"><div class="grid2"><div><label>Data</label><input id="mPayDate" type="date" class="field" value="'+esc(p.date||isoToday())+'"></div><div><label>Importo €</label><input id="mAmount" type="number" step="0.01" class="field" value="'+esc(p.amount||'')+'"></div></div><div><label>Stato</label><select id="mStatus" class="field"><option '+(p.status==='Pagato'?'selected':'')+'>Pagato</option><option '+(p.status==='Da pagare'?'selected':'')+'>Da pagare</option></select></div><div><label>Descrizione</label><input id="mPayNote" class="field" value="'+esc(p.note||'')+'"></div><button class="btn" style="width:100%" onclick="savePayment(''+(pid||'')+'')">SALVA PAGAMENTO</button></div>')}
function savePayment(pid){const arr=state.payments[session.clientId]||(state.payments[session.clientId]=[]),p={id:pid||id(),date:val('mPayDate'),amount:Number(val('mAmount'))||0,status:val('mStatus'),note:val('mPayNote')};const i=arr.findIndex(x=>x.id===pid);if(i>=0)arr[i]=p;else arr.push(p);closeModal();persist()}
function openAppointmentModal(aid){const arr=state.appointments[session.clientId]||[],a=arr.find(x=>x.id===aid)||{};openModal(aid?'Modifica appuntamento':'Nuovo appuntamento','<div class="formgap"><div><label>Titolo</label><input id="mApTitle" class="field" value="'+esc(a.title||'Allenamento PT')+'"></div><div class="grid2"><div><label>Data</label><input id="mApDate" type="date" class="field" value="'+esc(a.date||isoToday())+'"></div><div><label>Ora</label><input id="mApTime" type="time" class="field" value="'+esc(a.time||'09:00')+'"></div></div><button class="btn" style="width:100%" onclick="saveAppointment(''+(aid||'')+'')">SALVA APPUNTAMENTO</button></div>')}
function saveAppointment(aid){const arr=state.appointments[session.clientId]||(state.appointments[session.clientId]=[]),a={id:aid||id(),title:val('mApTitle'),date:val('mApDate'),time:val('mApTime')};const i=arr.findIndex(x=>x.id===aid);if(i>=0)arr[i]=a;else arr.push(a);closeModal();persist()}
function deleteRecord(type,rid){if(!confirm('Eliminare questo elemento?'))return;state[type][session.clientId]=(state[type][session.clientId]||[]).filter(x=>x.id!==rid);persist()}
function saveWeight(){const c=current(),v=Number(document.getElementById('profileWeight').value),target=Number(document.getElementById('profileTarget').value);if(!v)return toast('Inserisci un peso valido');c.weight=v;if(session.role==='admin'&&target)c.target=target;const h=state.weightHistory[session.clientId]||(state.weightHistory[session.clientId]=[]),today=isoToday(),old=h.find(x=>x.date===today);if(old)old.value=v;else h.push({date:today,value:v});persist();toast('Peso aggiornato')}
document.getElementById('loginRole').onchange=e=>{const admin=e.target.value==='admin';document.getElementById('clientSelectWrap').classList.toggle('hidden',admin);document.getElementById('adminUsernameWrap').classList.toggle('hidden',!admin)};document.getElementById('loginBtn').onclick=login;document.getElementById('loginPassword').onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('logoutBtn').onclick=logout;document.getElementById('adminClientSwitch').onchange=e=>{session.clientId=e.target.value;renderAll()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
fillClientSelects();initFirebase();
</script>
</body>
</html>
